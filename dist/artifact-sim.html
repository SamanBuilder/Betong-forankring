// ---------------------------------------------------------------------------
//  NS-EN 1992-4:2018 - forankring i betong.
//  Standarden dekker forankringer MED FOT (headed fasteners): bolthode,
//  endemutter eller innstøpt plate i boltenden.  Uten fot - ren
//  heftforankring av kamstål eller gjengestang - har EN 1992-4 ingen modell;
//  de kontrollene hoppes over med henvisning til Betongelementboka B19
//  pkt. 19.3.3 og 19.3.4 (se src/engine/b19.js).
//
//  Hver kontroll registrerer utregninga si i et Calc-objekt: inndata med kilde,
//  hvert mellomledd symbolsk og med tall, og punktet i standarden. Det er den
//  registreringa resultatruta viser fram.
//
//  VIKTIG: alle tallkonstanter ligger samlet i K nedenfor, med henvisning til
//  punkt i standarden. De må kontrolleres mot trykt utgave av NS-EN 1992-4 +
//  norsk NA før verktøyet brukes i prosjektering.
// ---------------------------------------------------------------------------

const K = {
  // Betongkjegle, strekk - 7.2.1.4 (7.2)
  k1_cracked: 8.9, k1_uncracked: 12.7,     // innstøpt hodebolt
  // Uttrekk (pull-out) - 7.2.1.5 (7.6)
  k2_cracked: 7.5, k2_uncracked: 10.5,
  // Utblåsing (blow-out) - 7.2.1.9 (7.15)
  k5_cracked: 8.7, k5_uncracked: 12.2,
  // Stålbrudd skjær - 7.2.2.3.1
  k6: 0.6,
  k7_ductile: 1.0, k7_brittle: 0.8,
  // Betongutstøting (pry-out) - 7.2.2.4 (7.39)
  k8_short: 1.0, k8_long: 2.0,             // h_ef < 60 mm / >= 60 mm
  // Kantbrudd skjær - 7.2.2.5 (7.42)
  k9_cracked: 1.7, k9_uncracked: 2.4,
};

const EDGE_LABEL = { xNeg: '−x', xPos: '+x', yNeg: '−y', yPos: '+y' };
const nz = v => (Number.isFinite(v) ? v : 1e9);

const FOOT_TXT = { head: 'bolthodet', nut: 'endemutteren',
                   plate: 'den felles endeplata' };
const FOOT_SRC = {
  head: 'Bolter · hodediameter (EN ISO 13918)',
  nut: 'Bolter · nøkkelvidde på endemutteren',
  plate: 'Bolter · medvirkende sidekant ⌀ + 2·t_p rundt hver bolt',
};
const FOOT_FORMULA = {
  head: 'π · (⌀_h² − ⌀²) / 4',
  nut: '0,866 · NV² − π · ⌀² / 4',
  plate: 'A_eff / n − π · ⌀² / 4,   A_eff = union av (⌀ + 2·t_p) innenfor plata',
};

// Kontroller som forutsetter en forankringsfot. Uten fot (ren heftforankring)
// har EN 1992-4 ingen modell - da vises kontrollen som ikke aktuell, med
// henvisning til B19.
const NO_FOOT =
  'Forankringen har ingen fot (uten endemutter). NS-EN 1992-4 dekker bare ' +
  'forankringer med fot. Heftforankring av kamstål og gjengestang er dekket ' +
  'av Betongelementboka bind B kap. B19, pkt. 19.3.3 og 19.3.4 – bytt ' +
  'regelverk for å få den kontrollen.';
const noFoot = (id, mode, clause, scope) => ({
  id, mode, clause, scope, NRk: Infinity, NRd: Infinity, NEd: 0, util: 0,
  calc: skipped(clause, NO_FOOT), note: NO_FOOT,
});

// ---------------------------------------------------------------------------
//  Materialfaktorer, 4.4.3.1 + NA
// ---------------------------------------------------------------------------
function partialFactors(m) {
  const { fuk, fyk } = m.anchors;
  const gMsN = Math.max(1.2 * fuk / fyk, 1.4);
  const mild = fuk <= 800 && fyk / fuk <= 0.8;
  const gMsV = mild ? Math.max(1.0 * fuk / fyk, 1.25) : 1.5;
  const gMc = m.code.gammaC * m.code.gammaInst;
  return { gMsN, gMsV, gMc, gMp: gMc, gMsp: gMc, gMcb: gMc, mild };
}

// Prosjektert areal for betongkjegle, 7.2.1.4 - union av rektangler klippet
// mot betongdelens frie kanter.
function coneArea(m, pts, ccr) {
  return coneProjection(m, anchorFoot(m), pts, ccr);
}

function minEdge(m, pts) {
  let c = Infinity;
  for (const p of pts) {
    const e = edgeDistances(m, p.x, p.y);
    c = Math.min(c, e.xNeg, e.xPos, e.yNeg, e.yPos);
  }
  return c;
}

// ===========================================================================
//  STREKK
// ===========================================================================

// 7.2.1.3 Stålbrudd - pr. bolt
function tensionSteel(m, res, g) {
  const c = new Calc('7.2.1.3');
  const sh = shaftProps(m);
  const d = c.in('⌀', m.anchors.d, 'mm', 'Bolter');
  const fuk = c.in('f_uk', m.anchors.fuk, 'N/mm²', `Bolter · ${m.anchors.steel}`);
  const gM = c.in('γ_Ms,N', g.gMsN, '–', 'maks(1,2·f_uk/f_yk ; 1,4) – 4.4.3.1');
  const NEd = Math.max(0, ...res.anchors.map(a => a.N));
  c.in('N_Ed', NEd, 'N', 'Største boltestrekk fra kraftfordelinga');

  const As = c.step({
    sym: 'A_s', desc: sh.threaded
      ? 'Spenningsareal A_sp i gjengene' : 'Spenningstverrsnitt i boltskaftet',
    formula: sh.threaded ? 'A_sp (tabell)' : 'π · ⌀² / 4',
    subst: sh.threaded ? `M${n(d, 0)}` : `π · ${n(d, 0)}² / 4`,
    value: sh.As, unit: 'mm²',
  });
  const NRk = c.res({
    sym: 'N_Rk,s', formula: 'A_s · f_uk',
    subst: `${n(As)} · ${n(fuk, 0)}`, value: As * fuk, unit: 'N', ref: '(7.1)',
  });
  const NRd = NRk / gM;
  c.step({
    sym: 'N_Rd,s', desc: 'Dimensjonerende kapasitet',
    formula: 'N_Rk,s / γ_Ms,N', subst: `${n(NRk)} / ${n(gM)}`,
    value: NRd, unit: 'N',
  });
  c.util({ formula: 'N_Ed / N_Rd,s', subst: `${n(NEd)} / ${n(NRd)}`, value: NEd / NRd });

  return { id: 'N-steel', mode: 'Stålbrudd, strekk', clause: '7.2.1.3', scope: 'bolt',
           NRk, NRd, NEd, util: NEd / NRd, calc: c };
}

// 7.2.1.5 Uttrekk (hodetrykk) - pr. bolt
function tensionPullout(m, res, g) {
  const foot = anchorFoot(m);
  if (!foot.hasFoot) return noFoot('N-pullout', 'Uttrekk (hodetrykk)', '7.2.1.5', 'bolt');
  const c = new Calc('7.2.1.5');
  const d = c.in('⌀', m.anchors.d, 'mm', 'Bolter');
  const dh = c.in('⌀_h', foot.eff, 'mm', FOOT_SRC[foot.kind]);
  const fck = c.in('f_ck', m.concrete.fck, 'N/mm²', `Betongdel · ${m.concrete.grade}`);
  const cracked = m.code.cracked;
  const k2 = c.in('k_2', cracked ? K.k2_cracked : K.k2_uncracked, '–',
    `Regelverk · ${cracked ? 'opprisset' : 'uopprisset'} betong`);
  const gM = c.in('γ_Mp', g.gMp, '–', 'γ_c · γ_inst – 4.4.3.1');
  const NEd = Math.max(0, ...res.anchors.map(a => a.N));
  c.in('N_Ed', NEd, 'N', 'Største boltestrekk fra kraftfordelinga');

  const Ah = c.step({
    sym: 'A_h', desc: `Lastopptakende netto areal under ${FOOT_TXT[foot.kind]}`,
    formula: FOOT_FORMULA[foot.kind],
    subst: `${n(foot.Agross, 0)} − π · ${n(d, 0)}² / 4` +
           (foot.limited ? `   (medvirkende sidekant begrenset til ⌀ + 2·t)` : ''),
    value: foot.Ah, unit: 'mm²',
  });
  const NRk = c.res({
    sym: 'N_Rk,p', formula: 'k_2 · A_h · f_ck',
    subst: `${n(k2)} · ${n(Ah)} · ${n(fck, 0)}`, value: k2 * Ah * fck, unit: 'N', ref: '(7.6)',
  });
  const NRd = NRk / gM;
  c.step({ sym: 'N_Rd,p', desc: 'Dimensjonerende kapasitet',
    formula: 'N_Rk,p / γ_Mp', subst: `${n(NRk)} / ${n(gM)}`, value: NRd, unit: 'N' });
  c.util({ formula: 'N_Ed / N_Rd,p', subst: `${n(NEd)} / ${n(NRd)}`, value: NEd / NRd });

  return { id: 'N-pullout', mode: 'Uttrekk (hodetrykk)', clause: '7.2.1.5', scope: 'bolt',
           NRk, NRd, NEd, util: NEd / NRd, calc: c };
}

// 7.2.1.4 Betongkjegle - gruppe av strekkbolter
function tensionConcreteCone(m, res, g) {
  if (!anchorFoot(m).hasFoot)
    return noFoot('N-cone', 'Betongkjegle', '7.2.1.4', 'gruppe');
  const pts = res.tension.anchors;
  if (!pts.length) {
    return { id: 'N-cone', mode: 'Betongkjegle', clause: '7.2.1.4', scope: 'gruppe',
             NRk: Infinity, NRd: Infinity, NEd: 0, util: 0,
             calc: skipped('7.2.1.4', 'Ingen bolter i strekk.'),
             note: 'Ingen bolter i strekk.' };
  }
  const c = new Calc('7.2.1.4');
  const hef = c.in('h_ef', m.anchors.hef, 'mm', 'Bolter · effektiv forankringsdybde');
  const fck = c.in('f_ck', m.concrete.fck, 'N/mm²', `Betongdel · ${m.concrete.grade}`);
  const cracked = m.code.cracked;
  const k1 = c.in('k_1', cracked ? K.k1_cracked : K.k1_uncracked, '–',
    `Regelverk · ${cracked ? 'opprisset' : 'uopprisset'}, innstøpt hodebolt`);
  const gM = c.in('γ_Mc', g.gMc, '–', 'γ_c · γ_inst – 4.4.3.1');
  const nt = c.in('n_strekk', pts.length, 'stk', 'Bolter i strekk fra kraftfordelinga');
  const NEd = c.in('N_Ed,g', res.tension.Ntot, 'N', 'Sum strekk i boltegruppa');

  const scr = c.step({ sym: 's_cr,N', desc: 'Karakteristisk senteravstand',
    formula: '3 · h_ef', subst: `3 · ${n(hef, 0)}`, value: 3 * hef, unit: 'mm', ref: '(7.4)' });
  const ccr = c.step({ sym: 'c_cr,N', desc: 'Karakteristisk kantavstand',
    formula: 's_cr,N / 2 = 1,5 · h_ef', subst: `1,5 · ${n(hef, 0)}`,
    value: 1.5 * hef, unit: 'mm' });

  const N0 = c.step({
    sym: 'N⁰_Rk,c', desc: 'Kjeglekapasitet, én bolt uten kant- eller gruppevirkning',
    formula: 'k_1 · √f_ck · h_ef^1,5',
    subst: `${n(k1)} · √${n(fck, 0)} · ${n(hef, 0)}^1,5`,
    value: k1 * Math.sqrt(fck) * Math.pow(hef, 1.5), unit: 'N', ref: '(7.2)',
  });
  const A0 = c.step({ sym: 'A⁰_c,N', desc: 'Referanseareal for én bolt',
    formula: 's_cr,N²', subst: `${n(scr, 0)}²`, value: scr * scr, unit: 'mm²' });
  const cfoot = anchorFoot(m);
  const Ac = c.step({
    sym: 'A_c,N', desc: 'Faktisk utbruddsareal for gruppa',
    formula: cfoot.common
      ? 'endeplata ± c_cr,N, klippet mot frie kanter'
      : 'union av (⌀ ± c_cr,N) for strekkboltene, klippet mot frie kanter',
    subst: cfoot.common
      ? `felles endeplate ${n(cfoot.plate.bx, 0)} × ${n(cfoot.plate.by, 0)} mm, ` +
        `c_cr,N = ${n(ccr, 0)} mm`
      : `${nt} bolter, c_cr,N = ${n(ccr, 0)} mm`,
    value: coneArea(m, pts, 1.5 * hef), unit: 'mm²', ref: '(7.3)',
  });

  const cmin = minEdge(m, pts);
  const psi_s = c.step({
    sym: 'ψ_s,N', desc: 'Kanteffekt – trykkspenningene forstyrres nær en fri kant',
    formula: '0,7 + 0,3 · c / c_cr,N ≤ 1,0',
    subst: Number.isFinite(cmin)
      ? `0,7 + 0,3 · ${n(cmin, 0)} / ${n(ccr, 0)}` : 'ingen fri kant innenfor c_cr,N',
    value: Number.isFinite(cmin) ? clamp(0.7 + 0.3 * cmin / ccr, 0, 1) : 1.0,
    unit: '–', ref: '(7.4)',
  });
  const psi_re = c.step({
    sym: 'ψ_re,N', desc: 'Tett armering gir finere oppsprekking',
    formula: m.code.denseReinf ? '0,5 + h_ef / 200 ≤ 1,0' : '1,0 (ikke tett armering)',
    subst: m.code.denseReinf ? `0,5 + ${n(hef, 0)} / 200` : '–',
    value: m.code.denseReinf ? clamp(0.5 + hef / 200, 0, 1) : 1.0, unit: '–', ref: '(7.5)',
  });
  const psi_ecx = clamp(1 / (1 + 2 * res.tension.eNx / scr), 0, 1);
  const psi_ecy = clamp(1 / (1 + 2 * res.tension.eNy / scr), 0, 1);
  const psi_ec = c.step({
    sym: 'ψ_ec,N', desc: 'Eksentrisk strekkresultant, regnet hver retning for seg',
    formula: '1 / (1 + 2·e_N/s_cr,N) ≤ 1,0   (x-retning · y-retning)',
    subst: `e_N,x = ${n(res.tension.eNx, 1)} mm → ${n(psi_ecx)} · ` +
           `e_N,y = ${n(res.tension.eNy, 1)} mm → ${n(psi_ecy)}`,
    value: psi_ecx * psi_ecy, unit: '–', ref: '(7.3)',
  });

  const NRk = c.res({
    sym: 'N_Rk,c', formula: 'N⁰_Rk,c · (A_c,N / A⁰_c,N) · ψ_s,N · ψ_re,N · ψ_ec,N',
    subst: `${n(N0)} · (${n(Ac, 0)}/${n(A0, 0)}) · ${n(psi_s)} · ${n(psi_re)} · ${n(psi_ec)}`,
    value: N0 * (Ac / A0) * psi_s * psi_re * psi_ec, unit: 'N', ref: '(7.1)',
  });
  const NRd = NRk / gM;
  c.step({ sym: 'N_Rd,c', desc: 'Dimensjonerende kapasitet',
    formula: 'N_Rk,c / γ_Mc', subst: `${n(NRk)} / ${n(gM)}`, value: NRd, unit: 'N' });
  c.util({ formula: 'N_Ed,g / N_Rd,c', subst: `${n(NEd)} / ${n(NRd)}`, value: NEd / NRd });

  return { id: 'N-cone', mode: 'Betongkjegle', clause: '7.2.1.4', scope: 'gruppe',
           NRk, NRd, NEd, util: NEd / NRd, calc: c };
}

// 7.2.1.9 Utblåsing ved kant - kun når c <= 0,5·h_ef
function tensionBlowout(m, res, g) {
  const foot = anchorFoot(m);
  if (!foot.hasFoot) return noFoot('N-blowout', 'Utblåsing ved kant', '7.2.1.9', 'bolt');
  const hef = m.anchors.hef;
  const Ah = foot.Ah;
  const cracked = m.code.cracked;
  const k5 = cracked ? K.k5_cracked : K.k5_uncracked;

  let worst = null;
  for (const p of res.tension.anchors) {
    const e = edgeDistances(m, p.x, p.y);
    const c1 = Math.min(e.xNeg, e.xPos, e.yNeg, e.yPos);
    if (!Number.isFinite(c1) || c1 > 0.5 * hef) continue;
    const perp = (c1 === e.xNeg || c1 === e.xPos)
      ? Math.min(e.yNeg, e.yPos) : Math.min(e.xNeg, e.xPos);
    const psi_s = clamp(0.7 + 0.3 * nz(perp) / (2 * c1), 0, 1);
    const N0 = k5 * c1 * Math.sqrt(Ah) * Math.sqrt(m.concrete.fck);
    const NRk = N0 * psi_s, NRd = NRk / g.gMcb;
    const cand = { c1, perp, psi_s, N0, NRk, NRd, NEd: p.N, util: p.N / NRd };
    if (!worst || cand.util > worst.util) worst = cand;
  }
  if (!worst) {
    const why = `Ikke aktuell: c > 0,5·h_ef = ${n(0.5 * hef, 0)} mm for alle bolter i strekk.`;
    return { id: 'N-blowout', mode: 'Utblåsing ved kant', clause: '7.2.1.9', scope: 'bolt',
             NRk: Infinity, NRd: Infinity, NEd: 0, util: 0,
             calc: skipped('7.2.1.9', why), note: why };
  }
  const c = new Calc('7.2.1.9');
  c.in('c_1', worst.c1, 'mm', 'Minste kantavstand for bolt i strekk');
  c.in('A_h', Ah, 'mm²', 'Hodeareal, se uttrekkskontrollen');
  c.in('f_ck', m.concrete.fck, 'N/mm²', `Betongdel · ${m.concrete.grade}`);
  c.in('k_5', k5, '–', `Regelverk · ${cracked ? 'opprisset' : 'uopprisset'}`);
  c.in('γ_Mcb', g.gMcb, '–', '4.4.3.1');
  c.in('N_Ed', worst.NEd, 'N', 'Strekk i den styrende bolten');
  c.step({ sym: 'gyldighet', desc: 'Kontrollen er bare aktuell nær en kant',
    formula: 'c_1 ≤ 0,5 · h_ef',
    subst: `${n(worst.c1, 0)} ≤ ${n(0.5 * hef, 0)}`, value: 1, unit: '✓' });
  c.step({ sym: 'N⁰_Rk,cb', desc: 'Grunnverdi utblåsing',
    formula: 'k_5 · c_1 · √A_h · √f_ck',
    subst: `${n(k5)} · ${n(worst.c1, 0)} · √${n(Ah)} · √${n(m.concrete.fck, 0)}`,
    value: worst.N0, unit: 'N', ref: '(7.15)' });
  c.step({ sym: 'ψ_s,Nb', desc: 'Sidekant vinkelrett på c_1',
    formula: '0,7 + 0,3 · c_2 / (2·c_1) ≤ 1,0',
    subst: Number.isFinite(worst.perp)
      ? `0,7 + 0,3 · ${n(worst.perp, 0)} / (2·${n(worst.c1, 0)})` : 'ingen sidekant',
    value: worst.psi_s, unit: '–' });
  c.res({ sym: 'N_Rk,cb', formula: 'N⁰_Rk,cb · ψ_s,Nb',
    subst: `${n(worst.N0)} · ${n(worst.psi_s)}`, value: worst.NRk, unit: 'N' });
  c.step({ sym: 'N_Rd,cb', desc: 'Dimensjonerende kapasitet',
    formula: 'N_Rk,cb / γ_Mcb', subst: `${n(worst.NRk)} / ${n(g.gMcb)}`,
    value: worst.NRd, unit: 'N' });
  c.util({ formula: 'N_Ed / N_Rd,cb',
    subst: `${n(worst.NEd)} / ${n(worst.NRd)}`, value: worst.util });

  return { id: 'N-blowout', mode: 'Utblåsing ved kant', clause: '7.2.1.9', scope: 'bolt',
           NRk: worst.NRk, NRd: worst.NRd, NEd: worst.NEd, util: worst.util, calc: c };
}

// 7.2.1.7 Spalting under last (forenklet)
function tensionSplitting(m, res, g, cone) {
  if (!Number.isFinite(cone.NRk))
    return noFoot('N-split', 'Spalting', '7.2.1.7', 'gruppe');
  const hef = m.anchors.hef;
  const ccr_sp = 2 * hef, hmin = 2 * hef;
  const cmin = minEdge(m, res.tension.anchors);
  const dekket = m.code.supplementaryReinf;
  const geomOk = (Number.isFinite(cmin) ? cmin >= ccr_sp : true) && m.concrete.h >= hmin;

  if (dekket || geomOk) {
    const why = dekket
      ? 'Dekket av spaltearmering – 7.2.1.7(1).'
      : `Ikke nødvendig: c ≥ c_cr,sp = ${n(ccr_sp, 0)} mm og h ≥ h_min = ${n(hmin, 0)} mm.`;
    return { id: 'N-split', mode: 'Spalting', clause: '7.2.1.7', scope: 'gruppe',
             NRk: Infinity, NRd: Infinity, NEd: res.tension.Ntot, util: 0,
             calc: skipped('7.2.1.7', why), note: why };
  }
  const c = new Calc('7.2.1.7');
  c.in('h', m.concrete.h, 'mm', 'Betongdel · tykkelse');
  c.in('h_min', hmin, 'mm', 'Forenklet: 2·h_ef (skal hentes fra ETA)');
  c.in('c_cr,sp', ccr_sp, 'mm', 'Forenklet: 2·h_ef (skal hentes fra ETA)');
  c.in('N_Rk,c', cone.NRk, 'N', 'Fra betongkjeglekontrollen');
  c.in('γ_Msp', g.gMsp, '–', '4.4.3.1');
  const psi_h = c.step({ sym: 'ψ_h,sp', desc: 'Tynn betongdel gir redusert spaltekapasitet',
    formula: '(h / h_min)^(2/3) ≤ 1,0',
    subst: `(${n(m.concrete.h, 0)} / ${n(hmin, 0)})^(2/3)`,
    value: clamp(Math.pow(m.concrete.h / hmin, 2 / 3), 0, 1), unit: '–' });
  const NRk = c.res({ sym: 'N_Rk,sp', formula: 'N_Rk,c · ψ_h,sp',
    subst: `${n(cone.NRk)} · ${n(psi_h)}`, value: cone.NRk * psi_h, unit: 'N' });
  const NRd = NRk / g.gMsp;
  c.step({ sym: 'N_Rd,sp', desc: 'Dimensjonerende kapasitet',
    formula: 'N_Rk,sp / γ_Msp', subst: `${n(NRk)} / ${n(g.gMsp)}`, value: NRd, unit: 'N' });
  const NEd = res.tension.Ntot;
  c.util({ formula: 'N_Ed,g / N_Rd,sp', subst: `${n(NEd)} / ${n(NRd)}`, value: NEd / NRd });

  return { id: 'N-split', mode: 'Spalting', clause: '7.2.1.7', scope: 'gruppe',
           NRk, NRd, NEd, util: NEd / NRd, calc: c,
           note: 'Forenklet: c_cr,sp = 2·h_ef antatt. Skal hentes fra ETA/produktdata.' };
}

// 7.2.2.3 Stålbrudd
function shearSteel(m, res, g) {
  const VEd = Math.max(0, ...res.anchors.map(a => a.V));
  const sh = shaftProps(m);
  const d = m.anchors.d, fuk = m.anchors.fuk;
  // Skjæret går gjennom snittet ved betongoverflata. Er det glatte skaftet
  // der, er tverrsnittet grovere enn gjengene - strekk brytes fortsatt i
  // gjengene, så N_Rd,s under regnes av sh.As.
  const As = sh.Av;

  if (res.leverArm > 0) {
    const c = new Calc('7.2.2.3.2');
    c.in('⌀', d, 'mm', 'Bolter');
    c.in('f_uk', fuk, 'N/mm²', `Bolter · ${m.anchors.steel}`);
    c.in('l_a', res.leverArm, 'mm', 'Plate · avstand fra betong + t/2');
    c.in('γ_Ms,V', g.gMsV, '–', '4.4.3.1');
    c.in('V_Ed', VEd, 'N', 'Største boltskjær fra kraftfordelinga');
    const Wel = c.step({ sym: 'W_el', desc: sh.smooth > 0
        ? 'Elastisk motstandsmoment – glatt skaft ved betongoverflata'
        : 'Elastisk motstandsmoment i skaftet',
      formula: 'π · ⌀_ekv³ / 32', subst: `π · ${n(sh.dV, 1)}³ / 32`,
      value: Math.PI * Math.pow(sh.dV, 3) / 32, unit: 'mm³' });
    const M0 = c.step({ sym: 'M⁰_Rk,s', desc: 'Momentkapasitet uten samtidig strekk',
      formula: '1,2 · W_el · f_uk', subst: `1,2 · ${n(Wel)} · ${n(fuk, 0)}`,
      value: 1.2 * Wel * fuk, unit: 'Nmm', ref: '(7.37)' });
    const NRds = sh.As * fuk / g.gMsN;   // strekk brytes i gjengene
    const NEd = Math.max(0, ...res.anchors.map(a => a.N));
    const MRk = c.step({ sym: 'M_Rk,s', desc: 'Redusert av samtidig strekk i bolten',
      formula: 'M⁰_Rk,s · (1 − N_Ed/N_Rd,s)',
      subst: `${n(M0)} · (1 − ${n(NEd)}/${n(NRds)})`,
      value: M0 * Math.max(0, 1 - NEd / NRds), unit: 'Nmm', ref: '(7.36)' });
    const alphaM = c.in('α_M', 1.0, '–', 'Fritt dreibar plate (2,0 ved full innspenning)');
    const VRk = c.res({ sym: 'V_Rk,s,M', formula: 'α_M · M_Rk,s / l_a',
      subst: `${n(alphaM)} · ${n(MRk)} / ${n(res.leverArm, 0)}`,
      value: alphaM * MRk / res.leverArm, unit: 'N', ref: '(7.35)' });
    const VRd = VRk / g.gMsV;
    c.step({ sym: 'V_Rd,s', desc: 'Dimensjonerende kapasitet',
      formula: 'V_Rk,s,M / γ_Ms,V', subst: `${n(VRk)} / ${n(g.gMsV)}`, value: VRd, unit: 'N' });
    c.util({ formula: 'V_Ed / V_Rd,s', subst: `${n(VEd)} / ${n(VRd)}`, value: VEd / VRd });
    return { id: 'V-steel', mode: 'Stålbrudd, skjær m/ momentarm', clause: '7.2.2.3.2',
             scope: 'bolt', NRk: VRk, NRd: VRd, NEd: VEd, util: VEd / VRd, calc: c };
  }

  const c = new Calc('7.2.2.3.1');
  c.in('⌀', d, 'mm', 'Bolter');
  c.in('f_uk', fuk, 'N/mm²', `Bolter · ${m.anchors.steel}`);
  const k6 = c.in('k_6', K.k6, '–', 'Innstøpt hodebolt – 7.2.2.3.1');
  const k7 = c.in('k_7', m.anchors.ductile ? K.k7_ductile : K.k7_brittle, '–',
    m.anchors.ductile ? 'Duktilt stål (A₅ ≥ 8 %)' : 'Ikke duktilt stål');
  c.in('γ_Ms,V', g.gMsV, '–',
    g.mild ? 'maks(f_uk/f_yk ; 1,25) – 4.4.3.1' : '1,5 – høyfast stål, 4.4.3.1');
  c.in('V_Ed', VEd, 'N', 'Største boltskjær fra kraftfordelinga');
  c.step({ sym: 'A_s', desc: sh.smooth > 0
      ? 'Skjærsnittet ligger i det glatte skaftet, ikke i gjengene'
      : (sh.threaded ? 'Spenningsareal A_sp i gjengene'
                     : 'Spenningstverrsnitt i boltskaftet'),
    formula: sh.smooth > 0 || !sh.threaded ? 'π · ⌀² / 4' : 'A_sp (tabell)',
    subst: sh.smooth > 0 || !sh.threaded
      ? `π · ${n(d, 0)}² / 4` : `M${n(d, 0)}`, value: As, unit: 'mm²' });
  const VRk = c.res({ sym: 'V_Rk,s', formula: 'k_6 · k_7 · A_s · f_uk',
    subst: `${n(k6)} · ${n(k7)} · ${n(As)} · ${n(fuk, 0)}`,
    value: K.k6 * k7 * As * fuk, unit: 'N', ref: '(7.34)' });
  const VRd = VRk / g.gMsV;
  c.step({ sym: 'V_Rd,s', desc: 'Dimensjonerende kapasitet',
    formula: 'V_Rk,s / γ_Ms,V', subst: `${n(VRk)} / ${n(g.gMsV)}`, value: VRd, unit: 'N' });
  c.util({ formula: 'V_Ed / V_Rd,s', subst: `${n(VEd)} / ${n(VRd)}`, value: VEd / VRd });

  return { id: 'V-steel', mode: 'Stålbrudd, skjær', clause: '7.2.2.3.1', scope: 'bolt',
           NRk: VRk, NRd: VRd, NEd: VEd, util: VEd / VRd, calc: c };
}

// 7.2.2.4 Betongutstøting (pry-out)
function shearPryout(m, res, g) {
  if (!anchorFoot(m).hasFoot)
    return noFoot('V-pryout', 'Betongutstøting (pry-out)', '7.2.2.4', 'gruppe');
  const c = new Calc('7.2.2.4');
  const hef = c.in('h_ef', m.anchors.hef, 'mm', 'Bolter');
  const fck = c.in('f_ck', m.concrete.fck, 'N/mm²', `Betongdel · ${m.concrete.grade}`);
  const k8 = c.in('k_8', hef < 60 ? K.k8_short : K.k8_long, '–',
    hef < 60 ? 'h_ef < 60 mm' : 'h_ef ≥ 60 mm');
  const gM = c.in('γ_Mc', g.gMc, '–', '4.4.3.1');
  const VEd = c.in('V_Ed,g', res.shear.Vres, 'N', 'Resultant skjærkraft på gruppa');

  const all = anchorPositions(m);
  const ccr = 1.5 * hef, scr = 3 * hef;
  const cracked = m.code.cracked;
  const k1 = cracked ? K.k1_cracked : K.k1_uncracked;
  const N0 = k1 * Math.sqrt(fck) * Math.pow(hef, 1.5);
  const Ac = coneArea(m, all, ccr), A0 = scr * scr;
  const cmin = minEdge(m, all);
  const psi_s = Number.isFinite(cmin) ? clamp(0.7 + 0.3 * cmin / ccr, 0, 1) : 1.0;
  const psi_re = m.code.denseReinf ? clamp(0.5 + hef / 200, 0, 1) : 1.0;

  c.step({ sym: 'A_c,N', desc: 'Utbruddsareal for ALLE bolter som tar skjær, ikke bare strekkboltene',
    formula: 'union av (⌀ ± c_cr,N), klippet mot frie kanter',
    subst: `${all.length} bolter, c_cr,N = ${n(ccr, 0)} mm`, value: Ac, unit: 'mm²' });
  const NRkc = c.step({
    sym: 'N_Rk,c', desc: 'Kjeglekapasitet for hele boltegruppa',
    formula: 'k_1·√f_ck·h_ef^1,5 · (A_c,N/A⁰_c,N) · ψ_s,N · ψ_re,N',
    subst: `${n(N0)} · (${n(Ac, 0)}/${n(A0, 0)}) · ${n(psi_s)} · ${n(psi_re)}`,
    value: N0 * (Ac / A0) * psi_s * psi_re, unit: 'N', ref: '7.2.1.4',
  });
  const VRk = c.res({ sym: 'V_Rk,cp', formula: 'k_8 · N_Rk,c',
    subst: `${n(k8)} · ${n(NRkc)}`, value: k8 * NRkc, unit: 'N', ref: '(7.39)' });
  const VRd = VRk / gM;
  c.step({ sym: 'V_Rd,cp', desc: 'Dimensjonerende kapasitet',
    formula: 'V_Rk,cp / γ_Mc', subst: `${n(VRk)} / ${n(gM)}`, value: VRd, unit: 'N' });
  c.util({ formula: 'V_Ed,g / V_Rd,cp', subst: `${n(VEd)} / ${n(VRd)}`, value: VEd / VRd });

  return { id: 'V-pryout', mode: 'Betongutstøting (pry-out)', clause: '7.2.2.4', scope: 'gruppe',
           NRk: VRk, NRd: VRd, NEd: VEd, util: VEd / VRd, calc: c };
}

// 7.2.2.5 Kantbrudd i betong
function shearConcreteEdge(m, res, g) {
  const V = res.shear;
  if (V.Vres < 1e-9) {
    const why = 'Ingen skjærkraft på forbindelsen.';
    return { id: 'V-edge', mode: 'Kantbrudd', clause: '7.2.2.5', scope: 'gruppe',
             NRk: Infinity, NRd: Infinity, NEd: 0, util: 0,
             calc: skipped('7.2.2.5', why), note: why };
  }
  const all = anchorPositions(m);
  const cc = m.concrete, a = m.anchors;
  const dnom = a.d;
  const lf = Math.min(a.hef, Math.max(8 * dnom, 300));
  const cracked = m.code.cracked;
  const k9 = cracked ? K.k9_cracked : K.k9_uncracked;
  const psi_re = { none: 1.0, bars: 1.2, 'bars+stirrups': 1.4 }[m.code.edgeReinf] ?? 1.0;

  const cands = [];
  if (V.Vx > 0 && cc.freeEdges.xPos) cands.push({ dir: 'xPos', axis: 'x' });
  if (V.Vx < 0 && cc.freeEdges.xNeg) cands.push({ dir: 'xNeg', axis: 'x' });
  if (V.Vy > 0 && cc.freeEdges.yPos) cands.push({ dir: 'yPos', axis: 'y' });
  if (V.Vy < 0 && cc.freeEdges.yNeg) cands.push({ dir: 'yNeg', axis: 'y' });
  if (!cands.length) {
    const why = 'Ingen fri kant i skjærkraftas retning.';
    return { id: 'V-edge', mode: 'Kantbrudd', clause: '7.2.2.5', scope: 'gruppe',
             NRk: Infinity, NRd: Infinity, NEd: V.Vres, util: 0,
             calc: skipped('7.2.2.5', why), note: why };
  }

  let worst = null;
  for (const cd of cands) {
    const ds = all.map(p => edgeDistances(m, p.x, p.y)[cd.dir]);
    const c1 = Math.min(...ds);
    if (!Number.isFinite(c1)) continue;
    const front = all.filter((p, i) => Math.abs(ds[i] - c1) < 1e-6);
    const axisX = cd.axis === 'x';
    const t = p => (axisX ? p.y : p.x);
    const sideNeg = axisX ? 'yNeg' : 'xNeg', sidePos = axisX ? 'yPos' : 'xPos';
    // Bruddflata er like brei som betongen tillater i boltradens plan. Med en
    // utsparing i kanten er ikke det «fra sidekant til sidekant», men de
    // stykkene der det faktisk staar betong (se solid.js).
    const width = frontWidth(m, axisX ? 'y' : 'x', axisX ? front[0].x : front[0].y,
      front.map(p => [t(p) - 1.5 * c1, t(p) + 1.5 * c1]));
    const hLoc = memberThickness(m, front);
    const height = Math.min(1.5 * c1, hLoc);
    const Ac = width * height, A0 = 4.5 * c1 * c1;
    const alpha = 0.1 * Math.sqrt(lf / c1);
    const beta = 0.1 * Math.pow(dnom / c1, 0.2);
    const V0 = k9 * Math.pow(dnom, alpha) * Math.pow(lf, beta)
             * Math.sqrt(cc.fck) * Math.pow(c1, 1.5);
    const c2 = Math.min(...front.map(p => {
      const e = edgeDistances(m, p.x, p.y); return Math.min(e[sideNeg], e[sidePos]); }));
    const psi_s = Number.isFinite(c2) ? clamp(0.7 + 0.3 * c2 / (1.5 * c1), 0, 1) : 1.0;
    const psi_h = Math.max(1, Math.sqrt(1.5 * c1 / hLoc));
    const comp = axisX ? Math.abs(V.Vx) : Math.abs(V.Vy);
    const cosA = clamp(comp / V.Vres, 0, 1);
    const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
    const psi_a = Math.max(1, Math.sqrt(1 / (cosA * cosA + Math.pow(0.5 * sinA, 2))));
    const eV = Math.abs(front.reduce((s, p) => s + t(p), 0) / front.length);
    const psi_ec = clamp(1 / (1 + 2 * eV / (3 * c1)), 0, 1);
    const VRk = V0 * (Ac / A0) * psi_s * psi_h * psi_a * psi_ec * psi_re;
    const VRd = VRk / g.gMc;
    const cand = { dir: cd.dir, c1, c2, front, width, height, hLoc, Ac, A0, alpha, beta, V0,
                   psi_s, psi_h, psi_a, psi_ec, eV, VRk, VRd, util: V.Vres / VRd };
    if (!worst || cand.util > worst.util) worst = cand;
  }
  if (!worst) {
    const why = 'Ingen fri kant i skjærkraftas retning.';
    return { id: 'V-edge', mode: 'Kantbrudd', clause: '7.2.2.5', scope: 'gruppe',
             NRk: Infinity, NRd: Infinity, NEd: V.Vres, util: 0,
             calc: skipped('7.2.2.5', why), note: why };
  }

  const w = worst;
  const c = new Calc('7.2.2.5');
  c.in('c_1', w.c1, 'mm', `Kantavstand til kant ${EDGE_LABEL[w.dir]}, forreste boltrad`);
  c.in('⌀_nom', dnom, 'mm', 'Bolter');
  c.in('h', w.hLoc, 'mm', w.hLoc === cc.h ? 'Betongdel · tykkelse'
    : 'Betongdel · lokal tykkelse ved fremste boltrad (formene tatt med)');
  c.in('f_ck', cc.fck, 'N/mm²', `Betongdel · ${cc.grade}`);
  c.in('k_9', k9, '–', `Regelverk · ${cracked ? 'opprisset' : 'uopprisset'}`);
  c.in('γ_Mc', g.gMc, '–', '4.4.3.1');
  c.in('V_Ed,g', V.Vres, 'N', 'Resultant skjærkraft på gruppa');

  c.step({ sym: 'l_f', desc: 'Effektiv boltlengde i skjær',
    formula: 'min(h_ef ; maks(8·⌀ ; 300))',
    subst: `min(${n(a.hef, 0)} ; maks(${n(8 * dnom, 0)} ; 300))`, value: lf, unit: 'mm' });
  c.step({ sym: 'α', desc: 'Eksponent for boltlengde',
    formula: '0,1 · √(l_f / c_1)', subst: `0,1 · √(${n(lf, 0)}/${n(w.c1, 0)})`,
    value: w.alpha, unit: '–' });
  c.step({ sym: 'β', desc: 'Eksponent for boltdiameter',
    formula: '0,1 · (⌀_nom / c_1)^0,2', subst: `0,1 · (${n(dnom, 0)}/${n(w.c1, 0)})^0,2`,
    value: w.beta, unit: '–' });
  c.step({ sym: 'V⁰_Rk,c', desc: 'Grunnverdi kantbrudd, én bolt ved rett kant',
    formula: 'k_9 · ⌀_nom^α · l_f^β · √f_ck · c_1^1,5',
    subst: `${n(k9)} · ${n(dnom, 0)}^${n(w.alpha)} · ${n(lf, 0)}^${n(w.beta)} · ` +
           `√${n(cc.fck, 0)} · ${n(w.c1, 0)}^1,5`,
    value: w.V0, unit: 'N', ref: '(7.42)' });
  c.step({ sym: 'A⁰_c,V', desc: 'Referanseareal på kantflata for én bolt',
    formula: '4,5 · c_1²', subst: `4,5 · ${n(w.c1, 0)}²`, value: w.A0, unit: 'mm²' });
  c.step({ sym: 'A_c,V', desc: 'Faktisk bruddflate langs kanten',
    formula: 'bredde · høyde,  bredde = union av 1,5·c_1 hver vei fra forreste bolter, ' +
             'klippet mot betongen slik den står',
    subst: `${n(w.width, 0)} · ${n(w.height, 0)}   ` +
           `(høyde = min(1,5·c_1 ; h) = min(${n(1.5 * w.c1, 0)} ; ${n(w.hLoc, 0)}))`,
    value: w.Ac, unit: 'mm²', ref: '(7.41)' });
  c.step({ sym: 'ψ_s,V', desc: 'Sidekant vinkelrett på lastretninga',
    formula: '0,7 + 0,3 · c_2 / (1,5·c_1) ≤ 1,0',
    subst: Number.isFinite(w.c2)
      ? `0,7 + 0,3 · ${n(w.c2, 0)} / (1,5·${n(w.c1, 0)})` : 'ingen sidekant',
    value: w.psi_s, unit: '–' });
  c.step({ sym: 'ψ_h,V', desc: 'Tynn betongdel – bruddflata får ikke utvikle seg fritt',
    formula: '√(1,5·c_1 / h) ≥ 1,0',
    subst: `√(${n(1.5 * w.c1, 0)} / ${n(w.hLoc, 0)})`, value: w.psi_h, unit: '–' });
  c.step({ sym: 'ψ_α,V', desc: 'Skjærkraft på skrå mot kanten',
    formula: '√(1 / (cos²α_V + (0,5·sin α_V)²)) ≥ 1,0',
    subst: `V mot kant ${EDGE_LABEL[w.dir]}`, value: w.psi_a, unit: '–' });
  c.step({ sym: 'ψ_ec,V', desc: 'Eksentrisk skjærresultant langs kanten',
    formula: '1 / (1 + 2·e_V/(3·c_1)) ≤ 1,0',
    subst: `e_V = ${n(w.eV, 1)} mm`, value: w.psi_ec, unit: '–' });
  c.step({ sym: 'ψ_re,V', desc: 'Kantarmering',
    formula: '1,0 uten · 1,2 med kantstenger · 1,4 med kantstenger og bøyler',
    subst: `Regelverk · ${m.code.edgeReinf}`, value: psi_re, unit: '–' });
  const VRk = c.res({ sym: 'V_Rk,c',
    formula: 'V⁰_Rk,c · (A_c,V/A⁰_c,V) · ψ_s,V · ψ_h,V · ψ_α,V · ψ_ec,V · ψ_re,V',
    subst: `${n(w.V0)} · (${n(w.Ac, 0)}/${n(w.A0, 0)}) · ${n(w.psi_s)} · ${n(w.psi_h)} · ` +
           `${n(w.psi_a)} · ${n(w.psi_ec)} · ${n(psi_re)}`,
    value: w.VRk, unit: 'N', ref: '(7.40)' });
  c.step({ sym: 'V_Rd,c', desc: 'Dimensjonerende kapasitet',
    formula: 'V_Rk,c / γ_Mc', subst: `${n(VRk)} / ${n(g.gMc)}`, value: w.VRd, unit: 'N' });
  c.util({ formula: 'V_Ed,g / V_Rd,c', subst: `${n(V.Vres)} / ${n(w.VRd)}`, value: w.util });

  return { id: 'V-edge', mode: `Kantbrudd mot ${EDGE_LABEL[w.dir]}`, clause: '7.2.2.5',
           scope: 'gruppe', edgeDir: w.dir,
           NRk: w.VRk, NRd: w.VRd, NEd: V.Vres, util: w.util, calc: c };
}

// ===========================================================================
//  7.2.3 Kombinert strekk og skjær
// ===========================================================================
function interaction(checks) {
  const get = id => checks.find(c => c.id === id);
  const out = [];

  const bNs = get('N-steel').util, bVs = get('V-steel').util;
  const cs = new Calc('7.2.3');
  cs.in('β_N', bNs, '–', 'Stålbrudd strekk – utnyttelse');
  cs.in('β_V', bVs, '–', 'Stålbrudd skjær – utnyttelse');
  cs.res({ sym: 'β_N² + β_V²', formula: '(β_N)² + (β_V)² ≤ 1,0',
    subst: `${n(bNs)}² + ${n(bVs)}²`, value: bNs ** 2 + bVs ** 2, unit: '–', ref: '(7.54)' });
  cs.util({ formula: '(β_N)² + (β_V)²', subst: `${n(bNs)}² + ${n(bVs)}²`,
    value: bNs ** 2 + bVs ** 2 });
  out.push({ id: 'IA-steel', mode: 'Samvirkning stål', clause: '7.2.3', scope: 'kombinasjon',
    expr: '(β_N)² + (β_V)² ≤ 1', util: bNs ** 2 + bVs ** 2, calc: cs,
    NRk: NaN, NRd: NaN, NEd: NaN });

  // Listene dekker også id-ene fra B19-motoren (N-conc/N-foot, V-conc), i
  // tilfelle strekk eller skjær mot betong er valgt fra den boka mens
  // samvirkningen fortsatt regnes etter EN 1992-4.
  const tension = ['N-cone', 'N-pullout', 'N-blowout', 'N-split', 'N-conc', 'N-foot'];
  const shear = ['V-pryout', 'V-edge', 'V-conc'];
  const tw = tension.map(id => get(id)).filter(Boolean)
    .reduce((a, b) => ((b.util || 0) > (a?.util || 0) ? b : a), null);
  const sw = shear.map(id => get(id)).filter(Boolean)
    .reduce((a, b) => ((b.util || 0) > (a?.util || 0) ? b : a), null);
  const bN = tw?.util || 0, bV = sw?.util || 0;

  const cc = new Calc('7.2.3');
  cc.in('β_N', bN, '–', `Styrende betongbrudd i strekk: ${tw?.mode ?? '–'}`);
  cc.in('β_V', bV, '–', `Styrende betongbrudd i skjær: ${sw?.mode ?? '–'}`);
  cc.step({ sym: 'forenklet', desc: 'Alternativ, lineær samvirkning',
    formula: 'β_N + β_V ≤ 1,2', subst: `${n(bN)} + ${n(bV)} = ${n(bN + bV)}`,
    value: (bN + bV) / 1.2, unit: '–' });
  cc.res({ sym: 'β_N^1,5 + β_V^1,5', formula: '(β_N)^1,5 + (β_V)^1,5 ≤ 1,0',
    subst: `${n(bN)}^1,5 + ${n(bV)}^1,5`,
    value: bN ** 1.5 + bV ** 1.5, unit: '–', ref: '(7.55)' });
  cc.util({ formula: '(β_N)^1,5 + (β_V)^1,5', subst: `${n(bN)}^1,5 + ${n(bV)}^1,5`,
    value: bN ** 1.5 + bV ** 1.5 });
  out.push({ id: 'IA-conc', mode: 'Samvirkning betong', clause: '7.2.3', scope: 'kombinasjon',
    expr: '(β_N)^1,5 + (β_V)^1,5 ≤ 1', util: bN ** 1.5 + bV ** 1.5, calc: cc,
    NRk: NaN, NRd: NaN, NEd: NaN });

  return out;
}

// ---------------------------------------------------------------------------
function runEN1992_4(m, res) {
  const g = partialFactors(m);
  const cone = tensionConcreteCone(m, res, g);
  const checks = [
    tensionSteel(m, res, g),
    tensionPullout(m, res, g),
    cone,
    tensionBlowout(m, res, g),
    tensionSplitting(m, res, g, cone),
    shearSteel(m, res, g),
    shearPryout(m, res, g),
    shearConcreteEdge(m, res, g),
  ];
  return { standard: 'NS-EN 1992-4:2018', gamma: g, checks: [...checks, ...interaction(checks)] };
}

// ===== src/engine/anchor-reinforcement.js ==========================
// ---------------------------------------------------------------------------
//  Forankringsarmering - NS-EN 1992-4 pkt. 7.2.1.8 / 7.2.2.6.
//
//  Legges det egen armering som krysser bruddkjegla, erstattes kontrollen av
//  betongkjeglebrudd med to kontroller av armeringa:
//     a) stålbrudd i armeringa
//     b) forankringsbrudd - heft over lengden inne i kjegla
//
//  Dette er også mekanismen norsk praksis (Betongelementboka) bygger på når
//  innstøpingsgods forankres med sløyfer eller skråstag.
// ---------------------------------------------------------------------------

const GAMMA_S = 1.15;

// Heftfasthet f_bd etter NS-EN 1992-1-1 pkt. 8.4.2
function fbd(fck, ds, goodBond = true) {
  const fctk = 0.7 * 0.3 * Math.pow(fck, 2 / 3);   // f_ctk;0,05
  const fctd = fctk / 1.5;
  const eta1 = goodBond ? 1.0 : 0.7;
  const eta2 = ds <= 32 ? 1.0 : (132 - ds) / 100;
  return 2.25 * eta1 * eta2 * fctd;
}

function tensionReinforcement(m, res, r) {
  const NEd = res.tension.Ntot;
  const As = r.n * Math.PI * r.ds * r.ds / 4;

  // --- a) stålbrudd i armeringa ---
  const ca = new Calc('7.2.1.8');
  ca.in('n', r.n, 'stk', 'Forankringsarmering · bein som krysser kjegla');
  ca.in('⌀_s', r.ds, 'mm', 'Forankringsarmering');
  ca.in('f_yk', r.fyk, 'N/mm²', 'Forankringsarmering');
  ca.in('γ_Ms,re', GAMMA_S, '–', 'Armeringsstål – NS-EN 1992-1-1');
  ca.in('N_Ed,g', NEd, 'N', 'Sum strekk i boltegruppa');
  ca.step({ sym: 'A_s,re', desc: 'Samlet armeringsareal i bruddflata',
    formula: 'n · π · ⌀_s² / 4', subst: `${r.n} · π · ${n(r.ds, 0)}² / 4`,
    value: As, unit: 'mm²' });
  const NRk_s = ca.res({ sym: 'N_Rk,re', formula: 'A_s,re · f_yk',
    subst: `${n(As)} · ${n(r.fyk, 0)}`, value: As * r.fyk, unit: 'N' });
  const NRd_s = NRk_s / GAMMA_S;
  ca.step({ sym: 'N_Rd,re', desc: 'Dimensjonerende kapasitet',
    formula: 'N_Rk,re / γ_Ms,re', subst: `${n(NRk_s)} / ${n(GAMMA_S)}`,
    value: NRd_s, unit: 'N' });
  ca.util({ formula: 'N_Ed,g / N_Rd,re', subst: `${n(NEd)} / ${n(NRd_s)}`,
    value: NEd / NRd_s });

  // --- b) heft ---
  const cb = new Calc('7.2.1.8');
  const f = fbd(m.concrete.fck, r.ds, r.goodBond);
  const a1 = r.hooked ? 0.7 : 1.0;
  cb.in('n', r.n, 'stk', 'Forankringsarmering');
  cb.in('⌀_s', r.ds, 'mm', 'Forankringsarmering');
  cb.in('l_1', r.l1, 'mm', 'Forankringsarmering · lengde inne i bruddkjegla');
  cb.in('f_ck', m.concrete.fck, 'N/mm²', `Betongdel · ${m.concrete.grade}`);
  cb.in('α_1', a1, '–', r.hooked ? 'Kroket/bøyd stang' : 'Rett stangende');
  cb.in('N_Ed,g', NEd, 'N', 'Sum strekk i boltegruppa');
  const fctk = 0.7 * 0.3 * Math.pow(m.concrete.fck, 2 / 3);
  cb.step({ sym: 'f_ctk;0,05', desc: 'Nedre karakteristisk strekkfasthet',
    formula: '0,7 · 0,3 · f_ck^(2/3)', subst: `0,7 · 0,3 · ${n(m.concrete.fck, 0)}^(2/3)`,
    value: fctk, unit: 'N/mm²', ref: 'EN 1992-1-1 tab. 3.1' });
  cb.step({ sym: 'f_bd', desc: 'Dimensjonerende heftfasthet',
    formula: '2,25 · η_1 · η_2 · f_ctk;0,05 / γ_c',
    subst: `2,25 · ${r.goodBond ? '1,0' : '0,7'} · ${r.ds <= 32 ? '1,0' : n((132 - r.ds) / 100)}` +
           ` · ${n(fctk)} / 1,5`,
    value: f, unit: 'N/mm²', ref: 'EN 1992-1-1 8.4.2' });
  const NRk_a = cb.res({ sym: 'N_Rk,a', formula: 'n · π · ⌀_s · l_1 · f_bd / α_1',
    subst: `${r.n} · π · ${n(r.ds, 0)} · ${n(r.l1, 0)} · ${n(f)} / ${n(a1)}`,
    value: r.n * (r.l1 * Math.PI * r.ds * f) / a1, unit: 'N' });
  cb.util({ formula: 'N_Ed,g / N_Rd,a', subst: `${n(NEd)} / ${n(NRk_a)}`,
    value: NEd / NRk_a });

  const lbmin = Math.max(10 * r.ds, 100);
  const checks = [
    { id: 'N-re-steel', mode: 'Forankringsarmering – stålbrudd', clause: '7.2.1.8 (a)',
      scope: 'gruppe', NRk: NRk_s, NRd: NRd_s, NEd, util: NEd / NRd_s, calc: ca },
    { id: 'N-re-anch', mode: 'Forankringsarmering – heft', clause: '7.2.1.8 (b)',
      scope: 'gruppe', NRk: NRk_a, NRd: NRk_a, NEd, util: NEd / NRk_a, calc: cb,
      note: r.l1 < lbmin
        ? `l₁ < l_b,min = ${n(lbmin, 0)} mm – øk forankringslengden.` : undefined },
  ];
  return checks;
}

// 7.2.2.6 Kantarmering mot skjær - forenklet: armeringa tar hele skjærkrafta
function shearReinforcement(m, res, r) {
  const As = r.nV * Math.PI * r.dsV * r.dsV / 4;
  const VEd = res.shear.Vres;
  const c = new Calc('7.2.2.6');
  c.in('n', r.nV, 'stk', 'Forankringsarmering · kantarmering');
  c.in('⌀_s', r.dsV, 'mm', 'Forankringsarmering');
  c.in('f_yk', r.fykV, 'N/mm²', 'Forankringsarmering');
  c.in('γ_Ms,re', GAMMA_S, '–', 'Armeringsstål – NS-EN 1992-1-1');
  c.in('V_Ed,g', VEd, 'N', 'Resultant skjærkraft på gruppa');
  c.step({ sym: 'A_s,re', desc: 'Armeringsareal som krysser bruddflata',
    formula: 'n · π · ⌀_s² / 4', subst: `${r.nV} · π · ${n(r.dsV, 0)}² / 4`,
    value: As, unit: 'mm²' });
  const VRk = c.res({ sym: 'V_Rk,re', formula: 'A_s,re · f_yk',
    subst: `${n(As)} · ${n(r.fykV, 0)}`, value: As * r.fykV, unit: 'N' });
  const VRd = VRk / GAMMA_S;
  c.step({ sym: 'V_Rd,re', desc: 'Dimensjonerende kapasitet',
    formula: 'V_Rk,re / γ_Ms,re', subst: `${n(VRk)} / ${n(GAMMA_S)}`, value: VRd, unit: 'N' });
  c.util({ formula: 'V_Ed,g / V_Rd,re', subst: `${n(VEd)} / ${n(VRd)}`, value: VEd / VRd });

  return [{ id: 'V-re-steel', mode: 'Kantarmering – stålbrudd', clause: '7.2.2.6',
            scope: 'gruppe', NRk: VRk, NRd: VRd, NEd: VEd, util: VEd / VRd, calc: c,
            note: 'Forutsetter at armeringa er forankret på begge sider av bruddflata.' }];
}

// ===== src/engine/b19.js ===========================================
// ---------------------------------------------------------------------------
//  Betongelementboka bind B - kapittel B19 «Forankring av stål».
//
//  Implementert etter den utgaven som ligger åpent på
//  betongelementboka.betong.no/betongapp/BindB/Del_3/B19/ (punktnumrene under
//  viser dit).  Kapitlet dekker det NS-EN 1992-4 ikke gjør: forankring UTEN
//  endemutter (ren heftforankring av kamstål eller gjengestang), og enkelt-
//  stående dybler uten stålplate.
//
//  Formlene i B19 gir DIMENSJONERENDE verdier direkte - materialfaktorene
//  ligger inne i k-faktorene (k_1 = 11,9/γ_c osv.), i motsetning til
//  EN 1992-4 som gir karakteristiske verdier som deles på γ_M etterpå.
//  Derfor settes NRk = NRd i kontrollene her.
//
//  Hovedskillene kapitlet håndterer, og som denne modulen regner på:
//
//    Forankringsende          Strekk                       Pkt.
//    ---------------------------------------------------------------
//    endemutter / bolthode    kjeglebrudd, ELLER heft      19.3.2
//    innstøpt plate i enden   kjeglebrudd (annen fot)      19.3.2 + 19.3.2.4
//    uten endemutter          heftforankring               19.3.3 / 19.3.4
//
//    Innfesting               Skjær                        Pkt.
//    ---------------------------------------------------------------
//    uten stålplate (dybel)   V⁰ = 1,0·⌀²·√(f_cd·f_yd)     19.4.2
//    innstøpt plate, sveist   V⁰ = 1,8·⌀²·√(f_cd·f_yd)     19.4.4
//    påskrudd plate           V⁰ = 1,5·⌀²·√(f_cd·f_yd)     19.4.4
//
//  Merk (19.3.1.2): kjeglebruddmodellen forutsetter ingen heft langs stanga.
//  En lang gjengestang med endemutter og liten kantavstand kan få mindre
//  kapasitet etter kjeglemodellen enn samme stang UTEN endemutter etter
//  heftmodellen. Boka sier uttrykkelig: «bruk den modellen som gir størst
//  forankringskapasitet». Kontrollen N-conc regner derfor begge og bruker den
//  som gir lavest utnyttelse når det er fot.
// ---------------------------------------------------------------------------

const KB = {
  // Kjeglebrudd, strekk - 19.3.2.1:  N⁰_Rd,c = (11,9/γ_c)·√f_ck,cube·h_ef^1,5
  k1: 11.9,
  // Risset uarmert betong (uten kantarmering eller bøyler) - 19.3.2.1 / 19.4.3.3
  crackedPlain: 0.7,
  // Trykk mot forankringsfoten - 19.3.2.4
  sigmaFoot: 8.4,          // urisset, eller risset med kantarmering og bøyler
  sigmaFootPlain: 6.0,     // risset uten kantarmering eller bøyler
  // Heftfasthet - 19.3.3.1 (kamstål) og 19.3.4 (gjengestang)
  bondRebar: 2.25, bondRod: 1.90, alphaCt: 0.85,
  // Dybelskjær - 19.4.2.3 og 19.4.4
  dowel: 1.0,              // uten stålplate (kombinasjonsformelen)
  dowelWelded: 1.8,        // innstøpt plate med påsveiste forankringer
  dowelBolted: 1.5,        // påskrudd plate
  dowelCrush: 4.5,         // ren betongknusing, V_Rd,c = 4,5·f_cd·⌀²
  momentArm: 0.75,         // maks moment i M = V·(e + 0,75·⌀)
  // Materialfaktorer - 19.5 (EC3-1-1 NA.6.1) og EC2 for kamstål
  gM0: 1.05, gM2: 1.25, gS: 1.15, alphaCc: 0.85,
  // Tverrarmeringens virkning på heft, α_3 - 19.3.3.1
  a3_bars: 0.95, a3_stirrups: 0.90, alphaMin: 0.7,
};

const B19_EDGE = { xNeg: '−x', xPos: '+x', yNeg: '−y', yPos: '+y' };
const B19_AXIS = { xNeg: 'x', xPos: 'x', yNeg: 'y', yPos: 'y' };

// ---------------------------------------------------------------------------
//  Materialer
// ---------------------------------------------------------------------------

// Betongen slik B19 bruker den: terningfasthet i brudd-/kantformlene,
// f_ctk,0,05 i heftformlene, f_cd i dybelformlene.
function b19Concrete(m) {
  const g = grade(m.concrete.grade);
  const gc = m.code.gammaC;
  return {
    grade: g.id, fck: g.fck, fckCube: g.fckCube, fctk: g.fctk, gc,
    fcd: KB.alphaCc * g.fck / gc,
    fctd: KB.alphaCt * g.fctk / gc,
    inRange: g.fck >= 25 && g.fck <= 55,   // boka dekker selv bare B25-B55
  };
}

// Stålets dimensjonerende kapasiteter, pkt. 19.5.
//   kamstål   f_yd = f_yk/1,15;  N = A_s·f_yd, V = A_s·f_yd/√3, M = W_p·f_yd
//   skrue     f_sd2 = 0,9·f_u/1,25, f_sd0 = f_y/1,05
//             N = A_sp·f_sd2, V = k_v·f_sd2·A_sp, M = W_p·f_sd0
//   annet     f_sd0 = f_y/1,05;  N = A_s·f_sd0, V = A_s·f_sd0/√3, M = W_p·f_sd0
//
//  fDowel er spenningen som går inn i dybelformlene √(f_cd·f_sd) - boka bruker
//  f_yd for kamstål (tab. B 19.11.15) og f_sd2 for gjengestang (tab. B 19.7.8).
function b19Steel(m) {
  const s = steelGrade(m.anchors.steel), sh = shaftProps(m);
  const base = { id: s.id, nEdge: s.nEdge, As: sh.As, Wp: sh.Wp, sh };

  // Skjær og dybelbøyning regnes i snittet ved betongoverflata. Står det
  // glatte skaftet der, er det snittet grovere enn gjengene (sh.Av / sh.WpV).
  const vTxt = sh.smooth > 0 ? 'A_v' : (sh.threaded ? 'A_sp' : 'A_s');

  if (s.kind === 'rebar') {
    const fyd = s.fyk / KB.gS;
    return { ...base, kind: 'rebar', f: fyd, fDowel: fyd, fM: fyd,
      fSym: 'f_yd', fSrc: `f_yk / 1,15 = ${n(s.fyk, 0)} / 1,15`,
      NRd: sh.As * fyd, NTxt: 'A_s · f_yd',
      VRd: sh.Av * fyd / Math.sqrt(3), VTxt: `${vTxt} · f_yd / √3`,
      MRd: sh.WpV * fyd, MTxt: 'W_p · f_yd' };
  }
  if (s.kind === 'bolt') {
    const fsd0 = s.fyk / KB.gM0, fsd2 = 0.9 * s.fuk / KB.gM2;
    return { ...base, kind: 'bolt', f: fsd2, fDowel: fsd2, fM: fsd0, kv: s.kv,
      fSym: 'f_sd2', fSrc: `0,9 · f_u / 1,25 = 0,9 · ${n(s.fuk, 0)} / 1,25`,
      NRd: sh.As * fsd2, NTxt: 'A_sp · f_sd2',
      VRd: s.kv * fsd2 * sh.Av, VTxt: `${n(s.kv, 1)} · f_sd2 · ${vTxt}`,
      MRd: sh.WpV * fsd0, MTxt: 'W_p · f_sd0' };
  }
  const fsd0 = s.fyk / KB.gM0;
  return { ...base, kind: 'struct', f: fsd0, fDowel: fsd0, fM: fsd0,
    fSym: 'f_sd0', fSrc: `f_y / 1,05 = ${n(s.fyk, 0)} / 1,05`,
    NRd: sh.As * fsd0, NTxt: 'A_s · f_sd0',
    VRd: sh.Av * fsd0 / Math.sqrt(3), VTxt: `${vTxt} · f_sd0 / √3`,
    MRd: sh.WpV * fsd0, MTxt: 'W_p · f_sd0' };
}

// ---------------------------------------------------------------------------
//  Geometri
// ---------------------------------------------------------------------------

const minEdgeDist = (m, pts) => pts.reduce((acc, p) => {
  const e = edgeDistances(m, p.x, p.y);
  return Math.min(acc, e.xNeg, e.xPos, e.yNeg, e.yPos);
}, Infinity);

// 19.3.2.2, «Øvre grense for h_ef i hjørner på smale betongelementer».
// Er forankringen nær tre eller flere kanter, gir formelverket urimelig små
// kapasiteter. Da erstattes h_ef av h'ef = maks(a_maks/1,5 ; s_maks/3) i alle
// formlene i pkt. 19.3.2.
function b19EffectiveHef(m, pts) {
  const hef = m.anchors.hef, a = m.anchors;
  const near = [];
  for (const dir of ['xNeg', 'xPos', 'yNeg', 'yPos']) {
    const ds = pts.map(p => edgeDistances(m, p.x, p.y)[dir]).filter(Number.isFinite);
    if (ds.length && Math.min(...ds) < 1.5 * hef) near.push(Math.max(...ds));
  }
  if (near.length < 3) return { hef, reduced: false, nEdges: near.length };

  const cap = near.length >= 4 ? 3 * hef : 1.5 * hef;
  const aMax = Math.max(...near.map(d => Math.min(d, cap)));
  const sMax = Math.min(3 * hef,
    Math.max(a.nx > 1 ? a.sx : 0, a.ny > 1 ? a.sy : 0));
  const h2 = Math.max(aMax / 1.5, sMax / 3);
  return { hef: Math.min(hef, h2), reduced: h2 < hef, nEdges: near.length,
           aMax, sMax, raw: hef };
}

//  STREKK

// 19.5 / 19.7.1 Stålets strekkapasitet - pr. bolt
function b19TensionSteel(m, res) {
  const st = b19Steel(m);
  const c = new Calc('19.5');
  const d = c.in('⌀', m.anchors.d, 'mm', 'Bolter');
  c.in(st.fSym, st.f, 'N/mm²', `Bolter · ${st.id} – ${st.fSrc}`);
  const NEd = Math.max(0, ...res.anchors.map(a => a.N));
  c.in('N_Ed', NEd, 'N', 'Største boltestrekk fra kraftfordelinga');

  c.step({ sym: st.sh.threaded ? 'A_sp' : 'A_s',
    desc: st.sh.threaded ? 'Spenningsareal i gjengene (tab. B 19.7.1)'
                         : 'Tverrsnitt i stanga',
    formula: st.sh.threaded ? 'A_sp (tabell)' : 'π · ⌀² / 4',
    subst: st.sh.threaded ? `M${n(d, 0)}` : `π · ${n(d, 0)}² / 4`,
    value: st.As, unit: 'mm²' });
  const NRd = c.res({ sym: 'N_Rd,s', formula: st.NTxt,
    subst: `${n(st.As, 0)} · ${n(st.f, 0)}`, value: st.NRd, unit: 'N', ref: '19.5' });
  c.util({ formula: 'N_Ed / N_Rd,s', subst: `${n(NEd)} / ${n(NRd)}`, value: NEd / NRd });

  return { id: 'N-steel', mode: 'Stålbrudd, strekk', clause: '19.5', scope: 'bolt',
           NRk: NRd, NRd, NEd, util: NEd / NRd, calc: c };
}

// 19.3.2 Kjeglebrudd - gruppe. Regnes bare når forankringen har fot.
function b19ConeBranch(m, res, c) {
  const foot = anchorFoot(m);
  if (!foot.hasFoot) return null;
  const pts = res.tension.anchors;
  const cd = b19Concrete(m);

  const he = b19EffectiveHef(m, pts);
  const hef = he.hef;
  if (he.reduced)
    c.step({ sym: 'h′_ef', desc:
      `Forankringen ligger nær ${he.nEdges} kanter – h_ef erstattes av h′_ef`,
      formula: 'maks(a_maks / 1,5 ; s_maks / 3)',
      subst: `maks(${n(he.aMax, 0)}/1,5 ; ${n(he.sMax, 0)}/3)`,
      value: hef, unit: 'mm', ref: '19.3.2.2' });

  const plain = m.code.cracked && m.code.edgeReinf === 'none';
  const k1 = c.step({ sym: 'k_1', desc: plain
      ? 'Risset uarmert betong (uten kantarmering eller bøyler): 0,7 · k_1'
      : 'Urisset betong, eller risset med kantarmering og bøyler',
    formula: (plain ? '0,7 · ' : '') + '(11,9 / γ_c) · √f_ck,cube',
    subst: `${plain ? '0,7 · ' : ''}(11,9 / ${n(cd.gc, 2)}) · √${n(cd.fckCube, 0)}`,
    value: (plain ? KB.crackedPlain : 1) * (KB.k1 / cd.gc) * Math.sqrt(cd.fckCube),
    unit: 'N/mm^1,5', ref: 'tab. B 19.3.1' });

  const N0 = c.step({ sym: 'N⁰_Rd,c',
    desc: 'Kjeglekapasitet, én forankring med store kant- og senteravstander',
    formula: 'k_1 · h_ef^1,5', subst: `${n(k1, 2)} · ${n(hef, 0)}^1,5`,
    value: k1 * Math.pow(hef, 1.5), unit: 'N', ref: '19.3.2.1' });
  const A0 = c.step({ sym: 'A⁰_c,N', desc: 'Full utrivingskjegle for én forankring',
    formula: '9 · h_ef²', subst: `9 · ${n(hef, 0)}²`,
    value: 9 * hef * hef, unit: 'mm²', ref: '19.3.2.2' });
  const Ac = c.step({ sym: 'A_c,N', desc: 'Bruddareal for gruppa',
    formula: foot.common
      ? 'endeplata ± 1,5·h_ef, klippet mot frie kanter'
      : 'union av (⌀ ± 1,5·h_ef), klippet mot frie kanter',
    subst: foot.common
      ? `felles endeplate ${n(foot.plate.bx, 0)} × ${n(foot.plate.by, 0)} mm, ` +
        `1,5·h_ef = ${n(1.5 * hef, 0)} mm`
      : `${pts.length} bolter i strekk, 1,5·h_ef = ${n(1.5 * hef, 0)} mm`,
    value: coneProjection(m, foot, pts, 1.5 * hef), unit: 'mm²',
    ref: 'fig. B 19.11' });

  const cmin = minEdgeDist(m, pts);
  const psi_s = c.step({ sym: 'Ψ_s,N',
    desc: 'Kanteffekt – den rotasjonssymmetriske spenningstilstanden forstyrres',
    formula: '0,7 + 0,3 · a / (1,5 · h_ef) ≤ 1,0',
    subst: Number.isFinite(cmin)
      ? `0,7 + 0,3 · ${n(cmin, 0)} / ${n(1.5 * hef, 0)}` : 'ingen fri kant',
    value: Number.isFinite(cmin) ? clamp(0.7 + 0.3 * cmin / (1.5 * hef), 0, 1) : 1,
    unit: '–', ref: '19.3.2.3' });
  const psi_re = c.step({ sym: 'Ψ_re,N',
    desc: 'Overflatearmering – bare aktuell når h_ef < 100 mm',
    formula: '0,5 + h_ef / 200 ≤ 1,0', subst: `0,5 + ${n(hef, 0)} / 200`,
    value: clamp(0.5 + hef / 200, 0, 1), unit: '–', ref: '19.3.2.3' });
  const eN = Math.hypot(res.tension.eNx, res.tension.eNy);
  const psi_ec = c.step({ sym: 'Ψ_ec,N', desc: 'Eksentrisk strekkresultant',
    formula: '1 / (1 + 2 · e_N / (3 · h_ef)) ≤ 1,0',
    subst: `e_N = ${n(eN, 1)} mm`,
    value: clamp(1 / (1 + 2 * eN / (3 * hef)), 0, 1), unit: '–', ref: '19.3.2.3' });

  const NRd = N0 * (Ac / A0) * psi_s * psi_re * psi_ec;
  c.step({ sym: 'N_Rd,c', desc: 'Kjeglebrudd, samlet for gruppa',
    formula: 'N⁰_Rd,c · (A_c,N / A⁰_c,N) · Ψ_s,N · Ψ_re,N · Ψ_ec,N',
    subst: `${n(N0)} · (${n(Ac, 0)}/${n(A0, 0)}) · ${n(psi_s)} · ` +
           `${n(psi_re)} · ${n(psi_ec)}`,
    value: NRd, unit: 'N', ref: '19.3.2.5' });

  const NEd = res.tension.Ntot;
  return { name: 'Kjeglebrudd', clause: '19.3.2', scope: 'gruppe',
           NRd, NEd, util: NEd / NRd, hef };
}

// 19.3.3 / 19.3.4 Heftforankring - pr. stang.
// Kapasiteten er omvendinga av bokas lengdeformel: lbd = Πα · N/(π·⌀·f_bd),
// altså N_Rd,b = π·⌀·l_b·f_bd / Πα.  f_bd er nedre grense for heftfasthet (ved
// minste tillatte overdekning); god overdekning senker Πα og hever heften.
function b19BondBranch(m, res, c) {
  const sh = shaftProps(m);
  if (!sh.bond) return null;
  const cd = b19Concrete(m), a = m.anchors;
  const rebar = a.barType === 'rebar';
  // Heft utvikles bare der stanga har kammer eller gjenger. Er skaftet glatt
  // ned til en viss dybde, begynner heften først der gjengene begynner.
  const lb = sh.lBond;

  const kb = c.step({ sym: 'f_bd', desc: rebar
      ? 'Heftfasthet, kamstål – nedre grense etter EC2-1-1 pkt. 8'
      : 'Heftfasthet, gjengestang – 84 % av kamstål, konservativt',
    formula: `${rebar ? '2,25' : '1,90'} · f_ctd,   f_ctd = 0,85 · f_ctk,0,05 / γ_c`,
    subst: `${rebar ? '2,25' : '1,90'} · 0,85 · ${n(cd.fctk, 2)} / ${n(cd.gc, 2)}`,
    value: (rebar ? KB.bondRebar : KB.bondRod) * cd.fctd, unit: 'N/mm²',
    ref: rebar ? '19.3.3.1' : '19.3.4' });

  // R = det minste av kantavstanden og halve senteravstanden, fig. B 19.21.
  const half = [];
  if (a.nx > 1) half.push(a.sx / 2);
  if (a.ny > 1) half.push(a.sy / 2);
  const R = Math.min(minEdgeDist(m, anchorPositions(m)), ...half);
  const a2 = c.step({ sym: 'α_2', desc: 'Overdekning og senteravstand (spaltebrudd)',
    formula: '1 − 0,15 · (R/⌀ − 1,5),  0,7 ≤ α_2 ≤ 1,0   der R = min(a ; s/2)',
    subst: `R = ${n(R, 0)} mm → 1 − 0,15 · (${n(R / sh.d, 2)} − 1,5)`,
    value: clamp(1 - 0.15 * (R / sh.d - 1.5), 0.7, 1), unit: '–',
    ref: 'tab. B 19.3.2' });
  const a3v = { none: 1.0, bars: KB.a3_bars, 'bars+stirrups': KB.a3_stirrups
              }[m.code.edgeReinf] ?? 1.0;
  const a3 = c.step({ sym: 'α_3', desc: 'Tverrarmering som ikke er sveist til stanga',
    formula: '1,0 uten · 0,95 med rett tverrarmering · 0,90 med tverrbøyler',
    subst: `Regelverk · kantarmering «${m.code.edgeReinf}»`, value: a3v, unit: '–',
    ref: '19.3.3.1' });
  const pa = c.step({ sym: 'Πα', desc: 'Samlet α – boka krever α_2·α_3·α_5 ≥ 0,7',
    formula: 'maks(α_2 · α_3 ; 0,7)',
    subst: `maks(${n(a2)} · ${n(a3)} ; 0,7)`,
    value: Math.max(KB.alphaMin, a2 * a3), unit: '–', ref: '19.3.3.1' });

  c.step({ sym: 'l_b', desc: sh.smooth > 0
      ? 'Heftlengde – bare den gjengede delen utvikler heft'
      : 'Heftlengde – innstøpt lengde uten fot',
    formula: sh.smooth > 0 ? 'l_b = h_ef − l_glatt' : 'l_b = h_ef',
    subst: sh.smooth > 0
      ? `${n(a.hef, 0)} − ${n(sh.smooth, 0)}` : `${n(lb, 0)}`,
    value: lb, unit: 'mm' });
  const NRd = Math.PI * sh.d * lb * kb / pa;
  c.step({ sym: 'N_Rd,b', desc: 'Heftkapasitet pr. stang',
    formula: 'π · ⌀ · l_b · f_bd / Πα',
    subst: `π · ${n(sh.d, 0)} · ${n(lb, 0)} · ${n(kb, 2)} / ${n(pa)}`,
    value: NRd, unit: 'N', ref: '19.7.2.1' });

  const NEd = Math.max(0, ...res.anchors.map(x => x.N));
  const hook = a.endType === 'hook';
  if (hook)
    c.step({ sym: '–', desc: 'Endekrok', formula: '',
      subst: 'Kroken er ikke kvantifisert utover heften over l_b – B19 gir ' +
             'ingen bæreflateformel for kroker (bare hode/mutter, 19.3.2). ' +
             'Konservativt: samme kapasitet som rett stang uten krok.',
      value: null, unit: '' });
  return { name: 'Heftforankring', clause: rebar ? '19.3.3' : '19.3.4',
           scope: 'bolt', NRd, NEd, util: NEd / NRd, R,
           note: hook ? 'Konservativt: kroken gir ingen tillegg utover heften.'
                       : undefined };
}

// Utrivning av betongen: kjeglebrudd og/eller heftforankring.
function b19TensionConcrete(m, res) {
  const foot = anchorFoot(m), sh = shaftProps(m);
  if (!res.tension.anchors.length) {
    const why = 'Ingen bolter i strekk.';
    return { id: 'N-conc', mode: 'Utrivning av betong', clause: '19.3', scope: 'gruppe',
             NRk: Infinity, NRd: Infinity, NEd: 0, util: 0,
             calc: skipped('19.3', why), note: why };
  }
  if (!foot.hasFoot && !sh.bond) {
    const why = 'Glatt sveisebolt uten endemutter har verken fot eller heft. ' +
                'Velg kamstål eller gjengestang, eller sett på endemutter.';
    return { id: 'N-conc', mode: 'Utrivning av betong', clause: '19.3', scope: 'gruppe',
             NRk: NaN, NRd: NaN, NEd: res.tension.Ntot, util: NaN,
             calc: skipped('19.3', why), note: why };
  }

  const c = new Calc('19.3');
  const cd = b19Concrete(m);
  c.in('⌀', sh.d, 'mm', 'Bolter');
  c.in('h_ef', m.anchors.hef, 'mm',
    foot.hasFoot ? 'Bolter · dybde til underkant fot' : 'Bolter · innstøpt lengde');
  c.in('f_ck,cube', cd.fckCube, 'N/mm²', `Betongdel · ${cd.grade} · terningfasthet`);
  c.in('f_ctk,0,05', cd.fctk, 'N/mm²', `Betongdel · ${cd.grade}`);
  c.in('γ_c', cd.gc, '–', 'Regelverk');
  c.in('N_Ed,g', res.tension.Ntot, 'N', 'Sum strekk i boltegruppa');

  const cone = b19ConeBranch(m, res, c);
  const bond = b19BondBranch(m, res, c);

  // 19.3.1.2: med fot og heft langs stanga gjelder den modellen som gir
  // størst forankringskapasitet - altså lavest utnyttelse.
  const cands = [cone, bond].filter(Boolean);
  const win = cands.reduce((a, b) => (b.util < a.util ? b : a));
  const other = cands.find(x => x !== win);

  if (other)
    c.step({ sym: 'valg', desc:
      'Kjeglebruddmodellen forutsetter ingen heft langs stanga. Boka sier å ' +
      'bruke den modellen som gir størst forankringskapasitet',
      formula: 'styrende = modellen med lavest utnyttelse',
      subst: `${win.name} ${n(win.util * 100, 0)} % mot ` +
             `${other.name} ${n(other.util * 100, 0)} %`,
      value: 1, unit: '✓', ref: '19.3.1.2' });

  c.res({ sym: win.scope === 'gruppe' ? 'N_Rd,c' : 'N_Rd,b', formula: win.name,
    subst: win.scope === 'gruppe' ? 'gruppekapasitet' : 'pr. stang',
    value: win.NRd, unit: 'N', ref: win.clause });
  c.util({ formula: `N_Ed / ${win.scope === 'gruppe' ? 'N_Rd,c' : 'N_Rd,b'}`,
    subst: `${n(win.NEd)} / ${n(win.NRd)}`, value: win.util });

  const notes = [`Styrende modell: ${win.name.toLowerCase()} (pkt. ${win.clause}).`];
  if (!cd.inRange)
    notes.push(`B19 dekker selv B25–B55; ${cd.grade} er ekstrapolert.`);

  return { id: 'N-conc', mode: `Utrivning – ${win.name.toLowerCase()}`,
           clause: win.clause, scope: win.scope, showCone: win === cone,
           NRk: win.NRd, NRd: win.NRd, NEd: win.NEd, util: win.util,
           calc: c, note: notes.join(' ') };
}

// 19.3.2.4 Trykk mot forankringsfoten. Holdes trykket under grensa, unngås
// pullout-brudd og kjeglebrudd kan utvikles.
function b19FootPressure(m, res) {
  const foot = anchorFoot(m);
  if (!foot.hasFoot) {
    const why = 'Forankringen har ingen fot – kontrollen er ikke aktuell.';
    return { id: 'N-foot', mode: 'Trykk mot forankringsfot', clause: '19.3.2.4',
             scope: 'bolt', NRk: Infinity, NRd: Infinity, NEd: 0, util: 0,
             calc: skipped('19.3.2.4', why), note: why };
  }
  const cd = b19Concrete(m), sh = shaftProps(m);
  const c = new Calc('19.3.2.4');
  const plain = m.code.cracked && m.code.edgeReinf === 'none';
  const FOOT = { head: 'bolthode', nut: 'endemutter',
                 plate: 'felles innstøpt endeplate' };

  c.in('⌀', sh.d, 'mm', 'Bolter');
  c.in('f_ck,cube', cd.fckCube, 'N/mm²', `Betongdel · ${cd.grade}`);
  c.in('γ_c', cd.gc, '–', 'Regelverk');
  c.in('fot', foot.size, 'mm', `Bolter · ${FOOT[foot.kind]}` +
    (foot.kind === 'nut' ? ' (nøkkelvidde)'
     : foot.kind === 'plate' ? ' (minste sidekant på den felles plata)' : ''));
  const NEd = Math.max(0, ...res.anchors.map(a => a.N));
  c.in('N_Ed', NEd, 'N', 'Største boltestrekk fra kraftfordelinga');

  const sc = c.step({ sym: 'σ_c', desc: plain
      ? 'Risset betong uten kantarmering eller bøyler'
      : 'Urisset betong, eller risset med kantarmering og bøyler',
    formula: `${plain ? '6,0' : '8,4'} · f_ck,cube / γ_c`,
    subst: `${plain ? '6,0' : '8,4'} · ${n(cd.fckCube, 0)} / ${n(cd.gc, 2)}`,
    value: (plain ? KB.sigmaFootPlain : KB.sigmaFoot) * cd.fckCube / cd.gc,
    unit: 'N/mm²', ref: '19.3.2.4' });

  if (foot.kind === 'plate') {
    c.step({ sym: 'b_eff', desc:
      'Plata må være stiv – utstikket u ≤ tykkelsen t, så bare et felt rundt ' +
      'hver bolt regnes som trykkflate',
      formula: '⌀ + 2 · t_p',
      subst: `${n(sh.d, 0)} + 2·${n(foot.t, 0)}`,
      value: foot.eff, unit: 'mm', ref: 'fig. B 19.18 / B 19.57' });
    c.step({ sym: 'A_eff', desc:
      'Medvirkende felt for hele gruppa – overlappende felt telles én gang, ' +
      'og alt utenfor plata faller bort',
      formula: 'union av (⌀ + 2·t_p) innenfor endeplata',
      subst: `${n(foot.plate.bx, 0)} × ${n(foot.plate.by, 0)} mm plate, ` +
             `${m.anchors.nx * m.anchors.ny} bolter`,
      value: foot.Aeff, unit: 'mm²', ref: 'fig. B 19.18' });
  }

  const AFORM = { head: 'π · ⌀_h² / 4', nut: '0,866 · NV²',
                  plate: 'A_eff / n' };
  c.step({ sym: 'A_fot', desc: foot.common
      ? 'Trykkflate pr. bolt – lasta deles likt på boltene i plata'
      : 'Fotens bruttoareal', formula: AFORM[foot.kind],
    subst: foot.common
      ? `${n(foot.Aeff, 0)} / ${m.anchors.nx * m.anchors.ny}` : `${n(foot.eff, 0)} mm`,
    value: foot.Agross, unit: 'mm²' });
  const Ah = c.step({ sym: 'A_h', desc: 'Netto trykkareal mot betongen',
    formula: 'A_fot − π/4 · ⌀²',
    subst: `${n(foot.Agross, 0)} − π/4 · ${n(sh.d, 0)}²`,
    value: foot.Ah, unit: 'mm²', ref: 'fig. B 19.16' });

  const NRd = c.res({ sym: 'N_Rd,fot', formula: 'σ_c · A_h',
    subst: `${n(sc, 0)} · ${n(Ah, 0)}`, value: sc * Ah, unit: 'N', ref: '19.3.2.4' });
  c.util({ formula: 'N_Ed / N_Rd,fot', subst: `${n(NEd)} / ${n(NRd)}`,
    value: NEd / NRd });

  return { id: 'N-foot', mode: 'Trykk mot forankringsfot', clause: '19.3.2.4',
           scope: 'bolt', NRk: NRd, NRd, NEd, util: NEd / NRd, calc: c,
           note: NEd > NRd
             ? 'Foten er for liten til å utvikle kjeglebrudd. Legg på skive ' +
               'etter fig. B 19.57, eller øk fotstørrelsen.' : undefined };
}

// 19.5 Stålets skjærkapasitet - pr. bolt
function b19ShearSteel(m, res) {
  const st = b19Steel(m);
  const c = new Calc('19.5');
  c.in('⌀', m.anchors.d, 'mm', 'Bolter');
  c.in(st.fSym, st.f, 'N/mm²', `Bolter · ${st.id} – ${st.fSrc}`);
  if (st.kind === 'bolt')
    c.in('k_v', st.kv, '–',
      `${st.kv === 0.6 ? '0,6 for K4.6, K5.6 og K8.8' : '0,5 for K4.8, K5.8, K6.8 og K10.9'}`);
  const VEd = Math.max(0, ...res.anchors.map(a => a.V));
  c.in('V_Ed', VEd, 'N', 'Største boltskjær fra kraftfordelinga');

  c.step({ sym: st.sh.threaded ? 'A_sp' : 'A_s', desc: 'Tverrsnitt i stanga',
    formula: st.sh.threaded ? 'A_sp (tabell)' : 'π · ⌀² / 4',
    subst: st.sh.threaded ? `M${n(m.anchors.d, 0)}` : `π · ${n(m.anchors.d, 0)}² / 4`,
    value: st.As, unit: 'mm²' });
  const VRd = c.res({ sym: 'V_Rd,s', formula: st.VTxt,
    subst: `${n(st.As, 0)} · ${n(st.f, 0)}${st.kind === 'bolt' ? '' : ' / √3'}`,
    value: st.VRd, unit: 'N', ref: '19.5' });
  c.util({ formula: 'V_Ed / V_Rd,s', subst: `${n(VEd)} / ${n(VRd)}`, value: VEd / VRd });

  return { id: 'V-steel', mode: 'Stålbrudd, skjær', clause: '19.5', scope: 'bolt',
           NRk: VRd, NRd: VRd, NEd: VEd, util: VEd / VRd, calc: c };
}

// 19.4.2.2 Stålets bøyningskapasitet. Dybelen får et flyteledd i avstanden
// x ≈ 1,5·⌀ under betongoverflata, som gir M = V·(e + 0,75·⌀).
// Er stanga sveist til en innstøpt plate, holder plata betongen på plass og
// bøyningen dekkes av forhøyelsesfaktoren i 19.4.4 i stedet.
function b19ShearBending(m, res) {
  const plate = m.plate.present, e = res.leverArm;
  if (plate && e <= 0) {
    const why = 'Stanga er festet i en plate som ligger an mot betongen – ' +
      'ingen utkraging, og bøyningen er dekket av dybelformelen for plate ' +
      '(pkt. 19.4.4).';
    return { id: 'V-bend', mode: 'Stålbrudd, bøyning av dybel', clause: '19.4.2.2',
             scope: 'bolt', NRk: Infinity, NRd: Infinity, NEd: 0, util: 0,
             calc: skipped('19.4.2.2', why), note: why };
  }
  const st = b19Steel(m), sh = shaftProps(m);
  const c = new Calc('19.4.2.2');
  c.in('⌀', sh.d, 'mm', 'Bolter');
  if (sh.threaded) c.in('⌀_ekv', sh.dEff, 'mm', 'Bolter · ekvivalent diameter, tab. B 19.7.1');
  c.in('f', st.fM, 'N/mm²', `Bolter · ${st.id} – ${st.kind === 'bolt' ? 'f_sd0' : st.fSym}`);
  c.in('e', e, 'mm', plate
    ? 'Plate · fri avstand + t/2' : 'Bolter · utkraging over betongen');
  const VEd = Math.max(0, ...res.anchors.map(a => a.V));
  c.in('V_Ed', VEd, 'N', 'Største boltskjær fra kraftfordelinga');

  c.step({ sym: 'W_p', desc: 'Plastisk motstandsmoment, rundt tverrsnitt',
    formula: '⌀_ekv³ / 6', subst: `${n(sh.dEff, 1)}³ / 6`, value: st.Wp, unit: 'mm³',
    ref: '19.5' });
  const MRd = c.step({ sym: 'M_Rd,s', desc: 'Momentkapasitet i stanga',
    formula: st.MTxt, subst: `${n(st.Wp, 0)} · ${n(st.fM, 0)}`,
    value: st.MRd, unit: 'Nmm', ref: '19.5' });
  const arm = c.step({ sym: 'x', desc:
    'Maksimalmomentet ligger ca. 1,5·⌀ under overflata; med betongtrykket ' +
    'fordelt over den lengden blir armen e + 0,75·⌀',
    formula: 'e + 0,75 · ⌀', subst: `${n(e, 0)} + 0,75 · ${n(sh.d, 0)}`,
    value: e + KB.momentArm * sh.d, unit: 'mm', ref: '19.4.2.2' });
  const VRd = c.res({ sym: 'V_Rd,s,M', formula: 'M_Rd,s / (e + 0,75 · ⌀)',
    subst: `${n(MRd)} / ${n(arm, 0)}`, value: MRd / arm, unit: 'N', ref: '19.4.2.2' });
  c.util({ formula: 'V_Ed / V_Rd,s,M', subst: `${n(VEd)} / ${n(VRd)}`, value: VEd / VRd });

  return { id: 'V-bend', mode: 'Stålbrudd, bøyning av dybel', clause: '19.4.2.2',
           scope: 'bolt', NRk: VRd, NRd: VRd, NEd: VEd, util: VEd / VRd, calc: c,
           MEd: VEd * arm, MRd: st.MRd };
}

// Bruddflatas bredde langs kanten: 1,5·a_1 til hver side av boltene i fremste
// rekke, slått sammen og klippet mot sidekantene. ks = bredde / (3·a_1),
// altså A_c,V / A⁰_c,V når høyden ikke er begrensende (fig. B 19.50).
function b19FrontWidth(m, dir, a1, front) {
  const axisX = B19_AXIS[dir] === 'x';
  const t = p => (axisX ? p.y : p.x);
  // Klippet foelger betongen slik den faktisk staar i boltradens plan, ikke
  // bare grunnklossens sidekanter - se frontWidth() i geometry.js.
  return frontWidth(m, axisX ? 'y' : 'x', axisX ? front[0].x : front[0].y,
    front.map(p => [t(p) - 1.5 * a1, t(p) + 1.5 * a1]));
}

// 19.4.2.3 / 19.4.4 Betongens avskjæringskapasitet.
function b19ShearConcrete(m, res) {
  const V = res.shear;
  if (V.Vres < 1e-9) {
    const why = 'Ingen skjærkraft på forbindelsen.';
    return { id: 'V-conc', mode: 'Dybelskjær i betong', clause: '19.4', scope: 'gruppe',
             NRk: Infinity, NRd: Infinity, NEd: 0, util: 0,
             calc: skipped('19.4', why), note: why };
  }
  const cd = b19Concrete(m), st = b19Steel(m), sh = shaftProps(m);
  const cc = m.concrete, a = m.anchors, all = anchorPositions(m);
  const plate = m.plate.present;
  const welded = a.attachment !== 'bolted';
  // Uten trykkflate mot betongen - verken fordi det ikke finnes noen plate,
  // eller fordi plata er avstandsmontert - virker skjæret med momentarm i
  // bolten før det når betongen. Lokal knusing der bolten går inn i betongen
  // blir da det samme som for en fritt stående dybel, selv om det finnes en
  // plate lenger oppe: forhøyelsen i 19.4.4 forutsetter at plata selv gir
  // betongen lokal støtte, og det gjør den ikke uten kontaktflate.
  const bearing = mounting(m).contact;

  const kind = !bearing ? 'dowel' : welded ? 'welded' : 'bolted';
  const factor = { dowel: KB.dowel, welded: KB.dowelWelded, bolted: KB.dowelBolted }[kind];
  const FTXT = {
    dowel: plate
      ? 'Plata er avstandsmontert – ingen trykkflate mot betongen, så lokal ' +
        'knusing regnes som for en fritt stående dybel: kombinasjonsformelen (19.4.2.3)'
      : 'Dybel uten stålplate – kombinasjonsformelen (19.4.2.3)',
    welded: 'Innstøpt stålplate med påsveiste forankringer: 86 % høyere enn ' +
            'ren dybel, avrundet til 1,8 (19.4.4)',
    bolted: 'Påskrudd stålplate: 1,8 · 0,5/0,6 = 1,5 (19.4.4)',
  };

  const c = new Calc(bearing ? '19.4.4' : '19.4.2.3');
  c.in('⌀', sh.d, 'mm', 'Bolter · nominell diameter');
  c.in('f_cd', cd.fcd, 'N/mm²', `Betongdel · 0,85 · f_ck / γ_c`);
  c.in(st.kind === 'rebar' ? 'f_yd' : st.fSym, st.fDowel, 'N/mm²',
    `Bolter · ${st.id}`);
  c.in('n · ⌀', st.nEdge * sh.d, 'mm',
    `Kantavstand for øvre grense, n = ${st.nEdge} – tab. B 19.4.2`);
  c.in('V_Ed,g', V.Vres, 'N', 'Resultant skjærkraft på gruppa');

  const kf = c.step({ sym: 'faktor', desc: FTXT[kind],
    formula: 'V⁰_Rd,c = faktor · ⌀² · √(f_cd · f_sd)', subst: `${n(factor, 1)}`,
    value: factor, unit: '–', ref: bearing ? '19.4.4' : '19.4.2.3' });
  const V0 = c.step({ sym: 'V⁰_Rd,c', desc: 'Kapasitet pr. stang ved stor kantavstand',
    formula: 'faktor · ⌀² · √(f_cd · f_sd)',
    subst: `${n(kf, 1)} · ${n(sh.d, 0)}² · √(${n(cd.fcd, 1)} · ${n(st.fDowel, 0)})`,
    value: factor * sh.d * sh.d * Math.sqrt(cd.fcd * st.fDowel), unit: 'N',
    ref: bearing ? '19.4.4' : '19.4.2.3' });

  if (kind === 'dowel')
    c.step({ sym: 'sammenlikning', desc:
      'De to enkeltmodellene kombinasjonsformelen ligger mellom: stålets ' +
      'bøyning og ren knusing av betongen foran dybelen',
      formula: 'f_yd·⌀²/4,5   og   4,5 · f_cd · ⌀²',
      subst: `${n(st.fM * sh.d * sh.d / 4.5)} N  og  ` +
             `${n(KB.dowelCrush * cd.fcd * sh.d * sh.d)} N`,
      value: Math.min(st.fM * sh.d * sh.d / 4.5, KB.dowelCrush * cd.fcd * sh.d * sh.d),
      unit: 'N', ref: '19.4.2.3' });

  // --- kant i skjærkraftas retning ---------------------------------------
  const cands = [];
  if (V.Vx > 0 && cc.freeEdges.xPos) cands.push('xPos');
  if (V.Vx < 0 && cc.freeEdges.xNeg) cands.push('xNeg');
  if (V.Vy > 0 && cc.freeEdges.yPos) cands.push('yPos');
  if (V.Vy < 0 && cc.freeEdges.yNeg) cands.push('yNeg');

  let worst = null;
  for (const dir of cands) {
    const ds = all.map(p => edgeDistances(m, p.x, p.y)[dir]);
    const a1 = Math.min(...ds);
    if (!Number.isFinite(a1)) continue;
    const front = all.filter((p, i) => Math.abs(ds[i] - a1) < 1e-6);
    const back = all.length - front.length;
    const n1 = front.length ? all.length / front.length : 1;   // rekker i lastretninga
    const n2 = front.length;                                   // stenger i fremste rekke
    const a1c = Math.min(a1, st.nEdge * sh.d);                 // øvre grense i ks og Ψ_f,V

    const ka = clamp((a1 - sh.d) / (st.nEdge * sh.d - sh.d), 0, Infinity);
    const width = b19FrontWidth(m, dir, a1c, front);
    const ks = width / (3 * a1c);
    const kak = Math.min(ka * ks, n2);
    const s1 = B19_AXIS[dir] === 'x' ? a.sx : a.sy;
    const psi_f = (plate && !welded) ? 1
      : clamp(1 + (n1 - 1) * s1 / (0.75 * a1c), 1, n1);
    const VRd = kak * psi_f * V0;
    const cand = { dir, a1, a1c, front, back, n1, n2, ka, ks, kak, width, psi_f, VRd,
                   util: V.Vres / VRd, s1 };
    if (!worst || cand.util > worst.util) worst = cand;
  }

  if (!worst) {
    // Ingen fri kant i lastretninga: kapasiteten er den øvre grensa pr. stang
    // ganger antall stenger (k_a·k_s ≤ n_2 og Ψ_f,V ≤ n_1).
    const VRd = c.res({ sym: 'V_Rd,c', formula: 'n · V⁰_Rd,c   (øvre grense)',
      subst: `${all.length} · ${n(V0)}`, value: all.length * V0, unit: 'N',
      ref: '19.4.4' });
    c.util({ formula: 'V_Ed,g / V_Rd,c', subst: `${n(V.Vres)} / ${n(VRd)}`,
      value: V.Vres / VRd });
    return { id: 'V-conc', mode: 'Dybelskjær i betong', clause: bearing ? '19.4.4' : '19.4.2.3',
             scope: 'gruppe', NRk: VRd, NRd: VRd, NEd: V.Vres, util: V.Vres / VRd,
             calc: c, note: 'Ingen fri kant i skjærkraftas retning – øvre grense ' +
                            'for lokal knusing av betongen styrer.' };
  }

  const w = worst;
  c.in('a_1', w.a1, 'mm',
    `Kantavstand til kant ${B19_EDGE[w.dir]}, fremste rekke`);
  if (w.a1c < w.a1)
    c.step({ sym: 'a′_1', desc:
      'Stor kantavstand overvurderer k_s og Ψ_f,V – a_1 begrenses til n·⌀ i disse',
      formula: 'min(a_1 ; n · ⌀)',
      subst: `min(${n(w.a1, 0)} ; ${st.nEdge}·${n(sh.d, 0)})`,
      value: w.a1c, unit: 'mm', ref: '19.4.4' });
  const ka = c.step({ sym: 'k_a', desc:
    'Kantavstanden i kraftretninga. Øvre grense nås ved a_1 = n·⌀; under det ' +
    'faller kapasiteten rettlinjet mot null ved a_1 = ⌀',
    formula: '(a_1 − ⌀) / (n·⌀ − ⌀)',
    subst: `(${n(w.a1, 0)} − ${n(sh.d, 0)}) / (${st.nEdge}·${n(sh.d, 0)} − ${n(sh.d, 0)})`,
    value: w.ka, unit: '–', ref: 'fig. B 19.49' });
  const ks = c.step({ sym: 'k_s', desc:
    `Bruddflata på tvers: 1,5·a_1 til hver side av de ${w.n2} stengene i fremste ` +
    'rekke, slått sammen og klippet mot sidekantene',
    formula: 'bredde / (3 · a_1)',
    subst: `${n(w.width, 0)} / (3 · ${n(w.a1c, 0)})`,
    value: w.ks, unit: '–', ref: 'fig. B 19.50' });
  const kak = c.step({ sym: 'k_a · k_s', desc:
    `Samlet effekt kan ikke overstige antallet stenger i fremste rekke (${w.n2})`,
    formula: 'min(k_a · k_s ; n_2)',
    subst: `min(${n(ka)} · ${n(ks)} ; ${w.n2})`, value: w.kak, unit: '–',
    ref: '19.4.4' });
  const psi_f = c.step({ sym: 'Ψ_f,V', desc: (plate && !welded)
      ? 'Påskrudd plate i overdimensjonerte hull – bare fremste rekke regnes med'
      : `Bakre rekker bidrar når s_1 ≥ 0,75·a_1 (${w.n1} rekker i lastretninga)`,
    formula: (plate && !welded) ? '1,0'
      : '1 + (n_1 − 1) · s_1 / (0,75 · a_1) ≤ n_1',
    subst: (plate && !welded) ? '–'
      : `1 + (${w.n1} − 1) · ${n(w.s1, 0)} / (0,75 · ${n(w.a1c, 0)})`,
    value: w.psi_f, unit: '–', ref: '19.4.4' });

  const VRd = c.res({ sym: 'V_Rd,c', formula: 'k_a · k_s · Ψ_f,V · V⁰_Rd,c',
    subst: `${n(kak)} · ${n(psi_f)} · ${n(V0)}`, value: w.VRd, unit: 'N',
    ref: '19.4.4' });
  c.util({ formula: 'V_Ed,g / V_Rd,c', subst: `${n(V.Vres)} / ${n(VRd)}`,
    value: w.util });

  return { id: 'V-conc', mode: `Dybelskjær mot kant ${B19_EDGE[w.dir]}`,
           clause: bearing ? '19.4.4' : '19.4.2.3', scope: 'gruppe', edgeDir: w.dir,
           NRk: VRd, NRd: VRd, NEd: V.Vres, util: w.util, calc: c };
}

// ===========================================================================
//  19.6 Interaksjonsformler
// ===========================================================================
function b19Interaction(m, res, checks) {
  const pick = id => checks.find(c => c.id === id);
  const u = id => { const c = pick(id); return Number.isFinite(c?.util) ? c.util : 0; };
  // Dekker også id-ene fra EN 1992-4-motoren (N-cone/N-pullout/N-blowout/
  // N-split, V-pryout/V-edge), i tilfelle strekk eller skjær mot betong er
  // valgt fra den standarden mens samvirkningen fortsatt regnes etter B19.
  const uMax = ids => Math.max(0, ...ids.map(u));
  const out = [];
  const sh = shaftProps(m);
  const e = res.leverArm;
  const long = e > 2 * sh.d;

  // --- stål -------------------------------------------------------------
  const nS = u('N-steel'), vS = u('V-steel'), mS = u('V-bend');
  const cs = new Calc('19.6');
  cs.in('n', nS, '–', 'Stålbrudd strekk – utnyttelse');
  cs.in('v', vS, '–', 'Stålbrudd skjær – utnyttelse');
  cs.in('m', mS, '–', 'Bøyning av dybel – utnyttelse');
  cs.in('e', e, 'mm', 'Utkraging');
  cs.step({ sym: 'n² + v²', desc: 'Ekstremt kort bolt – skjær styrer',
    formula: 'n² + v² ≤ 1', subst: `${n(nS)}² + ${n(vS)}²`,
    value: nS ** 2 + vS ** 2, unit: '–' });
  cs.step({ sym: 'n² + m', desc: 'Utkraget stang (e > 2·⌀) – moment styrer',
    formula: 'n² + m ≤ 1', subst: `${n(nS)}² + ${n(mS)}`,
    value: nS ** 2 + mS, unit: '–' });
  const uS = long ? nS ** 2 + mS : nS ** 2 + vS ** 2;
  cs.res({ sym: 'styrende', formula: long ? 'n² + m ≤ 1' : 'n² + v² ≤ 1',
    subst: long ? `e = ${n(e, 0)} mm > 2·⌀ = ${n(2 * sh.d, 0)} mm`
                : `e = ${n(e, 0)} mm ≤ 2·⌀ = ${n(2 * sh.d, 0)} mm`,
    value: uS, unit: '–', ref: '19.6' });
  cs.util({ formula: long ? 'n² + m' : 'n² + v²',
    subst: long ? `${n(nS)}² + ${n(mS)}` : `${n(nS)}² + ${n(vS)}²`, value: uS });
  out.push({ id: 'IA-steel', mode: 'Samvirkning stål', clause: '19.6',
    scope: 'kombinasjon', expr: long ? 'n² + m ≤ 1' : 'n² + v² ≤ 1',
    util: uS, calc: cs, NRk: NaN, NRd: NaN, NEd: NaN });

  // --- betong -----------------------------------------------------------
  const nC = uMax(['N-conc', 'N-cone', 'N-pullout', 'N-blowout', 'N-split']);
  const vC = uMax(['V-conc', 'V-pryout', 'V-edge']);
  const cc = new Calc('19.6');
  cc.in('n', nC, '–', 'Utrivning av betong – utnyttelse');
  cc.in('v', vC, '–', 'Dybelskjær i betong – utnyttelse');
  cc.res({ sym: 'n^1,5 + v^1,5', formula: 'n^1,5 + v^1,5 ≤ 1',
    subst: `${n(nC)}^1,5 + ${n(vC)}^1,5`, value: nC ** 1.5 + vC ** 1.5,
    unit: '–', ref: '19.6' });
  cc.util({ formula: 'n^1,5 + v^1,5', subst: `${n(nC)}^1,5 + ${n(vC)}^1,5`,
    value: nC ** 1.5 + vC ** 1.5 });
  out.push({ id: 'IA-conc', mode: 'Samvirkning betong', clause: '19.6',
    scope: 'kombinasjon', expr: 'n^1,5 + v^1,5 ≤ 1',
    util: nC ** 1.5 + vC ** 1.5, calc: cc, NRk: NaN, NRd: NaN, NEd: NaN });

  // --- stål og betong ---------------------------------------------------
  // Er stålet svakest i den ene bruddtypen og betongen i den andre, gjelder
  // en mellomliggende kurve. n og v regnes da av den minste kapasiteten.
  const nMix = Math.max(nS, nC), vMix = Math.max(vS, mS, vC);
  const nGov = nS >= nC ? 'stål' : 'betong';
  const vGov = Math.max(vS, mS) >= vC ? 'stål' : 'betong';
  const cm = new Calc('19.6');
  cm.in('n', nMix, '–', `Strekk mot minste kapasitet (${nGov})`);
  cm.in('v', vMix, '–', `Skjær mot minste kapasitet (${vGov})`);
  cm.res({ sym: 'n^5/3 + v^5/3', formula: 'n^5/3 + v^5/3 ≤ 1',
    subst: `${n(nMix)}^5/3 + ${n(vMix)}^5/3`,
    value: nMix ** (5 / 3) + vMix ** (5 / 3), unit: '–', ref: 'fig. B 19.53' });
  cm.util({ formula: 'n^5/3 + v^5/3', subst: `${n(nMix)}^5/3 + ${n(vMix)}^5/3`,
    value: nMix ** (5 / 3) + vMix ** (5 / 3) });
  out.push({ id: 'IA-mix', mode: 'Samvirkning stål og betong', clause: '19.6',
    scope: 'kombinasjon', expr: 'n^5/3 + v^5/3 ≤ 1',
    util: nMix ** (5 / 3) + vMix ** (5 / 3), calc: cm,
    NRk: NaN, NRd: NaN, NEd: NaN,
    note: nGov === vGov
      ? `Begge bruddtypene styres av ${nGov}. Boka anbefaler denne formelen ` +
        'når stålet er svakest i den ene og betongen i den andre – den er da ' +
        `strengere enn nødvendig; se «Samvirkning ${nGov}».`
      : undefined });

  return out;
}

// ---------------------------------------------------------------------------
function runB19(m, res) {
  const cd = b19Concrete(m), st = b19Steel(m);
  const checks = [
    b19TensionSteel(m, res),
    b19TensionConcrete(m, res),
    b19FootPressure(m, res),
    b19ShearSteel(m, res),
    b19ShearBending(m, res),
    b19ShearConcrete(m, res),
  ];
  return {
    standard: 'Betongelementboka bind B, kap. B19',
    gamma: { gc: cd.gc, gM0: KB.gM0, gM2: KB.gM2, gS: KB.gS, steel: st.kind },
    checks: [...checks, ...b19Interaction(m, res, checks)],
  };
}

// ===== src/engine/validate.js ======================================
// ---------------------------------------------------------------------------
//  Inndatakontroll.  Fanger geometri som ikke gir mening, og minstekrav til
//  kant-/senteravstand.  'error' stopper ikke beregningen, men resultatet skal
//  ikke brukes.
// ---------------------------------------------------------------------------

function validate(m) {
  const out = [];
  const err = t => out.push({ level: 'error', text: t });
  const warn = t => out.push({ level: 'warn', text: t });

  const a = m.anchors, c = m.concrete, p = m.plate;
  const pos = anchorPositions(m);

  // --- entydig gal geometri ---------------------------------------------
  for (const q of pos) {
    const e = edgeDistances(m, q.x, q.y);
    const cmin = Math.min(e.xNeg, e.xPos, e.yNeg, e.yPos);
    if (cmin <= 0) {
      err(`Bolt ${q.id} ligger utenfor betongdelen (kantavstand ${Math.round(cmin)} mm). ` +
          `Øk L_x/L_y, eller reduser senteravstand/offset.`);
      break;
    }
  }
  // Tykkelsen som gjelder er den lokale: en utsparing i over- eller underflata
  // gjoer betongen tynnere akkurat der forankringen staar.
  const hLoc = memberThickness(m, pos);
  const hTxt = hLoc === c.h ? `h = ${c.h} mm`
    : `lokal tykkelse ${Math.round(hLoc)} mm (h = ${c.h} mm utenfor formene)`;
  if (a.hef >= hLoc) err(`h_ef = ${a.hef} mm er ikke mindre enn ${hTxt}.`);
  else if (a.hef > 0.8 * hLoc)
    warn(`h_ef = ${a.hef} mm er over 80 % av tykkelsen (${hTxt}) – kontroller ` +
         `gjennomlokking og plass til hodet.`);
  if (p.present && (p.bx > c.Lx || p.by > c.Ly))
    warn('Forankringsplata er større enn betongdelen.');
  if (a.nx * a.ny < 1) err('Minst én bolt kreves.');

  // --- formene i betongen -----------------------------------------------
  const fts = features(m);
  fts.forEach((ft, i) => {
    const nm = `Form ${i + 1} (${FACE_LABEL[ft.face] || ft.face})`;
    if (!(ft.bu > 0) || !(ft.bv > 0)) { warn(`${nm}: snittet har ingen utstrekning.`); return; }
    if (Math.abs(+ft.depth || 0) < 1e-6) {
      warn(`${nm} er ikke dratt ut ennå – den endrer ingenting. Dra i pila i ` +
