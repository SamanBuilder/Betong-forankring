<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui;background:#faf9f7}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bruddkjegle</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
} }
</script>
<style>
/* ---------------------------------------------------------------------------
   Klassisk beregningsprogram-oppsett: verktøylinje øverst, tre ruter under,
   statuslinje nederst. Hver rute er avgrenset og har sin egen dokkede
   verktøylinje - ingenting flyter oppå 3D-visninga.

   Lyst, varmt papir som grunn. Materialfargene i 3D er de virkelige; grønn,
   gul og rød er reservert utnyttelse og brukes aldri som pynt.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;

  --bg:#efede8;
  --panel:#faf9f6;
  --panel2:#f3f1ec;
  --panel3:#e8e5dd;
  --line:#e2ded5;
  --line2:#d2ccc0;

  --tx:#2b2924;
  --tx2:#6a655b;
  --tx3:#9a9488;

  --acc:#8a7448;
  --acc-soft:#efe7d4;

  --ok:#6e9e4f;
  --warn:#c79030;
  --bad:#c0524a;

  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --h-top:42px;
  --h-status:26px;

  /* Rutestørrelser. Endres av draghåndtakene, se initSplitters(). */
  --w-left:300px;
  --w-right:404px;
  --h-loads:206px;
}

* { box-sizing:border-box; }
body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--tx);
       font:13px/1.45 var(--sans); -webkit-font-smoothing:antialiased; }
.mono, input[type=number], .num { font-variant-numeric:tabular-nums; }
:focus-visible { outline:2px solid var(--acc); outline-offset:1px; border-radius:3px; }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ transition:none!important; } }

/* === rammeverk ========================================================== */
.app { display:grid; grid-template-rows:var(--h-top) minmax(0,1fr) var(--h-status);
       height:100vh; }

.topbar {
  display:flex; align-items:center; gap:14px; padding:0 14px;
  background:var(--panel); border-bottom:1px solid var(--line);
}
.topbar .brand { font-size:12.5px; font-weight:600; letter-spacing:.11em;
  text-transform:uppercase; margin-right:2px; }
.topbar .sep { width:1px; height:20px; background:var(--line); }
.topbar .grow { flex:1 1 auto; }
.topbar label { font-size:11px; color:var(--tx3); margin-right:5px; }
.topbar select {
  background:#fff; border:1px solid var(--line2); border-radius:5px;
  padding:4px 7px; font:11.5px var(--sans); color:var(--tx);
}
.topbar .units { font:11px var(--mono); color:var(--tx3); }

.body { display:grid;
        grid-template-columns:var(--w-left) minmax(0,1fr) var(--w-right);
        min-height:0; }

.pane { position:relative; display:flex; flex-direction:column;
        min-width:0; min-height:0; background:var(--panel); }
.pane + .pane { border-left:1px solid var(--line); }
.pane.view { background:var(--bg); }

.pane-head {
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:0 10px; height:34px;
  border-bottom:1px solid var(--line); background:var(--panel2);
}
.pane-head h2 { margin:0; font-size:10.5px; font-weight:600; letter-spacing:.11em;
  text-transform:uppercase; color:var(--tx2); white-space:nowrap; }
.pane-head .grow { flex:1 1 auto; }
.pane-head .stat { font:11px var(--mono); color:var(--tx3); white-space:nowrap; }

.pane-sub {
  flex:0 0 auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:6px 10px; border-bottom:1px solid var(--line); background:var(--panel);
}
.pane-body { flex:1 1 auto; overflow:auto; min-height:0; }
.pane-body::-webkit-scrollbar { width:10px; }
.pane-body::-webkit-scrollbar-thumb { background:var(--line2); border-radius:6px;
  border:3px solid var(--panel); }

.statusbar {
  display:flex; align-items:center; gap:0; padding:0 12px;
  background:var(--panel2); border-top:1px solid var(--line);
  font:11px var(--mono); color:var(--tx2);
}
.statusbar span { padding:0 12px; border-right:1px solid var(--line); }
.statusbar span:first-child { padding-left:0; }
.statusbar span:last-child { border-right:0; }
.statusbar .grow { flex:1 1 auto; border-right:0; }

/* === knapper ============================================================ */
.btn {
  font:500 11px/1 var(--sans); padding:5px 9px; border-radius:5px; cursor:pointer;
  border:1px solid var(--line2); background:#fff; color:var(--tx2); white-space:nowrap;
  transition:color .12s, border-color .12s, background .12s;
}
.btn:hover { color:var(--acc); border-color:var(--acc); background:var(--acc-soft); }
.btn[aria-pressed="true"] { color:var(--acc); border-color:var(--acc); background:var(--acc-soft); }
.btn.ghost { border-color:transparent; background:none; }
.btn.ghost:hover { border-color:var(--acc); }
.btn.wide { width:100%; padding:9px; margin-top:20px; }
.btn-row { display:flex; gap:4px; }

.tog { display:inline-flex; align-items:center; gap:5px; font-size:11px;
       color:var(--tx2); cursor:pointer; white-space:nowrap; }
.tog:hover { color:var(--tx); }
.tog input { accent-color:var(--acc); width:13px; height:13px; margin:0; }

/* === inndata ============================================================ */
/* Gruppevelgeren er navigasjonen i inndataruta: én gruppe om gangen, alltid
   synlig hvilke som finnes. */
.groups { flex:0 0 auto; border-bottom:1px solid var(--line); padding:5px; }
.groups button {
  display:flex; width:100%; align-items:center; gap:8px; text-align:left;
  border:0; background:none; cursor:pointer; border-radius:5px;
  padding:6px 8px; font:12px var(--sans); color:var(--tx2);
  transition:background .12s, color .12s;
}
.groups button:hover { background:var(--panel2); color:var(--tx); }
.groups button[aria-current="true"] { background:var(--acc-soft); color:var(--acc); font-weight:500; }
.groups button i { font-style:normal; color:var(--tx3); font-size:10.5px; margin-left:auto;
  font-family:var(--mono); }
.groups button[aria-current="true"] i { color:var(--acc); }

.form { padding:12px 14px 40px; }
.form h3 { margin:0 0 11px; font-size:10px; font-weight:600; letter-spacing:.11em;
  text-transform:uppercase; color:var(--tx3); padding-bottom:7px;
  border-bottom:1px solid var(--line); }
.fld { display:grid; grid-template-columns:1fr 92px; align-items:center; gap:10px;
       margin-bottom:7px; }
.fld.bool { grid-template-columns:1fr auto; }
.lbl { color:var(--tx2); font-size:12px; }
.lbl i { color:var(--tx3); font-style:normal; font-size:10.5px; }
.fld input[type=number], .fld select {
  width:100%; background:#fff; color:var(--tx); border:1px solid var(--line2);
  border-radius:5px; padding:5px 7px; font:12px var(--mono);
}
.fld select { font:11.5px var(--sans); }
.fld input[type=number]:hover, .fld select:hover { border-color:var(--acc); }
.fld input[type=checkbox] { width:15px; height:15px; accent-color:var(--acc); }
.hint { color:var(--tx3); font-size:11px; line-height:1.5; margin:14px 0 0; }

/* --- former i betongen ------------------------------------------------- */
.feat-add { display:flex; gap:5px; margin:14px 0 4px; flex-wrap:wrap; }
.feat-add select { flex:1 1 120px; min-width:0;
  font:11.5px var(--sans); color:var(--tx); background:var(--panel);
  border:1px solid var(--line2); border-radius:5px; padding:5px 6px; }
.feat-add select:hover { border-color:var(--acc); }
.feat { border:1px solid var(--line); border-radius:7px; padding:4px 10px 10px;
  margin:12px 0 0; background:var(--panel2); }
.feat-head { display:flex; align-items:center; gap:8px; padding:6px 0 4px;
  border-bottom:1px solid var(--line); margin-bottom:4px; }
.feat-head .nm { font-size:11.5px; font-weight:500; color:var(--tx); }
.feat-head .kind { font:10.5px var(--mono); color:var(--tx3); margin-left:auto; }
.feat-head .btn { padding:3px 7px; font-size:10.5px; }
/* Flatenavnet er langt - snittfeltene får en bredere kolonne enn de vanlige. */
.feat .fld { grid-template-columns:1fr 122px; }

/* === 3D ================================================================= */
.stage-wrap { flex:1 1 auto; position:relative; min-height:0; }
three-d-stage { position:absolute; inset:0; }

/* === resultat =========================================================== */
.assump { padding:12px 14px 4px; }
.assump .row { display:flex; justify-content:space-between; gap:14px; align-items:baseline;
  padding:5px 0; border-bottom:1px solid var(--line); }
.assump .row:last-child { border-bottom:0; }
.assump .k { color:var(--tx2); font-size:11.5px; }
.assump .v { color:var(--tx); font:11px var(--mono); text-align:right; }

/* Utnyttelsessammendrag: alle kontrollene samtidig, som loddrette stolper i
   ett felles diagram med en 100 %-strek på tvers. Navnet står loddrett
   (bunn-til-topp) til VENSTRE for stolpen; prosenten står vannrett rett
   under. Alt bunnankres (align-items:flex-end), så 0 %-grunnlinja - og
   dermed 100 %-streken - ligger fast uansett hvor lange navnene er. */
.usum { border-bottom:1px solid var(--line); }
.usum-track { overflow-x:auto; padding:24px 14px 20px; }
.usum-plot { position:relative; display:inline-flex; align-items:flex-end; gap:16px; }
/* 102px = stolpehøyden (84px) + rommet prosenten + luft under tar (18px). */
.usum-100 { position:absolute; left:0; right:0; bottom:102px; height:0;
  border-top:1px dashed var(--line2); }
.usum-100 b { position:absolute; left:2px; bottom:4px; font:10px var(--mono);
  color:var(--tx3); white-space:nowrap; }
.usum-item { flex:0 0 auto; display:flex; align-items:flex-end; gap:5px;
  border:0; background:none; cursor:pointer; padding:0; }
/* Loddrett tekst, bunn-til-topp - se samme teknikk brukt i .hud for målsatte tall. */
.usum-item .nm { writing-mode:vertical-rl; transform:rotate(180deg);
  font-size:10px; line-height:1.2; color:var(--tx2); white-space:nowrap;
  transition:color .12s; }
.usum-item .stack { display:flex; flex-direction:column; align-items:center; gap:4px; }
.usum-item .col { width:14px; height:84px; display:flex; align-items:flex-end; }
.usum-item .col i { display:block; width:100%; border-radius:2px 2px 0 0; }
.usum-item .pc { font:600 10px var(--mono); color:var(--tx2); white-space:nowrap; }
.usum-item.over .pc { color:var(--bad); }
.usum-item:hover .nm, .usum-item:hover .pc { color:var(--tx); }
.usum-item[aria-current="true"] .nm { color:var(--acc); font-weight:500; }

.sect { margin:20px 14px 0; font-size:10px; font-weight:600; letter-spacing:.11em;
  text-transform:uppercase; color:var(--tx3); padding-bottom:6px;
  border-bottom:1px solid var(--line); }

/* Utnyttelsen skal kunne leses på avstand: tykk stolpe, tydelig prosent. */
.chk { display:block; width:100%; text-align:left; border:0; background:none;
  cursor:pointer; padding:11px 14px; border-bottom:1px solid var(--line);
  transition:background .12s; }
.chk:hover { background:var(--panel2); }
.chk[aria-current="true"] { background:var(--acc-soft); }
.chk .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.chk .name { font-size:12.5px; color:var(--tx); }
.chk .pc { font:600 13px var(--mono); color:var(--tx); font-variant-numeric:tabular-nums; }
.chk.over .pc { color:var(--bad); }
.chk.na .name, .chk.na .pc { color:var(--tx3); font-weight:400; }
.track { height:10px; background:var(--panel3); border-radius:3px; margin:8px 0 7px;
  overflow:hidden; position:relative; }
.track i { display:block; height:100%; border-radius:3px; }
/* Merket ved 100 % gjør at en stolpe nær grensa kan leses uten å se på tallet. */
.track.full::after { content:''; position:absolute; inset:0 0 0 auto; width:2px;
  background:var(--line2); }
.chk .sub { font:10.5px/1.5 var(--mono); color:var(--tx3); }
.chk .sub b { font-weight:400; color:var(--tx2); }

.msg { margin:12px 14px 0; padding:9px 11px; border-radius:6px; font-size:11.5px; }
.msg.warn { background:#fbf3e0; border:1px solid #ecdcb4; color:#8a6516; }
.msg.err  { background:#fbeceb; border:1px solid #f0cfcc; color:#9a3b34; }
.msg code { font-family:var(--mono); }

table.anchors { width:100%; border-collapse:collapse; font-size:11.5px; }
table.anchors th { text-align:right; color:var(--tx3); font-weight:500; font-size:9.5px;
  letter-spacing:.08em; text-transform:uppercase; padding:7px 0 6px;
  border-bottom:1px solid var(--line); }
table.anchors th:first-child { text-align:left; }
table.anchors td { padding:5px 0; border-bottom:1px solid var(--line);
  font-family:var(--mono); text-align:right; font-variant-numeric:tabular-nums; }
table.anchors td:first-child { text-align:left; color:var(--tx2); }
.pad { padding:0 14px 40px; }

/* === utregningsark ====================================================== */
/* Vises i midtruta, så formlene får full bredde og resultatlista blir stående. */
.sheet { padding:20px 26px 60px; max-width:900px; }
.sheet .hdr { display:flex; justify-content:space-between; align-items:baseline;
  gap:16px; padding-bottom:14px; border-bottom:2px solid var(--line2); }
.sheet .hdr h2 { margin:0; font-size:17px; font-weight:600; letter-spacing:-.01em; }
.sheet .hdr .ref { font:11px var(--mono); color:var(--tx2); text-align:right; }
.sheet .verdict { display:flex; align-items:center; gap:14px; margin:16px 0 4px; }
.sheet .verdict .track { flex:1 1 auto; height:14px; margin:0; }
.sheet .verdict .pc { font:600 20px var(--mono); font-variant-numeric:tabular-nums; }

.sheet h3 { margin:26px 0 10px; font-size:10px; font-weight:600; letter-spacing:.11em;
  text-transform:uppercase; color:var(--tx3); padding-bottom:6px;
  border-bottom:1px solid var(--line); }

table.io { width:100%; border-collapse:collapse; }
table.io th { font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--tx3); font-weight:500; text-align:left; padding:0 10px 6px 0; }
table.io td { padding:5px 10px 5px 0; border-top:1px solid var(--line);
  font-size:12px; vertical-align:baseline; }
table.io td.sym { font:12px var(--mono); color:var(--tx); white-space:nowrap; width:1%; }
table.io td.num { font:12px var(--mono); text-align:right; white-space:nowrap; width:1%;
  font-variant-numeric:tabular-nums; }
table.io td.unit { font:11px var(--mono); color:var(--tx3); white-space:nowrap; width:1%; }
table.io td.src { color:var(--tx2); font-size:11.5px; }

.step { padding:12px 0; border-top:1px solid var(--line); }
.step .l1 { display:flex; justify-content:space-between; align-items:baseline; gap:14px; }
.step .sym { font:600 12.5px var(--mono); color:var(--tx); }
.step .desc { color:var(--tx2); font-size:11.5px; flex:1 1 auto; }
.step .ref { font:10.5px var(--mono); color:var(--tx3); white-space:nowrap; }
/* Formel, innsatte tall og svar under hverandre, med = i samme kolonne. */
.step .eq { display:grid; grid-template-columns:16px minmax(0,1fr); gap:0 6px;
  margin-top:7px; font:12px/1.7 var(--mono); }
.step .eq span:nth-child(odd) { color:var(--tx3); text-align:right; }
.step .eq .f { color:var(--tx2); overflow-wrap:anywhere; }
.step .eq .s { color:var(--tx2); overflow-wrap:anywhere; }
.step .eq .v { color:var(--tx); font-weight:500; }

.step.res { background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  padding:14px 16px; margin-top:10px; }
.step.res .eq .v { font-size:13.5px; }
.step.final { border:1px solid var(--line); border-radius:8px; padding:14px 16px;
  margin-top:10px; }
.step.final.ok  { background:#f1f6ec; border-color:#d7e5c9; }
.step.final.bad { background:#fbeceb; border-color:#f0cfcc; }
.step.final .eq .v { font-size:15px; font-weight:600; }

.sheet .empty { color:var(--tx2); font-size:13px; padding:40px 0; text-align:center; }
.sheet .note { margin:10px 0 0; padding:9px 11px; border-radius:6px; font-size:11.5px;
  background:#fbf3e0; border:1px solid #ecdcb4; color:#8a6516; }

/* === smale skjermer ===================================================== */
/* --- draghåndtak ---------------------------------------------------------
   Ett håndtak pr. rute, på den kanten som vender inn mot visninga: venstre
   rute dras i høyre kant, høyre rute i venstre, lastruta i overkant. Selve
   flata er bredere enn streken, så den er lett å treffe. */
.split { position:absolute; z-index:6; background:transparent; touch-action:none; }
.split.col { top:0; bottom:0; width:9px; right:-5px; cursor:col-resize; }
.split.col.r { right:auto; left:-5px; }
.split.row { left:0; right:0; height:9px; top:-5px; cursor:row-resize; }
.split::after {
  content:''; position:absolute; background:var(--acc);
  opacity:0; transition:opacity .12s ease;
}
.split.col::after { top:0; bottom:0; left:4px; width:1px; }
.split.row::after { left:0; right:0; top:4px; height:1px; }
.split:hover::after, .split:focus-visible::after, .split.on::after { opacity:1; }
.split:focus-visible { outline:none; }

/* Under draging skal pekeren beholde formen og ingenting markeres. */
body.rs-col, body.rs-col * { cursor:col-resize !important; }
body.rs-row, body.rs-row * { cursor:row-resize !important; }
body.rs-col, body.rs-row { user-select:none; }

@media (max-width:1240px){ .body{ grid-template-columns:var(--w-left) minmax(0,1fr) var(--w-right); } }
@media (max-width:1040px){
  body{ overflow:auto; }
  .app{ grid-template-rows:var(--h-top) auto var(--h-status);
        height:auto; min-height:100vh; }
  .pane.view > .loads{ flex:0 0 auto; min-height:var(--h-loads); }
  .body{ grid-template-columns:minmax(0,1fr); }
  .split{ display:none; }
  .pane + .pane { border-left:0; border-top:1px solid var(--line); }
  .pane.view .stage-wrap { height:56vh; }
  .pane.inputs .pane-body, .pane.results .pane-body { overflow:visible; }
}

/* === påskrifter i modellen ===============================================
   Mål og lastverdier er DOM-elementer plassert med 3D-transformasjoner, så de
   ligger i modellens plan og følger den. Uttrykket er tegningens: tynn svart
   tekst rett på flata, uten ramme og uten enhet - enhetene står i statuslinja.
   Redigerbarheten vises først når pekeren er innom feltet.                  */
.hud { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.hud .dim, .hud .hload, .hud .hval { pointer-events:auto; white-space:nowrap; }

.hud .dim {
  font:400 13px/1.25 var(--mono); color:#14120f;
  padding:0 2px; border-radius:2px; text-align:center;
}
.hud .dim.ro { color:#2f2b24; }
.hud .dim input {
  width:4.2em; border:0; padding:0; background:none; text-align:center;
  font:inherit; color:inherit; font-variant-numeric:tabular-nums; cursor:text;
}

.hud .hload { font:400 13px/1.25 var(--mono); padding:0 2px; }
.hud .hload input {
  width:4.2em; border:0; padding:0; background:none; text-align:right;
  font:inherit; color:inherit; font-variant-numeric:tabular-nums; cursor:text;
}
.hud .u { color:#6b665c; margin-left:.25em; font-size:.8em; }

.hud .dim:hover, .hud .hload:hover { background:rgba(255,255,255,.75); }
.hud .dim input:focus, .hud .hload input:focus {
  outline:none; background:#fff; box-shadow:0 0 0 1px var(--acc);
}

.hud .hval {
  font:400 12px/1.3 var(--mono); font-variant-numeric:tabular-nums;
  text-shadow:0 0 3px var(--bg), 0 0 3px var(--bg);
}

.hud input::-webkit-outer-spin-button,
.hud input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.hud input[type=number] { -moz-appearance:textfield; appearance:textfield; }

/* === lastkombinasjoner ===================================================
   Egen rute i full bredde under de tre kolonnene. Tabellen er hele
   grensesnittet: én rad pr. kombinasjon, radioknappen velger hvilken som
   vises i 3D og regnes ut i kontrollruta.                                  */
/* Lastene ligger i midtkolonnen, under visninga - avgrenset av venstre og
   høyre rute, ikke tvers over dem. */
.pane.view > .loads {
  flex:0 0 var(--h-loads); display:flex; flex-direction:column; min-height:0;
  border-top:1px solid var(--line); background:var(--panel);
}
.pane.view > .loads .pane-body { padding:0 12px 14px; overflow:auto; }

table.combos { width:100%; border-collapse:collapse; font-size:12px; }
table.combos thead th {
  position:sticky; top:0; z-index:1; background:var(--panel);
  text-align:right; padding:8px 5px 6px; white-space:nowrap;

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ===== src/core/download.js ========================================
// ---------------------------------------------------------------------------
//  Filnedlasting som virker begge steder.
//
//  Kjører verktøyet lokalt (eller selvhostet) brukes vanlig <a download>.
//  Kjører det som publisert Artifact er direkte nedlasting sperret, og fila
//  må gå gjennom verts-API-et - som bare godtar en liste med filendelser.
//  .obj/.mtl/.glb står ikke på lista, så de legges om:
//      .obj/.mtl -> .txt   (ren tekst uansett, endres tilbake ved lagring)
//      .gltf     -> .json  (glTF ER JSON - fila er gyldig som den er)
//  .glb (binær) har ingen vei gjennom, så eksporten velger glTF der i stedet.
// ---------------------------------------------------------------------------

const ALLOWED = new Set(['gif', 'png', 'jpg', 'jpeg', 'webp', 'mp4', 'webm', 'txt',
  'json', 'md', 'docx', 'pptx', 'epub', 'csv', 'ttf', 'html', 'svg', 'pdf', 'xlsx']);
const REMAP = { obj: 'txt', mtl: 'txt', gltf: 'json' };

let cap;
function host() {
  if (cap === undefined) {
    cap = (typeof window !== 'undefined' && window.claude?.use)
      ? Promise.resolve(window.claude.use('downloads')).catch(() => null)
      : Promise.resolve(null);
  }
  return cap;
}

// Kan verten lagre filer for oss?  Avgjør hvilket 3D-format vi eksporterer.
async function hostSaves() { return !!(await host()); }

async function saveFile(data, filename) {
  const dl = await host();
  if (!dl) { anchorSave(data, filename); return { filename, renamed: null }; }

  const ext = (filename.split('.').pop() || '').toLowerCase();
  let name = filename, renamed = null;
  if (!ALLOWED.has(ext)) {
    const to = REMAP[ext];
    if (!to) throw new Error(`Formatet .${ext} kan ikke lastes ned her.`);
    name = `${filename.replace(/\.[^.]+$/, '')}-${ext}.${to}`;
    renamed = { from: ext, to };
  }
  await dl.save({ filename: name, data });
  return { filename: name, renamed };
}

function anchorSave(data, filename) {
  const blob = data instanceof Blob ? data : new Blob([data]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// Kort, konkret melding til brukeren om hva som faktisk skjedde.
function saveMessage(res) {
  if (!res.renamed) return `Lagret ${res.filename}`;
  return `Lagret ${res.filename} – gi den endelsen .${res.renamed.from} etter nedlasting`;
}

function saveError(e) {
  const code = e?.code;
  if (code === 'declined') return 'Nedlasting avbrutt';
  if (code === 'rate_limited') return 'For mange nedlastinger – prøv igjen om litt';
  if (code === 'unavailable' || code === 'not_granted') return 'Nedlasting er ikke tilgjengelig her';
  return e?.message || 'Nedlasting feilet';
}

// ===== src/engine/calc.js ==========================================
// ---------------------------------------------------------------------------
//  Registrering av utregninga.
//
//  Hver kontroll bygger et Calc-objekt mens den regner, slik at brukeren kan
//  se hele veien fram til svaret: hvilke inndata som gikk inn og hvor de kom
//  fra, hver formel symbolsk, de samme formlene med tall satt inn, og hvilket
//  punkt i standarden leddet stammer fra.
//
//  Poenget er at ingen tall i resultatet skal være uten sporbar opprinnelse.
// ---------------------------------------------------------------------------

// Norsk tallformat. Presisjonen følger størrelsesorden, så et areal ikke får
// tre desimaler og en psi-faktor ikke blir avrundet til «1».
function n(v, dec) {
  if (v === Infinity) return '∞';
  if (!Number.isFinite(v)) return '–';
  if (dec == null) {
    const a = Math.abs(v);
    dec = a === 0 ? 0 : a >= 1e5 ? 0 : a >= 1000 ? 0 : a >= 100 ? 1 : a >= 10 ? 2 : 3;
  }
  return v.toFixed(dec).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

// kN/kNm for kraftstørrelser
const kN = v => n(v / 1000, Math.abs(v) >= 1e6 ? 0 : 1);

class Calc {
  constructor(clause) {
    this.clause = clause;
    this.inputs = [];
    this.steps = [];
    this.result = null;
    this.check = null;
  }

  // Inndata: symbol, verdi, enhet, hvor den er hentet fra
  in(sym, value, unit, source) {
    this.inputs.push({ sym, value, unit, source });
    return value;
  }

  // Mellomledd. `formula` er symbolsk, `subst` er den samme med tall i.
  step({ sym, desc, formula, subst, value, unit, ref, note }) {
    this.steps.push({ sym, desc, formula, subst, value, unit, ref, note });
    return value;
  }

  // Sluttkapasitet
  res({ sym, formula, subst, value, unit, ref }) {
    this.result = { sym, formula, subst, value, unit, ref };
    return value;
  }

  // Selve utnyttelsen
  util({ formula, subst, value }) {
    this.check = { formula, subst, value };
    return value;
  }
}

// Tom registrering for kontroller som ikke er aktuelle
function skipped(clause, why) {
  const c = new Calc(clause);
  c.skipped = why;
  return c;
}

// ===== src/engine/solid.js =========================================
// ---------------------------------------------------------------------------
//  Betongdelen som et legeme, ikke bare en kloss.
//
//  Grunnformen er fortsatt L_x x L_y x h. Oppaa den ligger en liste med
//  «snitt»: et rektangel tegnet i en av de seks flatene og dratt ut eller inn.
//  Dratt ut legger betong til (konsoll, fortanning, forsterkning), dratt inn
//  tar betong bort (utsparing, spor, avtrapping). Det er samme prinsipp som
//  pull/push i SpaceClaim.
//
//  Uttrekket maales alltid fra GRUNNFORMENS flate, ikke fra der betongen
//  tilfeldigvis slutter naa. Da er hvert maal absolutt og leses av tegninga
//  uten aa kjenne de andre formene - men det betyr ogsaa at et tillegg alltid
//  legger seg utenpaa klossen og aldri kan fylle igjen en utsparing: tillegg
//  gaar utover, utsparinger innover, og de to moetes ikke.
//
//  Alle formene er akseparallelle kasser. Da kan legemet beskrives EKSAKT med
//  koordinatkompresjon: hver kasse deler opp x-, y- og z-aksen, og hver celle
//  i rutenettet som oppstaar er enten helt full eller helt tom. Ingen
//  triangulering og ingen toleranser - og alt beregninga trenger av geometri
//  kan leses rett ut av rutenettet:
//
//    planMask()          hvilke soeyler som har betong gjennom en dybde
//    maskArea()          bruddareal A_c,N klippet mot den virkelige formen
//    edgeDistancesAt()   kantavstand ved aa gaa utover til betongen slutter
//    thicknessAt()       lokal tykkelse under en bolt
//    solidBoxes()        legemet som faa kasser, til 3D-visninga
//    boundaryEdges()     bare de ekte kantene, ikke sømmene i rutenettet
//
//  Koordinatene er platas system, som resten av motoren: (0,0) = platesenter,
//  z = 0 i overkant av grunnformen, negativ nedover. Snittene angis i
//  betongdelens eget system (0,0 = delas senter), saa de staar stille naar
//  plata flyttes med e_x / e_y.
// ---------------------------------------------------------------------------

const R6 = v => Math.round(v * 1e6) / 1e6;
const TOL = 1e-6;

// ---------------------------------------------------------------------------
//  Flatene.  Hver flate har et eget 2D-system (u, v) som snittet tegnes i, og
//  en utoverrettet normal som uttrekket foelger.
//
//    xNeg/xPos   u = y i betongdelen,  v = z (0 i overkant, negativ nedover)
//    yNeg/yPos   u = x,                v = z
//    top/bottom  u = x,                v = y
//
//  `n` er utovernormalen i platas system. Positiv uttrekksdybde foelger den,
//  negativ gaar motsatt vei og tar betong bort.
// ---------------------------------------------------------------------------
const FACE_INFO = {
  xNeg:   { axis: 'x', sign: -1, n: [-1, 0, 0], uAxis: 'y', vAxis: 'z' },
  xPos:   { axis: 'x', sign: +1, n: [+1, 0, 0], uAxis: 'y', vAxis: 'z' },
  yNeg:   { axis: 'y', sign: -1, n: [0, -1, 0], uAxis: 'x', vAxis: 'z' },
  yPos:   { axis: 'y', sign: +1, n: [0, +1, 0], uAxis: 'x', vAxis: 'z' },
  top:    { axis: 'z', sign: +1, n: [0, 0, +1], uAxis: 'x', vAxis: 'y' },
  bottom: { axis: 'z', sign: -1, n: [0, 0, -1], uAxis: 'x', vAxis: 'y' },
};

const FACES = Object.keys(FACE_INFO);

const FACE_LABEL = {
  xNeg: 'Sideflate −x', xPos: 'Sideflate +x',
  yNeg: 'Sideflate −y', yPos: 'Sideflate +y',
  top: 'Overflata', bottom: 'Underflata',
};

// Grunnformen i platas system.  Samme tall som memberLimits() gir, men uten
// uendelighetene: her er det den fysiske klossen som gjelder.
function baseBox(m) {
  const c = m.concrete;
  return { x0: R6(-(c.Lx / 2 + c.ex)), x1: R6(c.Lx / 2 - c.ex),
           y0: R6(-(c.Ly / 2 + c.ey)), y1: R6(c.Ly / 2 - c.ey),
           z0: R6(-c.h), z1: 0, add: true };
}

// Flatas eget rektangel, uttrykt i (u, v).  Snittet klippes mot dette, slik at
// betong som legges til alltid henger fast i flata den er tegnet paa.
function faceRect(m, face) {
  const c = m.concrete, f = FACE_INFO[face];
  if (!f) return null;
  if (f.axis === 'z') return { u0: -c.Lx / 2, u1: c.Lx / 2, v0: -c.Ly / 2, v1: c.Ly / 2 };
  const w = f.axis === 'x' ? c.Ly : c.Lx;
  return { u0: -w / 2, u1: w / 2, v0: -c.h, v1: 0 };
}

// Flateplanet i platas system: koordinaten langs flatas akse.
function facePlane(m, face) {
  const b = baseBox(m), f = FACE_INFO[face];
  if (!f) return 0;
  if (f.axis === 'x') return f.sign > 0 ? b.x1 : b.x0;
  if (f.axis === 'y') return f.sign > 0 ? b.y1 : b.y0;
  return f.sign > 0 ? b.z1 : b.z0;
}

// ---------------------------------------------------------------------------
//  Snittet som kasse i platas system.
//
//  Rektangelet klippes mot flata det er tegnet i - ellers kunne et uttrekk
//  legge betong som ikke henger sammen med noe. Uttrekket gaar fra flateplanet
//  og `depth` millimeter langs normalen: positivt utover (mer betong),
//  negativt innover (utsparing).
// ---------------------------------------------------------------------------
function featureBox(m, ft) {
  const f = FACE_INFO[ft.face];
  if (!f) return null;
  const c = m.concrete;
  const d = +ft.depth || 0;
  if (Math.abs(d) < TOL) return null;

  const rect = faceRect(m, ft.face);
  const bu = Math.max(0, +ft.bu || 0), bv = Math.max(0, +ft.bv || 0);
  const u0 = Math.max(rect.u0, (+ft.u || 0) - bu / 2);
  const u1 = Math.min(rect.u1, (+ft.u || 0) + bu / 2);
  const v0 = Math.max(rect.v0, (+ft.v || 0) - bv / 2);
  const v1 = Math.min(rect.v1, (+ft.v || 0) + bv / 2);
  if (!(u1 > u0 + TOL) || !(v1 > v0 + TOL)) return null;

  const plane = facePlane(m, ft.face);
  const a0 = Math.min(plane, plane + f.sign * d);
  const a1 = Math.max(plane, plane + f.sign * d);
  const add = d > 0;

  // (u, v) er i betongdelens system; platas system er forskjoevet med e.
  if (f.axis === 'x')
    return { x0: R6(a0), x1: R6(a1), y0: R6(u0 - c.ey), y1: R6(u1 - c.ey),
             z0: R6(v0), z1: R6(v1), add };
  if (f.axis === 'y')
    return { x0: R6(u0 - c.ex), x1: R6(u1 - c.ex), y0: R6(a0), y1: R6(a1),
             z0: R6(v0), z1: R6(v1), add };
  return { x0: R6(u0 - c.ex), x1: R6(u1 - c.ex), y0: R6(v0 - c.ey), y1: R6(v1 - c.ey),
           z0: R6(a0), z1: R6(a1), add };
}

const features = m => (m.concrete && m.concrete.features) || [];

// ---------------------------------------------------------------------------
//  Rutenettet.
// ---------------------------------------------------------------------------
function axisCuts(boxes, k0, k1) {
  const s = new Set();
  for (const b of boxes) { s.add(b[k0]); s.add(b[k1]); }
  return [...s].sort((a, b) => a - b);
}

function buildSolid(m) {
  const base = baseBox(m);
  const boxes = [base];
  for (const ft of features(m)) {
    const b = featureBox(m, ft);
    if (b) boxes.push(b);
  }
  const xs = axisCuts(boxes, 'x0', 'x1');
  const ys = axisCuts(boxes, 'y0', 'y1');
  const zs = axisCuts(boxes, 'z0', 'z1');
  const nx = xs.length - 1, ny = ys.length - 1, nz = zs.length - 1;
  const occ = new Uint8Array(Math.max(0, nx * ny * nz));

  // Grunnformen foerst, saa hvert snitt i rekkefoelge. Med uttrekk maalt fra
  // grunnformens flater overlapper aldri to snitt, saa rekkefoelgen betyr
  // ingenting i praksis - men den gjoer resultatet entydig uansett.
  for (const b of boxes) {
    const i0 = xs.indexOf(b.x0), i1 = xs.indexOf(b.x1);
    const j0 = ys.indexOf(b.y0), j1 = ys.indexOf(b.y1);
    const k0 = zs.indexOf(b.z0), k1 = zs.indexOf(b.z1);
    const val = b.add ? 1 : 0;
    for (let k = k0; k < k1; k++)
      for (let j = j0; j < j1; j++)
        for (let i = i0; i < i1; i++)
          occ[(k * ny + j) * nx + i] = val;
  }
  return { xs, ys, zs, nx, ny, nz, occ, base,
           at: (i, j, k) => occ[(k * ny + j) * nx + i] };
}

// Legemet bygges om bare naar betonggeometrien faktisk endrer seg. Motoren
// spoer om kantavstander mange ganger pr. beregning, saa dette teller.
let CACHE = { key: null, S: null, masks: null };

function solidKey(m) {
  const c = m.concrete;
  return JSON.stringify([c.Lx, c.Ly, c.h, c.ex, c.ey, c.freeEdges,
    features(m).map(f => [f.face, f.u, f.v, f.bu, f.bv, f.depth])]);
}

function solid(m) {
  const key = solidKey(m);
  if (CACHE.key !== key) CACHE = { key, S: buildSolid(m), masks: new Map() };
  return CACHE.S;
}

// Cellen et punkt ligger i. -1 naar punktet er utenfor rutenettet.
function cellOf(arr, v) {
  if (v < arr[0] - TOL || v > arr[arr.length - 1] + TOL) return -1;
  let lo = 0, hi = arr.length - 2;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (v >= arr[mid] - TOL) lo = mid; else hi = mid - 1; }
  return lo;
}

// ---------------------------------------------------------------------------
//  Planmaske: soeylene som har betong gjennom HELE dybdeintervallet [z0, z1].
//
//  Det er den maska bruddflatene skal klippes mot. En kjegle som paa veien opp
//  passerer et hull har ingen betong aa rive ut der, saa soeyla teller ikke -
//  konservativt, og eksakt naar formen er hel.
// ---------------------------------------------------------------------------
function planMask(m, z0, z1) {
  const S = solid(m);
  const zb = Math.max(Math.min(z0, z1), S.zs[0]);
  const zt = Math.min(Math.max(z0, z1), S.zs[S.nz]);
  const key = `${R6(zb)}:${R6(zt)}`;
  if (CACHE.masks.has(key)) return CACHE.masks.get(key);

  const ks = [];
  for (let k = 0; k < S.nz; k++)
    if (S.zs[k + 1] > zb + TOL && S.zs[k] < zt - TOL) ks.push(k);

  const cells = new Uint8Array(S.nx * S.ny);
  if (ks.length) {
    for (let j = 0; j < S.ny; j++)
      for (let i = 0; i < S.nx; i++)
        cells[j * S.nx + i] = ks.every(k => S.at(i, j, k)) ? 1 : 0;
  }
  // Sider som ikke er frie: der fortsetter konstruksjonen, saa bruddflata skal
  // ikke stoppe ved grunnklossens ytterplan. Utenfor klossen paa en slik side
  // regnes betongen som hel - det er den samme forutsetninga som de gamle
  // uendelige kantene i memberLimits().
  const b = S.base, fe = m.concrete.freeEdges, BIG = 1e9;
  const ext = { x0: fe.xNeg ? b.x0 : -BIG, x1: fe.xPos ? b.x1 : BIG,
                y0: fe.yNeg ? b.y0 : -BIG, y1: fe.yPos ? b.y1 : BIG };
  const inBase = (x, y) => x > b.x0 - TOL && x < b.x1 + TOL &&
                           y > b.y0 - TOL && y < b.y1 + TOL;
  const inExt = (x, y) => x > ext.x0 && x < ext.x1 && y > ext.y0 && y < ext.y1;

  const mask = { xs: S.xs, ys: S.ys, nx: S.nx, ny: S.ny, cells, base: b, ext,
                 at: (i, j) => cells[j * S.nx + i],
                 has: (x, y) => {
                   const i = cellOf(S.xs, x), j = cellOf(S.ys, y);
                   if (i >= 0 && j >= 0 && cells[j * S.nx + i]) return true;
                   return inExt(x, y) && !inBase(x, y);
                 } };
  CACHE.masks.set(key, mask);
  return mask;
}

// ---------------------------------------------------------------------------
//  Betongoverflata under plata.
//
//  Er det skaaret en grop der plata staar, er det gropas bunn forankringene
//  gaar ned fra: h_ef maales fra den betongoverflata som faktisk finnes, ikke
//  fra et plan som er skaaret vekk. Ligger det en pute under plata, hever den
//  referansen tilsvarende.  Maalt i platesenter - det er der plata ligger an.
// ---------------------------------------------------------------------------
function surfaceZ(m) {
  const S = solid(m);
  const i = cellOf(S.xs, 0), j = cellOf(S.ys, 0);
  if (i < 0 || j < 0) return 0;
  for (let k = S.nz - 1; k >= 0; k--) if (S.at(i, j, k)) return S.zs[k + 1];
  return 0;
}

// Dybdeintervallet en forankring staar i: fra underkant fot og opp til
// betongoverflata. Det er der betongen maa vaere hel for at kjegla skal ha noe
// aa rive i.
function anchorDepth(m) {
  const z = surfaceZ(m);
  return [z - Math.abs(m.anchors.hef), z];
}

// ---------------------------------------------------------------------------
//  Areal av (union av rektangler) klippet mot maska.
//  Erstatter clippedSquares(): kanten er ikke lenger fire tall, men formen.
// ---------------------------------------------------------------------------
function maskArea(mask, rects) {
  const rs = rects.filter(r => r.x1 > r.x0 + TOL && r.y1 > r.y0 + TOL);
  if (!rs.length) return 0;
  const xs = grid(mask.xs, rs.flatMap(r => [r.x0, r.x1]));
  const ys = grid(mask.ys, rs.flatMap(r => [r.y0, r.y1]));
  let A = 0;
  for (let i = 0; i < xs.length - 1; i++) {
    const cx = (xs[i] + xs[i + 1]) / 2, dx = xs[i + 1] - xs[i];
    for (let j = 0; j < ys.length - 1; j++) {
      const cy = (ys[j] + ys[j + 1]) / 2;
      if (!mask.has(cx, cy)) continue;
      if (rs.some(r => cx > r.x0 && cx < r.x1 && cy > r.y0 && cy < r.y1))
        A += dx * (ys[j + 1] - ys[j]);
    }
  }
  return A;
}

// Maskas egne snitt pluss rektanglenes. Ingen klipping: rektangler som stikker
// utenfor rutenettet kan ligge paa en side som ikke er fri, og der teller
// betongen med (se planMask).
function grid(base, extra) {
  const s = new Set(base);
  for (const v of extra) s.add(R6(v));
  return [...s].sort((a, b) => a - b);
}

// ---------------------------------------------------------------------------
//  Betongens utstrekning tvers paa en linje.
//
//  Kantbruddflata er like brei som betongen tillater. Med en utsparing i kanten
//  er ikke det lenger «fra sidekant til sidekant», men de intervallene der det
//  faktisk staar betong i boltradens plan.
//    axis  aksen intervallene maales langs ('x' eller 'y')
//    at    posisjonen paa den andre aksen
// ---------------------------------------------------------------------------
function spansAlong(mask, axis, at) {
  const alongX = axis === 'x';
  const other = alongX ? mask.ys : mask.xs;
  const idx = cellOf(other, at);
  if (idx < 0) return [];
  const cuts = alongX ? mask.xs : mask.ys;
  const nA = (alongX ? mask.nx : mask.ny);
  const solidAt = a => alongX ? mask.at(a, idx) : mask.at(idx, a);
  const out = [];
  let run = null;
  for (let a = 0; a < nA; a++) {
    if (solidAt(a)) { if (!run) run = [cuts[a], cuts[a + 1]]; else run[1] = cuts[a + 1]; }
    else if (run) { out.push(run); run = null; }
  }
  if (run) out.push(run);
  if (!out.length) return out;
  // Sider som ikke er frie fortsetter - der stopper ikke bruddflata i
  // grunnklossens ytterplan.
  const lo = alongX ? mask.ext.x0 : mask.ext.y0;
  const hi = alongX ? mask.ext.x1 : mask.ext.y1;
  const b0 = alongX ? mask.base.x0 : mask.base.y0;
  const b1 = alongX ? mask.base.x1 : mask.base.y1;
  if (out[0][0] <= b0 + TOL) out[0][0] = Math.min(out[0][0], lo);
  const last = out[out.length - 1];
  if (last[1] >= b1 - TOL) last[1] = Math.max(last[1], hi);
  return out;
}

// Snitt av to intervallsett.
function intersectSpans(a, b) {
  const out = [];
  for (const p of a) for (const q of b) {
    const lo = Math.max(p[0], q[0]), hi = Math.min(p[1], q[1]);
    if (hi > lo + TOL) out.push([lo, hi]);
  }
  return out;
}

// ---------------------------------------------------------------------------
//  Kantavstand: gaa utover fra bolten til betongen slutter.
//
//  For den rette klossen gir dette noeyaktig de samme tallene som foer. Med et
//  snitt i kanten gir det avstanden til den virkelige kanten - en utsparing
//  foran bolten flytter kanten naermere, en konsoll flytter den lengre ut.
//
//  Sider som ikke er frie regnes uendelige: der fortsetter konstruksjonen.
// ---------------------------------------------------------------------------
function edgeDistancesAt(m, x, y, z0, z1) {
  const S = solid(m), mask = planMask(m, z0, z1), fe = m.concrete.freeEdges;
  const b = S.base;
  const i0 = cellOf(S.xs, x), j0 = cellOf(S.ys, y);
  const out = { xNeg: 0, xPos: 0, yNeg: 0, yPos: 0 };
  if (i0 < 0 || j0 < 0 || !mask.at(i0, j0)) return out;

  const walk = (dir) => {
    const alongX = dir[0] === 'x';
    const pos = dir.endsWith('Pos');
    const cuts = alongX ? S.xs : S.ys;
    const nA = alongX ? S.nx : S.ny;
    let a = alongX ? i0 : j0;
    while (a + (pos ? 1 : -1) >= 0 && a + (pos ? 1 : -1) < nA) {
      const nxt = a + (pos ? 1 : -1);
      if (!(alongX ? mask.at(nxt, j0) : mask.at(i0, nxt))) break;
      a = nxt;
    }
    const exit = pos ? cuts[a + 1] : cuts[a];
    // Naar betongen slutter i grunnformens ytterplan og sida ikke er fri,
    // fortsetter konstruksjonen: ingen kant aa rive ut mot.
    const limit = alongX ? (pos ? b.x1 : b.x0) : (pos ? b.y1 : b.y0);
    if (!fe[dir] && (pos ? exit >= limit - TOL : exit <= limit + TOL)) return Infinity;
    return pos ? exit - (alongX ? x : y) : (alongX ? x : y) - exit;
  };
  for (const dir of ['xNeg', 'xPos', 'yNeg', 'yPos']) out[dir] = walk(dir);
  return out;
}

// ---------------------------------------------------------------------------
//  Lokal tykkelse i en soeyle: den sammenhengende betongen som omslutter
//  dybden zRef. En utsparing i overflata gjoer betongen tynnere akkurat der,
//  og det er den tykkelsen psi_h og utstoetingsformlene skal ha.
// ---------------------------------------------------------------------------
function thicknessAt(m, x, y, zRef) {
  const S = solid(m);
  const i = cellOf(S.xs, x), j = cellOf(S.ys, y);
  if (i < 0 || j < 0) return 0;
  const k0 = cellOf(S.zs, zRef ?? -m.concrete.h / 2);
  if (k0 < 0 || !S.at(i, j, k0)) return 0;
  let lo = k0, hi = k0;
  while (lo - 1 >= 0 && S.at(i, j, lo - 1)) lo--;
  while (hi + 1 < S.nz && S.at(i, j, hi + 1)) hi++;
  return S.zs[hi + 1] - S.zs[lo];
}

// Minste lokale tykkelse under et sett punkter - den som styrer.
function minThickness(m, pts) {
  const zRef = surfaceZ(m) - Math.min(Math.abs(m.anchors.hef), m.concrete.h) / 2;
  let t = Infinity;
  for (const p of pts) t = Math.min(t, thicknessAt(m, p.x, p.y, zRef));
  return Number.isFinite(t) && t > 0 ? t : m.concrete.h;
}

// Har betongdelen andre former enn grunnklossen?
const isShaped = m => features(m).some(f => featureBox(m, f));

// ---------------------------------------------------------------------------
//  Legemet som faa kasser - til 3D-visninga.
//  Cellene slaas sammen graadig i x, saa y, saa z, saa en enkel form fortsatt
//  blir én kasse og en trappeform blir noen faa.
// ---------------------------------------------------------------------------
function solidBoxes(m) {
  const S = solid(m);
  const used = new Uint8Array(S.occ.length);
  const at = (i, j, k) => S.at(i, j, k) && !used[(k * S.ny + j) * S.nx + i];
  const out = [];
  for (let k = 0; k < S.nz; k++)
    for (let j = 0; j < S.ny; j++)
      for (let i = 0; i < S.nx; i++) {
        if (!at(i, j, k)) continue;
        let i1 = i;
        while (i1 + 1 < S.nx && at(i1 + 1, j, k)) i1++;
        let j1 = j;
        while (j1 + 1 < S.ny && rowFree(i, i1, j1 + 1, k, k, at)) j1++;
        let k1 = k;
        while (k1 + 1 < S.nz && slabFree(i, i1, j, j1, k1 + 1, at)) k1++;
        for (let kk = k; kk <= k1; kk++)
          for (let jj = j; jj <= j1; jj++)
            for (let ii = i; ii <= i1; ii++)
              used[(kk * S.ny + jj) * S.nx + ii] = 1;
        out.push({ x0: S.xs[i], x1: S.xs[i1 + 1], y0: S.ys[j], y1: S.ys[j1 + 1],
                   z0: S.zs[k], z1: S.zs[k1 + 1] });
      }
  return out;
}

function rowFree(i0, i1, j, k0, k1, at) {
  for (let k = k0; k <= k1; k++) for (let i = i0; i <= i1; i++) if (!at(i, j, k)) return false;
  return true;
}
function slabFree(i0, i1, j0, j1, k, at) {
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) if (!at(i, j, k)) return false;
  return true;
}

// ---------------------------------------------------------------------------
//  De ekte kantene paa legemet.
//
//  Rutenettet er full av soemmer som ikke er kanter. En strek tegnes bare naar
//  flatene som moetes i den ligger i ULIKE plan - da er det et hjoerne. To
//  flater i samme plan deler bare en soem inne i en jevn flate.
// ---------------------------------------------------------------------------
function boundaryEdges(m) {
  const S = solid(m);
  const segs = new Map();
  const add = (p, q, plane) => {
    const key = [p, q].map(v => v.map(t => R6(t)).join(',')).sort().join('|');
    let e = segs.get(key);
    if (!e) segs.set(key, e = { p, q, planes: new Set() });
    e.planes.add(plane);
  };
  const solidAt = (i, j, k) =>
    i >= 0 && j >= 0 && k >= 0 && i < S.nx && j < S.ny && k < S.nz && S.at(i, j, k);

  for (let k = 0; k < S.nz; k++)
    for (let j = 0; j < S.ny; j++)
      for (let i = 0; i < S.nx; i++) {
        if (!S.at(i, j, k)) continue;
        const x0 = S.xs[i], x1 = S.xs[i + 1];
        const y0 = S.ys[j], y1 = S.ys[j + 1];
        const z0 = S.zs[k], z1 = S.zs[k + 1];
        // x-flatene
        for (const [di, X] of [[-1, x0], [1, x1]])
          if (!solidAt(i + di, j, k)) {
            const pl = `x${R6(X)}`;
            add([X, y0, z0], [X, y1, z0], pl); add([X, y0, z1], [X, y1, z1], pl);
            add([X, y0, z0], [X, y0, z1], pl); add([X, y1, z0], [X, y1, z1], pl);
          }
        for (const [dj, Y] of [[-1, y0], [1, y1]])
          if (!solidAt(i, j + dj, k)) {
            const pl = `y${R6(Y)}`;
            add([x0, Y, z0], [x1, Y, z0], pl); add([x0, Y, z1], [x1, Y, z1], pl);
            add([x0, Y, z0], [x0, Y, z1], pl); add([x1, Y, z0], [x1, Y, z1], pl);
          }
        for (const [dk, Z] of [[-1, z0], [1, z1]])
          if (!solidAt(i, j, k + dk)) {
            const pl = `z${R6(Z)}`;
            add([x0, y0, Z], [x1, y0, Z], pl); add([x0, y1, Z], [x1, y1, Z], pl);
            add([x0, y0, Z], [x0, y1, Z], pl); add([x1, y0, Z], [x1, y1, Z], pl);
          }
      }

  const out = [];
  for (const e of segs.values()) if (e.planes.size > 1) out.push([e.p, e.q]);
  return out;
}

// ===== src/engine/geometry.js ======================================
// Areal av unionen av akseparallelle rektangler, via koordinatkompresjon.
// rects: [{x0,x1,y0,y1}]  -> areal (mm2).  Brukes til A_c,N og A_c,V.
function unionRectArea(rects) {
  const rs = rects.filter(r => r.x1 > r.x0 && r.y1 > r.y0);
  if (!rs.length) return 0;
  const xs = [...new Set(rs.flatMap(r => [r.x0, r.x1]))].sort((a, b) => a - b);
  const ys = [...new Set(rs.flatMap(r => [r.y0, r.y1]))].sort((a, b) => a - b);
  let A = 0;
  for (let i = 0; i < xs.length - 1; i++) {
    for (let j = 0; j < ys.length - 1; j++) {
      const cx = (xs[i] + xs[i + 1]) / 2, cy = (ys[j] + ys[j + 1]) / 2;
      if (rs.some(r => cx > r.x0 && cx < r.x1 && cy > r.y0 && cy < r.y1))
        A += (xs[i + 1] - xs[i]) * (ys[j + 1] - ys[j]);
    }
  }
  return A;
}

// Union av 1D-intervaller -> samlet lengde
function unionLength(ivs) {
  const s = ivs.filter(i => i[1] > i[0]).sort((a, b) => a[0] - b[0]);
  let L = 0, cur = null;
  for (const i of s) {
    if (!cur || i[0] > cur[1]) { if (cur) L += cur[1] - cur[0]; cur = [...i]; }
    else cur[1] = Math.max(cur[1], i[1]);
  }
  if (cur) L += cur[1] - cur[0];
  return L;
}

// Prosjektert areal av kvadratene (punkt +/- r), klippet mot betongen slik den
// faktisk staar. Brukes til A_c,N i baade EN 1992-4 og B19.
//
// Kantene er ikke lenger fire tall: er det skaaret en utsparing eller lagt paa
// en konsoll, er det den formen kjegla maa rives ut av. Maska teller bare
// soeyler som har hel betong gjennom hele forankringsdybden - en kjegle som
// paa veien opp passerer et hull har ingenting aa rive ut der.
function clippedSquares(m, pts, r) {
  const [z0, z1] = anchorDepth(m);
  return maskArea(planMask(m, z0, z1), pts.map(p => ({
    x0: p.x - r, x1: p.x + r, y0: p.y - r, y1: p.y + r,
  })));
}

// Prosjektert bruddareal for strekkbrudd.
//
// Henger boltene i en felles endeplate, er forankringen ett stivt legeme:
// kjegla sprer seg fra platekanten, ikke fra hver bolt for seg. Uten slik
// plate er arealet unionen av de enkelte boltenes kjegler.
function coneProjection(m, foot, pts, r) {
  if (foot && foot.common) {
    const pl = foot.plate;
    const [z0, z1] = anchorDepth(m);
    return maskArea(planMask(m, z0, z1), [{
      x0: pl.x0 - r, x1: pl.x1 + r, y0: pl.y0 - r, y1: pl.y1 + r,
    }]);
  }
  return clippedSquares(m, pts, r);
}

// Bredden av kantbruddflata langs kanten.
//
// Bruddflata sprer seg 1,5*c_1 til hver side av boltene i fremste rekke, men
// bare saa langt det staar betong. Klippet skjer i boltradens eget plan: det er
// der bruddlegemet starter, og det er formen der som avgjoer hvor bredt det kan
// bli. En utsparing i kanten kutter bredden; en konsoll gir mer.
//
//   axis   aksen bredden maales langs ('x' eller 'y')
//   at     boltradens posisjon paa den andre aksen
//   spans  [[t0, t1], ...] de uklippede 1,5*c_1-feltene
function frontWidth(m, axis, at, spans) {
  const [z0, z1] = anchorDepth(m);
  const solidSpans = spansAlong(planMask(m, z0, z1), axis, at);
  if (!solidSpans.length) return 0;
  return unionLength(intersectSpans(spans, solidSpans));
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// ===== src/core/model.js ===========================================
// ---------------------------------------------------------------------------
//  Datamodell for forbindelsen.
//  Enheter overalt:  lengde = mm,  kraft = N,  moment = Nmm,  spenning = MPa.
//  Fortegn:  +N = strekk (plata trekkes av betongen),  z = ut av betongen.
// ---------------------------------------------------------------------------

// fckCube = terningfasthet f_ck,cube, fctk = f_ctk,0,05.  Begge etter
// NS-EN 1992-1-1 tab. 3.1 (parene C20/25 ... C55/67).  B65-B85 har ingen
// standardpar; der er terningfastheten satt til f_ck + 15 og f_ctk,0,05
// regnet av 0,7 * 2,12 * ln(1 + f_cm/10) som for fasthetsklasser over C50.
// Betongelementboka B19 bruker f_ck,cube i kjegle- og kantbruddformlene, og
// f_ctk,0,05 i heftformlene.  Boka dekker selv bare B25-B55.
const CONCRETE_GRADES = [
  { id: 'B20', fck: 20, fckCube: 25,  fctk: 1.5 },
  { id: 'B25', fck: 25, fckCube: 30,  fctk: 1.8 },
  { id: 'B30', fck: 30, fckCube: 37,  fctk: 2.0 },
  { id: 'B35', fck: 35, fckCube: 45,  fctk: 2.2 },
  { id: 'B45', fck: 45, fckCube: 55,  fctk: 2.7 },
  { id: 'B55', fck: 55, fckCube: 67,  fctk: 3.0 },
  { id: 'B65', fck: 65, fckCube: 80,  fctk: 3.1 },
  { id: 'B75', fck: 75, fckCube: 90,  fctk: 3.3 },
  { id: 'B85', fck: 85, fckCube: 100, fctk: 3.5 },
];

const grade = id => CONCRETE_GRADES.find(g => g.id === id) || CONCRETE_GRADES[3];

// Ecm etter NS-EN 1992-1-1 tab. 3.1 (normalvekt betong)
function Ecm(fck) { return 22000 * Math.pow((fck + 8) / 10, 0.3); }

// kind styrer hvilke formler som gjelder i Betongelementboka B19 pkt. 19.5:
//   'stud'/'struct'  konstruksjonsstål   N_Rd,s = f_sd0 * A_s,  V_Rd,s = f_sd0 * A_s / √3
//   'rebar'          kamstål B500NC      f_yd = f_yk / 1,15
//   'bolt'           skrue/gjengestang   N_Rd,s = f_sd2 * A_sp,  V_Rd,s = k_v * f_sd2 * A_sp
// kv = 0,6 for K4.6, K5.6 og K8.8;  0,5 for K4.8, K5.8, K6.8 og K10.9 (19.5).
// nEdge = kantavstanden n * ⌀ som gir øvre grense for dybelskjær, tab. B 19.4.2.
//
// `bars` er hvilke stangtyper kvaliteten hører til. Stålkvalitet og stangtype
// er ikke to frie valg: en sveisebolt leveres i sveiseboltstål, kamstål i
// B500NC og gjengestang i skruekvalitetene. Lista filtreres derfor på
// stangtypen (se steelsFor), så kombinasjoner som ikke finnes ikke kan velges.
const STUD_STEELS = [
  { id: 'SD1 (S235J2+C450)', label: 'SD1 (S235J2+C450) – sveisebolt',
    fyk: 350, fuk: 450, ductile: true,  kind: 'stud',   kv: 0.6, nEdge: 12,
    bars: ['stud'] },
  { id: 'S235J2',            label: 'S235J2 – konstruksjonsstål',
    fyk: 235, fuk: 360, ductile: true,  kind: 'struct', kv: 0.6, nEdge: 10,
    bars: ['stud'] },
  { id: 'S355J2',            label: 'S355J2 – konstruksjonsstål',
    fyk: 355, fuk: 490, ductile: true,  kind: 'struct', kv: 0.6, nEdge: 12,
    bars: ['stud'] },
  { id: 'B500NC (kamstål)',  label: 'B500NC – kamstål',
    fyk: 500, fuk: 550, ductile: true,  kind: 'rebar',  kv: 0.6, nEdge: 14,
    bars: ['rebar'] },
  { id: 'K4.6',              label: 'K4.6',
    fyk: 240, fuk: 400, ductile: true,  kind: 'bolt',   kv: 0.6, nEdge: 11,
    bars: ['rod'] },
  { id: 'K4.8',              label: 'K4.8',
    fyk: 320, fuk: 400, ductile: true,  kind: 'bolt',   kv: 0.5, nEdge: 11,
    bars: ['rod'] },
  { id: 'K5.6',              label: 'K5.6',
    fyk: 300, fuk: 500, ductile: true,  kind: 'bolt',   kv: 0.6, nEdge: 11,
    bars: ['rod'] },
  { id: '8.8',               label: 'K8.8',
    fyk: 640, fuk: 800, ductile: true,  kind: 'bolt',   kv: 0.6, nEdge: 16,
    bars: ['rod'] },
  { id: '10.9',              label: 'K10.9',
    fyk: 900, fuk: 1000, ductile: false, kind: 'bolt',  kv: 0.5, nEdge: 16,
    bars: ['rod'] },

const steelGrade = id => STUD_STEELS.find(s => s.id === id) || STUD_STEELS[0];

// Kvalitetene som hører til en stangtype, og standardvalget blant dem.
const steelsFor = bar => STUD_STEELS.filter(s => s.bars.includes(bar));
const defaultSteel = bar => steelsFor(bar)[0].id;

// ---------------------------------------------------------------------------
//  Hvilke forankringsender som finnes for hver stangtype.
//
//   stud   sveisebolt: hodet er påsmidd i fabrikken og er ikke et valg.
//   rebar  kamstål: heft langs kammene. Kamstål er ikke gjenget, så en
//          endemutter må sveises på - eller enden bøyes til en krok.
//          Ingen felles endeplate: kamstål gjenges ikke opp for platefeste.
//   rod    gjengestang/bolt: gjengene tar mutter, felles endeplate eller
//          ingenting (ren heftforankring langs gjengene).
//
//  Skrue og gjengestang er samme sak her: gjenget skaft, spenningsareal A_sp
//  og skruekvalitetene K4.6-K10.9. De er derfor én type, ikke to.
// ---------------------------------------------------------------------------
const END_TYPES = {
  stud:  ['nut'],
  rebar: ['nut', 'hook', 'none'],
  rod:   ['nut', 'plate', 'none'],
};
const endsFor = bar => END_TYPES[bar] || END_TYPES.rod;

// Hodebolt-geometri, ca. EN ISO 13918 type SD.  dh = hodediameter, k = hodetykkelse.
const STUD_SIZES = [
  { d: 10, dh: 19, k: 7 },  { d: 12, dh: 22, k: 7 },
  { d: 16, dh: 32, k: 8 },  { d: 19, dh: 32, k: 10 },
  { d: 22, dh: 35, k: 10 }, { d: 25, dh: 41, k: 12 },
];

function studSize(d) {
  return STUD_SIZES.find(s => s.d === d) || { d, dh: 2 * d, k: 0.5 * d };
}

// Kamstål B500NC - vanlige dimensjoner.
const REBAR_SIZES = [8, 10, 12, 16, 20, 25, 32];

// Gjengestang.  Asp = spenningsareal, dekv = ekvivalent diameter (til W_p),
// NV = nøkkelvidde på sekskantmutteren som brukes som endemutter,
// P = gjengestigning, grov metrisk gjenge etter ISO 261 (brukes i 3D).
// De øvrige tallene er tab. B 19.7.1 i Betongelementboka bind B kap. B19.
const ROD_SIZES = [
  { d: 10, Asp: 58,   dekv: 8.6,  NV: 17, P: 1.5 },
  { d: 12, Asp: 84,   dekv: 10.4, NV: 19, P: 1.75 },
  { d: 16, Asp: 157,  dekv: 14.1, NV: 24, P: 2.0 },
  { d: 20, Asp: 245,  dekv: 17.7, NV: 30, P: 2.5 },
  { d: 24, Asp: 353,  dekv: 21.2, NV: 36, P: 3.0 },
  { d: 30, Asp: 561,  dekv: 26.7, NV: 46, P: 3.5 },
  { d: 33, Asp: 694,  dekv: 29.7, NV: 50, P: 3.5 },
  { d: 36, Asp: 817,  dekv: 32.2, NV: 55, P: 4.0 },
  { d: 39, Asp: 976,  dekv: 35.3, NV: 60, P: 4.0 },
  { d: 42, Asp: 1121, dekv: 37.8, NV: 65, P: 4.5 },
];

function rodSize(d) {
  return ROD_SIZES.find(s => s.d === d) ||
         { d, Asp: 0.78 * shaftArea(d), dekv: 0.9 * d, NV: 1.6 * d, P: 0.12 * d };
}

function shaftArea(d) { return Math.PI * d * d / 4; }

// Lastopptakende areal under hodet
function headArea(d, dh) { return Math.PI * (dh * dh - d * d) / 4; }

// ---------------------------------------------------------------------------
//  Stanga: hvilket tverrsnitt som gjelder, og hvilke stålformler som brukes.
//
//  barType  'stud'   sveist hodebolt / sveisebolt - glatt skaft, ingen heft
//           'rebar'  kamstål B500NC                - heft langs hele stanga
//           'rod'    gjengestang                   - heft langs hele stanga,
//                                                    gjenget tverrsnitt (A_sp)
//
//  En bolt er sjelden gjenget i hele lengda: skaftet er glatt fra hodet og
//  gjengene begynner et stykke nede. Det glatte skaftet har ikke kammer eller
//  gjenger, så det utvikler ingen heft - heftforankringen er bare den gjengede
//  delen. Til gjengjeld er det glatte skaftet grovere enn gjengene, og det er
//  nettopp der skjærsnittet ligger (ved betongoverflata). Derfor skilles det
//  mellom strekksnittet og skjærsnittet:
//
//  d     nominell diameter (⌀_nom) - den som brukes i dybelformlene
//  dEff  ekvivalent diameter til W_p (gjengestang: ⌀_ekv, ellers ⌀_nom)
//  As    tverrsnitt som tar STREKK - brudd skjer i gjengene, altså A_sp
//  Av    tverrsnitt som tar SKJÆR ved betongoverflata - πd²/4 når det glatte
//        skaftet står der, ellers det samme som As
//  Wp    plastisk motstandsmoment ⌀_ekv³ / 6  (B19 pkt. 19.5)
//  WpV   det samme for skjærsnittet (dybelbøyning ved overflata)
//  smooth  lengden av det glatte skaftet, målt ned fra betongoverflata
//  lBond   lengden som faktisk utvikler heft
//  bond  om stanga har heftforankring langs skaftet
// ---------------------------------------------------------------------------
function shaftProps(m) {
  const a = m.anchors;
  const gross = shaftArea(a.d);
  // Glatt skaft finnes bare på gjengestang/bolt: kamstålet har kammer hele
  // veien, og sveisebolten er glatt hele veien uten heft uansett.
  const smooth = a.barType === 'rod'
    ? Math.max(0, Math.min(a.lSmooth || 0, a.hef)) : 0;

  if (a.barType === 'rod') {
    const r = rodSize(a.d);
    // Står det glatte skaftet i betongoverflata, går skjæret gjennom det
    // grovere tverrsnittet i stedet for gjennom gjengene.
    const threadedAtSurface = smooth <= 0;
    const dV = threadedAtSurface ? r.dekv : a.d;
    return { d: a.d, dEff: r.dekv, As: r.Asp, Wp: Math.pow(r.dekv, 3) / 6,
             Av: threadedAtSurface ? r.Asp : gross, dV,
             WpV: Math.pow(dV, 3) / 6,
             bond: true, threaded: true, NV: r.NV, P: r.P,
             smooth, lBond: Math.max(0, a.hef - smooth) };
  }
  return { d: a.d, dEff: a.d, As: gross, Wp: Math.pow(a.d, 3) / 6,
           Av: gross, dV: a.d, WpV: Math.pow(a.d, 3) / 6,
           bond: a.barType === 'rebar', threaded: false,
           smooth: 0, lBond: a.barType === 'rebar' ? a.hef : 0 };
}

// ---------------------------------------------------------------------------
//  Felles endeplate i innstøpingsenden.
//
//  Én gjennomgående plate som knytter hele boltegruppa sammen nede i betongen,
//  ikke en liten skive pr. bolt. Plata følger boltemønsteret med et utstikk
//  u_p utenfor de ytterste boltene, så den aldri kan bli mindre enn mønsteret
//  den skal knytte sammen - utstikket er inndata, ikke sidekanten.
//
//  Returnerer null når enden ikke er en plate.
// ---------------------------------------------------------------------------
function endPlate(m) {
  const a = m.anchors;
  if (a.endType !== 'plate') return null;
  const pts = anchorPositions(m);
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs) - a.up, x1 = Math.max(...xs) + a.up;
  const y0 = Math.min(...ys) - a.up, y1 = Math.max(...ys) + a.up;
  return { x0, x1, y0, y1, bx: x1 - x0, by: y1 - y0, t: a.tp };
}

// ---------------------------------------------------------------------------
//  Forankringsenden.
//
//   'nut'    endemutter - rund og påsmidd for sveisebolt (bolthode), ellers
//            sekskantet og påskrudd (gjengestang) eller påsveist (kamstål,
//            som ikke er gjenget). ⌀_h er hodediameter eller nøkkelvidde.
//   'plate'  felles innstøpt endeplate over hele gruppa (se endPlate).
//            Plata må være stiv for å regnes med: utstikket u kan ikke være
//            større enn tykkelsen, så bare et felt ⌀ + 2·t_p rundt hver bolt
//            teller som trykkflate (B19 fig. B 19.18 og B 19.57). Ligger
//            boltene tett, flyter feltene sammen til ett - unionen telles
//            derfor én gang, og deles på antall bolter siden lasta deles likt.
//   'hook'   bøyd endekrok på kamstål. Ingen trykkflate å regne kjeglebrudd
//            fra - kroken regnes derfor konservativt som ren heftforankring,
//            samme formel som 'none' (B19 pkt. 19.3.3 dekker ikke kroker
//            eksplisitt, så det tas ikke kreditt for kroken utover heften).
//   'none'   uten endemutter - forankringen er ren heftforankring langs
//            kamstålet eller gjengestanga (B19 pkt. 19.3.3 og 19.3.4).
//
//  Ah = netto trykkareal mot betongen, A_fot − π/4·⌀²  (B19 fig. B 19.16).
// ---------------------------------------------------------------------------
function anchorFoot(m) {
  const a = m.anchors, sh = shaftProps(m);
  const core = Math.PI * sh.d * sh.d / 4;
  if (a.endType === 'none')
    return { kind: 'none', hasFoot: false, Ah: 0, t: 0, shape: 'none' };
  if (a.endType === 'hook')
    return { kind: 'hook', hasFoot: false, Ah: 0, t: 0, shape: 'hook' };

  if (a.endType === 'plate') {
    const pl = endPlate(m);
    const pts = anchorPositions(m);
    const r = sh.d / 2 + a.tp;                      // medvirkende halvbredde, u ≤ t_p
    const Aeff = unionRectArea(pts.map(p => ({
      x0: Math.max(p.x - r, pl.x0), x1: Math.min(p.x + r, pl.x1),
      y0: Math.max(p.y - r, pl.y0), y1: Math.min(p.y + r, pl.y1),
    })));
    const per = Aeff / pts.length;                  // trykkflate pr. bolt
    return { kind: 'plate', hasFoot: true, shape: 'square', common: true,
             plate: pl, size: Math.min(pl.bx, pl.by), eff: 2 * r, t: a.tp,
             limited: Aeff < pl.bx * pl.by,
             Agross: per, Aeff, Ah: Math.max(0, per - core) };
  }
  if (a.barType === 'rod' || a.barType === 'rebar') {  // sekskantet endemutter
    const A = 0.866 * a.dh * a.dh;                  // NV over nøkkelvidde
    return { kind: 'nut', hasFoot: true, shape: 'hex', size: a.dh, eff: a.dh,
             t: a.k, limited: false, Agross: A, Aeff: A, Ah: A - core };
  }
  const A = Math.PI * a.dh * a.dh / 4;              // rundt bolthode
  return { kind: 'head', hasFoot: true, shape: 'round', size: a.dh, eff: a.dh,
           t: a.k, limited: false, Agross: A, Aeff: A, Ah: A - core };
}

// Hvordan plata står an mot betongen.
//
//   direct    plata ligger rett på betongen - ingen momentarm i boltene
//   grout     undergyting; med tilstrekkelig fast masse regnes det som
//             direkte anlegg, ellers som fri avstand (NS-EN 1992-4 6.2.2.3)
//   standoff  plata står av fra betongen - ingen kontaktflate, og skjæret
//             virker med momentarm
//
// offset  = høyden fra betongoverflata opp til platas underside
// contact = om det finnes en trykkflate under plata
function mounting(m) {
  const p = m.plate;
  // Uten stålplate står boltene fritt opp av betongen. Da finnes ingen
  // trykkflate, og skjæret virker med utkraginga e som momentarm - det er
  // dybeltilfellet i Betongelementboka B19 pkt. 19.4.2.
  if (!p.present)
    return { kind: 'noplate', offset: 0, contact: false, leverArm: Math.max(0, p.e) };
  if (p.mount === 'standoff')
    return { kind: 'standoff', offset: p.gap, contact: false,
             leverArm: p.gap + p.t / 2 };
  if (p.mount === 'grout') {
    // Gytemassen må være minst like fast som betongen, og minst C30.
    const ok = p.fckGrout >= 30 && p.fckGrout >= m.concrete.fck;
    return { kind: 'grout', offset: p.tGrout, contact: true, groutOk: ok,
             leverArm: ok ? 0 : p.tGrout + p.t / 2 };
  }
  return { kind: 'direct', offset: 0, contact: true, leverArm: 0 };
}

const LIMIT_STATES = [
  ['uls', 'Bruddgrense'],
  ['sls', 'Bruksgrense'],
];

function combo(id, name, limit, v = {}) {
  return { id, name, limit,
           N: 0, Vx: 0, Vy: 0, Mx: 0, My: 0, Mz: 0, ...v };
}

// Lar `load` peke på den aktive kombinasjonen. Da skriver alt som redigerer
// load - skjema, målpåskrifter i 3D - rett inn i kombinasjonen.
function syncLoad(m) {
  if (!m.combos.length) m.combos.push(combo('1', 'ULS 1', 'uls'));
  let c = m.combos.find(x => x.id === m.activeCombo);
  if (!c) { c = m.combos[0]; m.activeCombo = c.id; }
  m.load = c;
  return c;
}

function nextComboId(m) {
  return String(Math.max(0, ...m.combos.map(c => +c.id || 0)) + 1);
}

// Senteravstand som holder boltene innenfor plata med jevn deling og en
// kantavstand i [EDGE_MIN, EDGE_MAX]. Verdien rundes til hele 5 mm og klemmes
// deretter inn i det intervallet kantavstanden tillater.
const EDGE_MIN = 30, EDGE_MAX = 50, EDGE_AIM = 40;

function autoSpacing(b, n) {
  if (n < 2) return 0;
  const forEdge = e => (b - 2 * e) / (n - 1);
  const sMin = forEdge(EDGE_MAX);          // stor kantavstand -> liten c/c
  const sMax = forEdge(EDGE_MIN);
  let s = Math.round(forEdge(EDGE_AIM) / 5) * 5;
  s = Math.min(Math.max(s, Math.ceil(sMin / 5) * 5), Math.floor(sMax / 5) * 5);
  return Math.max(5, s);
}

// Ligger boltene utenfor plata slik den står nå?
function boltsOutside(m) {
  const p = m.plate, a = m.anchors;
  if (!p.present) return false;
  return (a.nx - 1) * a.sx > p.bx - 2 * EDGE_MIN ||
         (a.ny - 1) * a.sy > p.by - 2 * EDGE_MIN;
}

// Boltposisjoner i platas lokale system (0,0 = platesenter)
function anchorPositions(m) {
  const { nx, ny, sx, sy } = m.anchors;
  const out = [];
  const x0 = -(nx - 1) * sx / 2;
  const y0 = -(ny - 1) * sy / 2;
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      out.push({ id: out.length + 1, x: x0 + i * sx, y: y0 + j * sy });
    }
  }
  return out;
}

// Kantavstander fra et punkt (x,y) i platas system til betongdelens frie
// kanter. Avstanden maales i betongen slik den faktisk staar: er det lagt inn
// en utsparing eller en konsoll i kanten, er det den nye kanten som gjelder.
// For den rene klossen gir dette de samme tallene som L/2 +/- e.
// Ikke-frie sider returneres som Infinity - der fortsetter konstruksjonen.
function edgeDistances(m, x, y) {
  const [z0, z1] = anchorDepth(m);
  return edgeDistancesAt(m, x, y, z0, z1);
}

// Grunnklossens ytterkanter i platas system. Ikke-frie sider regnes uendelige.
// Brukes der det er selve klossen som er referansen (endeplata, maalsettinga).
// Bruddarealene klippes mot den virkelige formen, ikke mot dette - se
// coneProjection() og solid.js.
function memberLimits(m) {
  const c = m.concrete, big = 1e9, b = baseBox(m);
  return {
    x0: c.freeEdges.xNeg ? b.x0 : -big,
    x1: c.freeEdges.xPos ? b.x1 : big,
    y0: c.freeEdges.yNeg ? b.y0 : -big,
    y1: c.freeEdges.yPos ? b.y1 : big,
  };
}

// Tykkelsen som gjelder under boltene. Uten former er det h; med en utsparing
// i over- eller underflata er betongen tynnere akkurat der, og det er den
// lokale tykkelsen bruddformlene skal ha.
function memberThickness(m, pts) {
  return minThickness(m, pts && pts.length ? pts : anchorPositions(m));
}

function minEdgeDistance(m, positions) {
  let cmin = Infinity;
  for (const p of positions) {
    const e = edgeDistances(m, p.x, p.y);
    cmin = Math.min(cmin, e.xNeg, e.xPos, e.yNeg, e.yPos);
  }
  return cmin;
}

// ===== src/engine/plate-solver.js ==================================
// ---------------------------------------------------------------------------
//  Kraftfordeling i boltegruppa.
//
//  Modell:  stiv stålplate (rigid baseplate), som i EN 1992-4 pkt. 6.2.
//    * boltene er strekkfjærer  (tar ikke trykk - trykket går via kontakt)
//    * betongen under plata er en trykk-kun kontaktflate, diskretisert i celler
//    * 3 frihetsgrader:  w (translasjon z), thx (rotasjon om x), thy (om y)
//
//  Likevekt loeses med Newton-Raphson. Fjaerkarakteristikken er stykkevis
//  lineaer, saa loesningen konvergerer typisk paa 5-15 iterasjoner.
//
//  Er plata avstivet fra betongen (standoff > 0) finnes ingen kontaktflate,
//  og boltene tar baade strekk og trykk.
// ---------------------------------------------------------------------------

const Es = 210000; // MPa

function solvePlate(m) {
  const pos = anchorPositions(m);
  const As = shaftArea(m.anchors.d);
  const ka = Es * As / Math.max(m.anchors.hef, 1);     // N/mm pr. bolt
  const mnt = mounting(m);
  const contact = mnt.contact;

  // Kontaktceller
  const cells = [];
  if (contact) {
    const n = Math.max(6, m.solver.nGrid | 0);
    const dx = m.plate.bx / n, dy = m.plate.by / n, A = dx * dy;
    const kcArea = Ecm(m.concrete.fck) /
                   Math.max(m.anchors.hef * m.solver.bearingDepthFactor, 1); // N/mm pr. mm2
    for (let j = 0; j < n; j++) {
      for (let i = 0; i < n; i++) {
        cells.push({
          x: -m.plate.bx / 2 + (i + 0.5) * dx,
          y: -m.plate.by / 2 + (j + 0.5) * dy,
          k: kcArea * A, A,
        });
      }
    }
  }

  const L = m.load;
  const target = [L.N, L.Mx, L.My];

  // u = [w, thx, thy];  forskyvning i z for punkt (x,y):  d = w + thx*y - thy*x
  const EPS = 1e-3;
  let u = [0, 0, 0];

  const state = (u) => {
    const [w, thx, thy] = u;
    const R = [0, 0, 0];
    const K = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    const aF = [], cF = [];

    const add = (x, y, k, F) => {
      // Fz = F, bidrag til R og tangentstivhet
      const g = [1, y, -x];                 // dFz/du-retning  og momentarmer
      R[0] += F; R[1] += y * F; R[2] += -x * F;
      for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) K[a][b] += g[a] * k * g[b];
    };

    // Inaktive fjaerer beholder en liten restsstivhet (EPS) slik at tangent-
    // matrisa aldri blir singulaer naar kontaktflaten skifter.
    for (const p of pos) {
      const d = w + thx * p.y - thy * p.x;
      let F = 0, k = ka * EPS;
      if (!contact) { F = ka * d; k = ka; }                      // avstivet: begge veier
      else if (d > 0) { F = ka * d; k = ka; }                    // strekk-kun
      aF.push({ ...p, delta: d, N: F });
      add(p.x, p.y, k, F);
    }
    for (const c of cells) {
      const d = w + thx * c.y - thy * c.x;
      let F = 0, k = c.k * EPS;
      if (d < 0) { F = c.k * d; k = c.k; }                       // trykk-kun (F < 0)
      cF.push({ ...c, delta: d, F });
      add(c.x, c.y, k, F);
    }
    return { R, K, aF, cF };
  };

  // Startgjett: lineaer loesning der alle fjaerer er aktive begge veier.
  {
    const K = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    const addK = (x, y, k) => {
      const g = [1, y, -x];
      for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) K[a][b] += g[a] * k * g[b];
    };
    for (const p of pos) addK(p.x, p.y, ka);
    for (const c of cells) addK(c.x, c.y, c.k);
    const u0 = solve3reg(K, target);
    if (u0) u = u0;
  }

  let s = state(u), iter = 0, converged = false;
  const scale = Math.max(1, Math.abs(L.N), Math.abs(L.Mx) / 100, Math.abs(L.My) / 100);

  for (; iter < 200; iter++) {
    const res = [s.R[0] - target[0], s.R[1] - target[1], s.R[2] - target[2]];
    const norm = Math.max(Math.abs(res[0]), Math.abs(res[1]) / 100, Math.abs(res[2]) / 100);
    if (norm < 1e-6 * scale) { converged = true; break; }
    const du = solve3reg(s.K, res.map(v => -v));
    if (!du) break;
    // dempet Newton for robusthet naar kontaktflaten endrer seg
    const relax = iter < 3 ? 1.0 : 0.9;
    u = [u[0] + relax * du[0], u[1] + relax * du[1], u[2] + relax * du[2]];
    s = state(u);
  }

  // --- Skjaerfordeling ----------------------------------------------------
  // EN 1992-4 6.2.2: er hullklaringen fylt / bolten sveist, tar alle boltene
  // skjaer. Torsjon Mz fordeles med polart treghetsmoment om boltegruppas tp.
  const nA = pos.length;
  const cx = pos.reduce((a, p) => a + p.x, 0) / nA;
  const cy = pos.reduce((a, p) => a + p.y, 0) / nA;
  const Ip = pos.reduce((a, p) => a + (p.x - cx) ** 2 + (p.y - cy) ** 2, 0);
  const nShear = m.code.holeClearanceFilled ? nA : Math.max(1, Math.ceil(nA / 2));

  const anchors = s.aF.map((a, i) => {
    let vx = L.Vx / nShear, vy = L.Vy / nShear;
    if (Ip > 0 && L.Mz) { vx += -L.Mz * (a.y - cy) / Ip; vy += L.Mz * (a.x - cx) / Ip; }
    return {
      id: a.id, x: a.x, y: a.y,
      N: Math.max(0, a.N),            // strekk (negativ = trykk tas av betong)
      Ncomp: Math.min(0, a.N),
      Vx: vx, Vy: vy, V: Math.hypot(vx, vy),
      delta: a.delta,
    };
  });

  // --- Trykkresultant og kontakttrykk ------------------------------------
  let C = 0, Cx = 0, Cy = 0, sigMax = 0, Acontact = 0;
  for (const c of s.cF) {
    if (c.F < 0) {
      const f = -c.F;
      C += f; Cx += f * c.x; Cy += f * c.y; Acontact += c.A;
      sigMax = Math.max(sigMax, f / c.A);
    }
  }
  const compression = C > 1e-9
    ? { C, x: Cx / C, y: Cy / C, sigmaMax: sigMax, area: Acontact }
    : null;

  // --- Strekkgruppa: resultant og eksentrisitet ---------------------------
  const tens = anchors.filter(a => a.N > 1e-6);
  const Ntot = tens.reduce((a, t) => a + t.N, 0);
  let eNx = 0, eNy = 0;
  if (Ntot > 0) {
    const rx = tens.reduce((a, t) => a + t.N * t.x, 0) / Ntot;
    const ry = tens.reduce((a, t) => a + t.N * t.y, 0) / Ntot;
    const gx = tens.reduce((a, t) => a + t.x, 0) / tens.length;
    const gy = tens.reduce((a, t) => a + t.y, 0) / tens.length;
    eNx = rx - gx; eNy = ry - gy;
  }

  const Vres = Math.hypot(L.Vx, L.Vy);

  return {
    converged, iter,
    u: { w: u[0], thx: u[1], thy: u[2] },
    anchors,
    tension: { anchors: tens, Ntot, eNx: Math.abs(eNx), eNy: Math.abs(eNy) },
    shear: { Vres, Vx: L.Vx, Vy: L.Vy, nShear },
    compression,
    contact,
    mounting: mnt,
    leverArm: mnt.leverArm,
  };
}

// Er det ingen trykkflate under plata (avstandsmontert, eller ingen plate i
// det hele tatt), kan tangentmatrisa bli singulaer: en enkelt bolt gir ingen
// rotasjonsstivhet, og en enkelt boltrad gir ingen stivhet om sin egen akse.
// Da legges det paa en liten diagonal saa loesningen finnes; retninga som
// mangler stivhet blir staaende i ro naar det ikke er moment aa ta opp.
// Er det moment om en slik akse, konvergerer ikke likevekten - inndata-
// kontrollen sier fra om det.
function solve3reg(A, b) {
  const x = solve3(A, b);
  if (x) return x;
  const big = Math.max(...A.flat().map(Math.abs), 1);
  for (let e = 1e-6; e <= 1e-1; e *= 100) {
    const R = A.map((row, i) =>
      row.map((v, j) => (i === j ? v + e * (Math.abs(v) || big) : v)));
    const y = solve3(R, b);
    if (y) return y;
  }
  return null;
}

// 3x3 loeser med delvis pivotering
function solve3(A, b) {
  const M = [[A[0][0], A[0][1], A[0][2], b[0]],
             [A[1][0], A[1][1], A[1][2], b[1]],
             [A[2][0], A[2][1], A[2][2], b[2]]];
  for (let i = 0; i < 3; i++) {
    let p = i;
    for (let r = i + 1; r < 3; r++) if (Math.abs(M[r][i]) > Math.abs(M[p][i])) p = r;
    if (Math.abs(M[p][i]) < 1e-12) return null;
    [M[i], M[p]] = [M[p], M[i]];
    for (let r = 0; r < 3; r++) {
      if (r === i) continue;
      const f = M[r][i] / M[i][i];
      for (let c = i; c < 4; c++) M[r][c] -= f * M[i][c];
    }
  }
  return [M[0][3] / M[0][0], M[1][3] / M[1][1], M[2][3] / M[2][2]];
}
