// 7.2.2.3 Stålbrudd
function shearSteel(m, res, g) {
  const VEd = Math.max(0, ...res.anchors.map(a => a.V));
  const d = m.anchors.d, fuk = m.anchors.fuk;
  const As = shaftArea(d);

  if (res.leverArm > 0) {
    const c = new Calc('7.2.2.3.2');
    c.in('⌀', d, 'mm', 'Bolter');
    c.in('f_uk', fuk, 'N/mm²', `Bolter · ${m.anchors.steel}`);
    c.in('l_a', res.leverArm, 'mm', 'Plate · avstand fra betong + t/2');
    c.in('γ_Ms,V', g.gMsV, '–', '4.4.3.1');
    c.in('V_Ed', VEd, 'N', 'Største boltskjær fra kraftfordelinga');
    const Wel = c.step({ sym: 'W_el', desc: 'Elastisk motstandsmoment i skaftet',
      formula: 'π · ⌀³ / 32', subst: `π · ${n(d, 0)}³ / 32`,
      value: Math.PI * Math.pow(d, 3) / 32, unit: 'mm³' });
    const M0 = c.step({ sym: 'M⁰_Rk,s', desc: 'Momentkapasitet uten samtidig strekk',
      formula: '1,2 · W_el · f_uk', subst: `1,2 · ${n(Wel)} · ${n(fuk, 0)}`,
      value: 1.2 * Wel * fuk, unit: 'Nmm', ref: '(7.37)' });
    const NRds = As * fuk / g.gMsN;
    const NEd = Math.max(0, ...res.anchors.map(a => a.N));
    const MRk = c.step({ sym: 'M_Rk,s', desc: 'Redusert av samtidig strekk i bolten',
      formula: 'M⁰_Rk,s · (1 − N_Ed/N_Rd,s)',
      subst: `${n(M0)} · (1 − ${n(NEd)}/${n(NRds)})`,
      value: M0 * Math.max(0, 1 - NEd / NRds), unit: 'Nmm', ref: '(7.36)' });
    const alphaM = c.in('α_M', 1.0, '–', 'Fritt dreibar plate (2,0 ved full innspenning)');
    const VRk = c.res({ sym: 'V_Rk,s,M', formula: 'α_M · M_Rk,s / l_a',
      subst: `${n(alphaM)} · ${n(MRk)} / ${n(res.leverArm, 0)}`,
      value: alphaM * MRk / res.leverArm, unit: 'N', ref: '(7.35)' });
    const VRd = VRk / g.gMsV;
    c.step({ sym: 'V_Rd,s', desc: 'Dimensjonerende kapasitet',
      formula: 'V_Rk,s,M / γ_Ms,V', subst: `${n(VRk)} / ${n(g.gMsV)}`, value: VRd, unit: 'N' });
    c.util({ formula: 'V_Ed / V_Rd,s', subst: `${n(VEd)} / ${n(VRd)}`, value: VEd / VRd });
    return { id: 'V-steel', mode: 'Stålbrudd, skjær m/ momentarm', clause: '7.2.2.3.2',
             scope: 'bolt', NRk: VRk, NRd: VRd, NEd: VEd, util: VEd / VRd, calc: c };
  }

  const c = new Calc('7.2.2.3.1');
  c.in('⌀', d, 'mm', 'Bolter');
  c.in('f_uk', fuk, 'N/mm²', `Bolter · ${m.anchors.steel}`);
  const k6 = c.in('k_6', K.k6, '–', 'Innstøpt hodebolt – 7.2.2.3.1');
  const k7 = c.in('k_7', m.anchors.ductile ? K.k7_ductile : K.k7_brittle, '–',
    m.anchors.ductile ? 'Duktilt stål (A₅ ≥ 8 %)' : 'Ikke duktilt stål');
  c.in('γ_Ms,V', g.gMsV, '–',
    g.mild ? 'maks(f_uk/f_yk ; 1,25) – 4.4.3.1' : '1,5 – høyfast stål, 4.4.3.1');
  c.in('V_Ed', VEd, 'N', 'Største boltskjær fra kraftfordelinga');
  c.step({ sym: 'A_s', desc: 'Spenningstverrsnitt i boltskaftet',
    formula: 'π · ⌀² / 4', subst: `π · ${n(d, 0)}² / 4`, value: As, unit: 'mm²' });
  const VRk = c.res({ sym: 'V_Rk,s', formula: 'k_6 · k_7 · A_s · f_uk',
    subst: `${n(k6)} · ${n(k7)} · ${n(As)} · ${n(fuk, 0)}`,
    value: K.k6 * k7 * As * fuk, unit: 'N', ref: '(7.34)' });
  const VRd = VRk / g.gMsV;
  c.step({ sym: 'V_Rd,s', desc: 'Dimensjonerende kapasitet',
    formula: 'V_Rk,s / γ_Ms,V', subst: `${n(VRk)} / ${n(g.gMsV)}`, value: VRd, unit: 'N' });
  c.util({ formula: 'V_Ed / V_Rd,s', subst: `${n(VEd)} / ${n(VRd)}`, value: VEd / VRd });

  return { id: 'V-steel', mode: 'Stålbrudd, skjær', clause: '7.2.2.3.1', scope: 'bolt',
           NRk: VRk, NRd: VRd, NEd: VEd, util: VEd / VRd, calc: c };
}

// 7.2.2.4 Betongutstøting (pry-out)
function shearPryout(m, res, g) {
  const c = new Calc('7.2.2.4');
  const hef = c.in('h_ef', m.anchors.hef, 'mm', 'Bolter');
  const fck = c.in('f_ck', m.concrete.fck, 'N/mm²', `Betongdel · ${m.concrete.grade}`);
  const k8 = c.in('k_8', hef < 60 ? K.k8_short : K.k8_long, '–',
    hef < 60 ? 'h_ef < 60 mm' : 'h_ef ≥ 60 mm');
  const gM = c.in('γ_Mc', g.gMc, '–', '4.4.3.1');
  const VEd = c.in('V_Ed,g', res.shear.Vres, 'N', 'Resultant skjærkraft på gruppa');

  const all = anchorPositions(m);
  const ccr = 1.5 * hef, scr = 3 * hef;
  const cracked = m.code.cracked;
  const k1 = cracked ? K.k1_cracked : K.k1_uncracked;
  const N0 = k1 * Math.sqrt(fck) * Math.pow(hef, 1.5);
  const Ac = coneArea(m, all, ccr), A0 = scr * scr;
  const cmin = minEdge(m, all);
  const psi_s = Number.isFinite(cmin) ? clamp(0.7 + 0.3 * cmin / ccr, 0, 1) : 1.0;
  const psi_re = m.code.denseReinf ? clamp(0.5 + hef / 200, 0, 1) : 1.0;

  c.step({ sym: 'A_c,N', desc: 'Utbruddsareal for ALLE bolter som tar skjær, ikke bare strekkboltene',
    formula: 'union av (⌀ ± c_cr,N), klippet mot frie kanter',
    subst: `${all.length} bolter, c_cr,N = ${n(ccr, 0)} mm`, value: Ac, unit: 'mm²' });
  const NRkc = c.step({
    sym: 'N_Rk,c', desc: 'Kjeglekapasitet for hele boltegruppa',
    formula: 'k_1·√f_ck·h_ef^1,5 · (A_c,N/A⁰_c,N) · ψ_s,N · ψ_re,N',
    subst: `${n(N0)} · (${n(Ac, 0)}/${n(A0, 0)}) · ${n(psi_s)} · ${n(psi_re)}`,
    value: N0 * (Ac / A0) * psi_s * psi_re, unit: 'N', ref: '7.2.1.4',
  });
  const VRk = c.res({ sym: 'V_Rk,cp', formula: 'k_8 · N_Rk,c',
    subst: `${n(k8)} · ${n(NRkc)}`, value: k8 * NRkc, unit: 'N', ref: '(7.39)' });
  const VRd = VRk / gM;
  c.step({ sym: 'V_Rd,cp', desc: 'Dimensjonerende kapasitet',
    formula: 'V_Rk,cp / γ_Mc', subst: `${n(VRk)} / ${n(gM)}`, value: VRd, unit: 'N' });
  c.util({ formula: 'V_Ed,g / V_Rd,cp', subst: `${n(VEd)} / ${n(VRd)}`, value: VEd / VRd });

  return { id: 'V-pryout', mode: 'Betongutstøting (pry-out)', clause: '7.2.2.4', scope: 'gruppe',
           NRk: VRk, NRd: VRd, NEd: VEd, util: VEd / VRd, calc: c };
}

// 7.2.2.5 Kantbrudd i betong
function shearConcreteEdge(m, res, g) {
  const V = res.shear;
  if (V.Vres < 1e-9) {
    const why = 'Ingen skjærkraft på forbindelsen.';
    return { id: 'V-edge', mode: 'Kantbrudd', clause: '7.2.2.5', scope: 'gruppe',
             NRk: Infinity, NRd: Infinity, NEd: 0, util: 0,
             calc: skipped('7.2.2.5', why), note: why };
  }
  const all = anchorPositions(m);
  const cc = m.concrete, a = m.anchors;
  const dnom = a.d;
  const lf = Math.min(a.hef, Math.max(8 * dnom, 300));
  const cracked = m.code.cracked;
  const k9 = cracked ? K.k9_cracked : K.k9_uncracked;
  const psi_re = { none: 1.0, bars: 1.2, 'bars+stirrups': 1.4 }[m.code.edgeReinf] ?? 1.0;

  const cands = [];
  if (V.Vx > 0 && cc.freeEdges.xPos) cands.push({ dir: 'xPos', axis: 'x' });
  if (V.Vx < 0 && cc.freeEdges.xNeg) cands.push({ dir: 'xNeg', axis: 'x' });
  if (V.Vy > 0 && cc.freeEdges.yPos) cands.push({ dir: 'yPos', axis: 'y' });
  if (V.Vy < 0 && cc.freeEdges.yNeg) cands.push({ dir: 'yNeg', axis: 'y' });
  if (!cands.length) {
    const why = 'Ingen fri kant i skjærkraftas retning.';
    return { id: 'V-edge', mode: 'Kantbrudd', clause: '7.2.2.5', scope: 'gruppe',
             NRk: Infinity, NRd: Infinity, NEd: V.Vres, util: 0,
             calc: skipped('7.2.2.5', why), note: why };
  }

  let worst = null;
  for (const cd of cands) {
    const ds = all.map(p => edgeDistances(m, p.x, p.y)[cd.dir]);
    const c1 = Math.min(...ds);
    if (!Number.isFinite(c1)) continue;
    const front = all.filter((p, i) => Math.abs(ds[i] - c1) < 1e-6);
    const axisX = cd.axis === 'x';
    const t = p => (axisX ? p.y : p.x);
    const sideNeg = axisX ? 'yNeg' : 'xNeg', sidePos = axisX ? 'yPos' : 'xPos';
    const lo = cc.freeEdges[sideNeg] ? -(axisX ? cc.Ly / 2 + cc.ey : cc.Lx / 2 + cc.ex) : -1e9;
    const hi = cc.freeEdges[sidePos] ? (axisX ? cc.Ly / 2 - cc.ey : cc.Lx / 2 - cc.ex) : 1e9;
    const width = unionLength(front.map(p =>
      [Math.max(t(p) - 1.5 * c1, lo), Math.min(t(p) + 1.5 * c1, hi)]));
    const height = Math.min(1.5 * c1, cc.h);
    const Ac = width * height, A0 = 4.5 * c1 * c1;
    const alpha = 0.1 * Math.sqrt(lf / c1);
    const beta = 0.1 * Math.pow(dnom / c1, 0.2);
    const V0 = k9 * Math.pow(dnom, alpha) * Math.pow(lf, beta)
             * Math.sqrt(cc.fck) * Math.pow(c1, 1.5);
    const c2 = Math.min(...front.map(p => {
      const e = edgeDistances(m, p.x, p.y); return Math.min(e[sideNeg], e[sidePos]); }));
    const psi_s = Number.isFinite(c2) ? clamp(0.7 + 0.3 * c2 / (1.5 * c1), 0, 1) : 1.0;
    const psi_h = Math.max(1, Math.sqrt(1.5 * c1 / cc.h));
    const comp = axisX ? Math.abs(V.Vx) : Math.abs(V.Vy);
    const cosA = clamp(comp / V.Vres, 0, 1);
    const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
    const psi_a = Math.max(1, Math.sqrt(1 / (cosA * cosA + Math.pow(0.5 * sinA, 2))));
    const eV = Math.abs(front.reduce((s, p) => s + t(p), 0) / front.length);
    const psi_ec = clamp(1 / (1 + 2 * eV / (3 * c1)), 0, 1);
    const VRk = V0 * (Ac / A0) * psi_s * psi_h * psi_a * psi_ec * psi_re;
    const VRd = VRk / g.gMc;
    const cand = { dir: cd.dir, c1, c2, front, width, height, Ac, A0, alpha, beta, V0,
                   psi_s, psi_h, psi_a, psi_ec, eV, VRk, VRd, util: V.Vres / VRd };
    if (!worst || cand.util > worst.util) worst = cand;
  }
  if (!worst) {
    const why = 'Ingen fri kant i skjærkraftas retning.';
    return { id: 'V-edge', mode: 'Kantbrudd', clause: '7.2.2.5', scope: 'gruppe',
             NRk: Infinity, NRd: Infinity, NEd: V.Vres, util: 0,
             calc: skipped('7.2.2.5', why), note: why };
  }

  const w = worst;
  const c = new Calc('7.2.2.5');
  c.in('c_1', w.c1, 'mm', `Kantavstand til kant ${EDGE_LABEL[w.dir]}, forreste boltrad`);
  c.in('⌀_nom', dnom, 'mm', 'Bolter');
  c.in('h', cc.h, 'mm', 'Betongdel · tykkelse');
  c.in('f_ck', cc.fck, 'N/mm²', `Betongdel · ${cc.grade}`);
  c.in('k_9', k9, '–', `Regelverk · ${cracked ? 'opprisset' : 'uopprisset'}`);
  c.in('γ_Mc', g.gMc, '–', '4.4.3.1');
  c.in('V_Ed,g', V.Vres, 'N', 'Resultant skjærkraft på gruppa');

  c.step({ sym: 'l_f', desc: 'Effektiv boltlengde i skjær',
    formula: 'min(h_ef ; maks(8·⌀ ; 300))',
    subst: `min(${n(a.hef, 0)} ; maks(${n(8 * dnom, 0)} ; 300))`, value: lf, unit: 'mm' });
  c.step({ sym: 'α', desc: 'Eksponent for boltlengde',
    formula: '0,1 · √(l_f / c_1)', subst: `0,1 · √(${n(lf, 0)}/${n(w.c1, 0)})`,
    value: w.alpha, unit: '–' });
  c.step({ sym: 'β', desc: 'Eksponent for boltdiameter',
    formula: '0,1 · (⌀_nom / c_1)^0,2', subst: `0,1 · (${n(dnom, 0)}/${n(w.c1, 0)})^0,2`,
    value: w.beta, unit: '–' });
  c.step({ sym: 'V⁰_Rk,c', desc: 'Grunnverdi kantbrudd, én bolt ved rett kant',
    formula: 'k_9 · ⌀_nom^α · l_f^β · √f_ck · c_1^1,5',
    subst: `${n(k9)} · ${n(dnom, 0)}^${n(w.alpha)} · ${n(lf, 0)}^${n(w.beta)} · ` +
           `√${n(cc.fck, 0)} · ${n(w.c1, 0)}^1,5`,
    value: w.V0, unit: 'N', ref: '(7.42)' });
  c.step({ sym: 'A⁰_c,V', desc: 'Referanseareal på kantflata for én bolt',
    formula: '4,5 · c_1²', subst: `4,5 · ${n(w.c1, 0)}²`, value: w.A0, unit: 'mm²' });
  c.step({ sym: 'A_c,V', desc: 'Faktisk bruddflate langs kanten',
    formula: 'bredde · høyde,  bredde = union av 1,5·c_1 hver vei fra forreste bolter',
    subst: `${n(w.width, 0)} · ${n(w.height, 0)}   ` +
           `(høyde = min(1,5·c_1 ; h) = min(${n(1.5 * w.c1, 0)} ; ${n(cc.h, 0)}))`,
    value: w.Ac, unit: 'mm²', ref: '(7.41)' });
  c.step({ sym: 'ψ_s,V', desc: 'Sidekant vinkelrett på lastretninga',
    formula: '0,7 + 0,3 · c_2 / (1,5·c_1) ≤ 1,0',
    subst: Number.isFinite(w.c2)
      ? `0,7 + 0,3 · ${n(w.c2, 0)} / (1,5·${n(w.c1, 0)})` : 'ingen sidekant',
    value: w.psi_s, unit: '–' });
  c.step({ sym: 'ψ_h,V', desc: 'Tynn betongdel – bruddflata får ikke utvikle seg fritt',
    formula: '√(1,5·c_1 / h) ≥ 1,0',
    subst: `√(${n(1.5 * w.c1, 0)} / ${n(cc.h, 0)})`, value: w.psi_h, unit: '–' });
  c.step({ sym: 'ψ_α,V', desc: 'Skjærkraft på skrå mot kanten',
    formula: '√(1 / (cos²α_V + (0,5·sin α_V)²)) ≥ 1,0',
    subst: `V mot kant ${EDGE_LABEL[w.dir]}`, value: w.psi_a, unit: '–' });
  c.step({ sym: 'ψ_ec,V', desc: 'Eksentrisk skjærresultant langs kanten',
    formula: '1 / (1 + 2·e_V/(3·c_1)) ≤ 1,0',
    subst: `e_V = ${n(w.eV, 1)} mm`, value: w.psi_ec, unit: '–' });
  c.step({ sym: 'ψ_re,V', desc: 'Kantarmering',
    formula: '1,0 uten · 1,2 med kantstenger · 1,4 med kantstenger og bøyler',
    subst: `Regelverk · ${m.code.edgeReinf}`, value: psi_re, unit: '–' });
  const VRk = c.res({ sym: 'V_Rk,c',
    formula: 'V⁰_Rk,c · (A_c,V/A⁰_c,V) · ψ_s,V · ψ_h,V · ψ_α,V · ψ_ec,V · ψ_re,V',
    subst: `${n(w.V0)} · (${n(w.Ac, 0)}/${n(w.A0, 0)}) · ${n(w.psi_s)} · ${n(w.psi_h)} · ` +
           `${n(w.psi_a)} · ${n(w.psi_ec)} · ${n(psi_re)}`,
    value: w.VRk, unit: 'N', ref: '(7.40)' });
  c.step({ sym: 'V_Rd,c', desc: 'Dimensjonerende kapasitet',
    formula: 'V_Rk,c / γ_Mc', subst: `${n(VRk)} / ${n(g.gMc)}`, value: w.VRd, unit: 'N' });
  c.util({ formula: 'V_Ed,g / V_Rd,c', subst: `${n(V.Vres)} / ${n(w.VRd)}`, value: w.util });

  return { id: 'V-edge', mode: `Kantbrudd mot ${EDGE_LABEL[w.dir]}`, clause: '7.2.2.5',
           scope: 'gruppe', edgeDir: w.dir,
           NRk: w.VRk, NRd: w.VRd, NEd: V.Vres, util: w.util, calc: c };
}

// ===========================================================================
//  7.2.3 Kombinert strekk og skjær
// ===========================================================================
function interaction(checks) {
  const get = id => checks.find(c => c.id === id);
  const out = [];

  const bNs = get('N-steel').util, bVs = get('V-steel').util;
  const cs = new Calc('7.2.3');
  cs.in('β_N', bNs, '–', 'Stålbrudd strekk – utnyttelse');
  cs.in('β_V', bVs, '–', 'Stålbrudd skjær – utnyttelse');
  cs.res({ sym: 'β_N² + β_V²', formula: '(β_N)² + (β_V)² ≤ 1,0',
    subst: `${n(bNs)}² + ${n(bVs)}²`, value: bNs ** 2 + bVs ** 2, unit: '–', ref: '(7.54)' });
  cs.util({ formula: '(β_N)² + (β_V)²', subst: `${n(bNs)}² + ${n(bVs)}²`,
    value: bNs ** 2 + bVs ** 2 });
  out.push({ id: 'IA-steel', mode: 'Samvirkning stål', clause: '7.2.3', scope: 'kombinasjon',
    expr: '(β_N)² + (β_V)² ≤ 1', util: bNs ** 2 + bVs ** 2, calc: cs,
    NRk: NaN, NRd: NaN, NEd: NaN });

  const tension = ['N-cone', 'N-pullout', 'N-blowout', 'N-split'];
  const shear = ['V-pryout', 'V-edge'];
  const tw = tension.map(id => get(id)).filter(Boolean)
    .reduce((a, b) => ((b.util || 0) > (a?.util || 0) ? b : a), null);
  const sw = shear.map(id => get(id)).filter(Boolean)
    .reduce((a, b) => ((b.util || 0) > (a?.util || 0) ? b : a), null);
  const bN = tw?.util || 0, bV = sw?.util || 0;

  const cc = new Calc('7.2.3');
  cc.in('β_N', bN, '–', `Styrende betongbrudd i strekk: ${tw?.mode ?? '–'}`);
  cc.in('β_V', bV, '–', `Styrende betongbrudd i skjær: ${sw?.mode ?? '–'}`);
  cc.step({ sym: 'forenklet', desc: 'Alternativ, lineær samvirkning',
    formula: 'β_N + β_V ≤ 1,2', subst: `${n(bN)} + ${n(bV)} = ${n(bN + bV)}`,
    value: (bN + bV) / 1.2, unit: '–' });
  cc.res({ sym: 'β_N^1,5 + β_V^1,5', formula: '(β_N)^1,5 + (β_V)^1,5 ≤ 1,0',
    subst: `${n(bN)}^1,5 + ${n(bV)}^1,5`,
    value: bN ** 1.5 + bV ** 1.5, unit: '–', ref: '(7.55)' });
  cc.util({ formula: '(β_N)^1,5 + (β_V)^1,5', subst: `${n(bN)}^1,5 + ${n(bV)}^1,5`,
    value: bN ** 1.5 + bV ** 1.5 });
  out.push({ id: 'IA-conc', mode: 'Samvirkning betong', clause: '7.2.3', scope: 'kombinasjon',
    expr: '(β_N)^1,5 + (β_V)^1,5 ≤ 1', util: bN ** 1.5 + bV ** 1.5, calc: cc,
    NRk: NaN, NRd: NaN, NEd: NaN });

  return out;
}

// ---------------------------------------------------------------------------
function runEN1992_4(m, res) {
  const g = partialFactors(m);
  const cone = tensionConcreteCone(m, res, g);
  const checks = [
    tensionSteel(m, res, g),
    tensionPullout(m, res, g),
    cone,
    tensionBlowout(m, res, g),
    tensionSplitting(m, res, g, cone),
    shearSteel(m, res, g),
    shearPryout(m, res, g),
    shearConcreteEdge(m, res, g),
  ];
  return { standard: 'NS-EN 1992-4:2018', gamma: g, checks: [...checks, ...interaction(checks)] };
}

// ===== src/engine/anchor-reinforcement.js ==========================
// ---------------------------------------------------------------------------
//  Forankringsarmering - NS-EN 1992-4 pkt. 7.2.1.8 / 7.2.2.6.
//
//  Legges det egen armering som krysser bruddkjegla, erstattes kontrollen av
//  betongkjeglebrudd med to kontroller av armeringa:
//     a) stålbrudd i armeringa
//     b) forankringsbrudd - heft over lengden inne i kjegla
//
//  Dette er også mekanismen norsk praksis (Betongelementboka) bygger på når
//  innstøpingsgods forankres med sløyfer eller skråstag.
// ---------------------------------------------------------------------------

const GAMMA_S = 1.15;

// Heftfasthet f_bd etter NS-EN 1992-1-1 pkt. 8.4.2
function fbd(fck, ds, goodBond = true) {
  const fctk = 0.7 * 0.3 * Math.pow(fck, 2 / 3);   // f_ctk;0,05
  const fctd = fctk / 1.5;
  const eta1 = goodBond ? 1.0 : 0.7;
  const eta2 = ds <= 32 ? 1.0 : (132 - ds) / 100;
  return 2.25 * eta1 * eta2 * fctd;
}

function tensionReinforcement(m, res, r) {
  const NEd = res.tension.Ntot;
  const As = r.n * Math.PI * r.ds * r.ds / 4;

  // --- a) stålbrudd i armeringa ---
  const ca = new Calc('7.2.1.8');
  ca.in('n', r.n, 'stk', 'Forankringsarmering · bein som krysser kjegla');
  ca.in('⌀_s', r.ds, 'mm', 'Forankringsarmering');
  ca.in('f_yk', r.fyk, 'N/mm²', 'Forankringsarmering');
  ca.in('γ_Ms,re', GAMMA_S, '–', 'Armeringsstål – NS-EN 1992-1-1');
  ca.in('N_Ed,g', NEd, 'N', 'Sum strekk i boltegruppa');
  ca.step({ sym: 'A_s,re', desc: 'Samlet armeringsareal i bruddflata',
    formula: 'n · π · ⌀_s² / 4', subst: `${r.n} · π · ${n(r.ds, 0)}² / 4`,
    value: As, unit: 'mm²' });
  const NRk_s = ca.res({ sym: 'N_Rk,re', formula: 'A_s,re · f_yk',
    subst: `${n(As)} · ${n(r.fyk, 0)}`, value: As * r.fyk, unit: 'N' });
  const NRd_s = NRk_s / GAMMA_S;
  ca.step({ sym: 'N_Rd,re', desc: 'Dimensjonerende kapasitet',
    formula: 'N_Rk,re / γ_Ms,re', subst: `${n(NRk_s)} / ${n(GAMMA_S)}`,
    value: NRd_s, unit: 'N' });
  ca.util({ formula: 'N_Ed,g / N_Rd,re', subst: `${n(NEd)} / ${n(NRd_s)}`,
    value: NEd / NRd_s });

  // --- b) heft ---
  const cb = new Calc('7.2.1.8');
  const f = fbd(m.concrete.fck, r.ds, r.goodBond);
  const a1 = r.hooked ? 0.7 : 1.0;
  cb.in('n', r.n, 'stk', 'Forankringsarmering');
  cb.in('⌀_s', r.ds, 'mm', 'Forankringsarmering');
  cb.in('l_1', r.l1, 'mm', 'Forankringsarmering · lengde inne i bruddkjegla');
  cb.in('f_ck', m.concrete.fck, 'N/mm²', `Betongdel · ${m.concrete.grade}`);
  cb.in('α_1', a1, '–', r.hooked ? 'Kroket/bøyd stang' : 'Rett stangende');
  cb.in('N_Ed,g', NEd, 'N', 'Sum strekk i boltegruppa');
  const fctk = 0.7 * 0.3 * Math.pow(m.concrete.fck, 2 / 3);
  cb.step({ sym: 'f_ctk;0,05', desc: 'Nedre karakteristisk strekkfasthet',
    formula: '0,7 · 0,3 · f_ck^(2/3)', subst: `0,7 · 0,3 · ${n(m.concrete.fck, 0)}^(2/3)`,
    value: fctk, unit: 'N/mm²', ref: 'EN 1992-1-1 tab. 3.1' });
  cb.step({ sym: 'f_bd', desc: 'Dimensjonerende heftfasthet',
    formula: '2,25 · η_1 · η_2 · f_ctk;0,05 / γ_c',
    subst: `2,25 · ${r.goodBond ? '1,0' : '0,7'} · ${r.ds <= 32 ? '1,0' : n((132 - r.ds) / 100)}` +
           ` · ${n(fctk)} / 1,5`,
    value: f, unit: 'N/mm²', ref: 'EN 1992-1-1 8.4.2' });
  const NRk_a = cb.res({ sym: 'N_Rk,a', formula: 'n · π · ⌀_s · l_1 · f_bd / α_1',
    subst: `${r.n} · π · ${n(r.ds, 0)} · ${n(r.l1, 0)} · ${n(f)} / ${n(a1)}`,
    value: r.n * (r.l1 * Math.PI * r.ds * f) / a1, unit: 'N' });
  cb.util({ formula: 'N_Ed,g / N_Rd,a', subst: `${n(NEd)} / ${n(NRk_a)}`,
    value: NEd / NRk_a });

  const lbmin = Math.max(10 * r.ds, 100);
  const checks = [
    { id: 'N-re-steel', mode: 'Forankringsarmering – stålbrudd', clause: '7.2.1.8 (a)',
      scope: 'gruppe', NRk: NRk_s, NRd: NRd_s, NEd, util: NEd / NRd_s, calc: ca },
    { id: 'N-re-anch', mode: 'Forankringsarmering – heft', clause: '7.2.1.8 (b)',
      scope: 'gruppe', NRk: NRk_a, NRd: NRk_a, NEd, util: NEd / NRk_a, calc: cb,
      note: r.l1 < lbmin
        ? `l₁ < l_b,min = ${n(lbmin, 0)} mm – øk forankringslengden.` : undefined },
  ];
  return checks;
}

// 7.2.2.6 Kantarmering mot skjær - forenklet: armeringa tar hele skjærkrafta
function shearReinforcement(m, res, r) {
  const As = r.nV * Math.PI * r.dsV * r.dsV / 4;
  const VEd = res.shear.Vres;
  const c = new Calc('7.2.2.6');
  c.in('n', r.nV, 'stk', 'Forankringsarmering · kantarmering');
  c.in('⌀_s', r.dsV, 'mm', 'Forankringsarmering');
  c.in('f_yk', r.fykV, 'N/mm²', 'Forankringsarmering');
  c.in('γ_Ms,re', GAMMA_S, '–', 'Armeringsstål – NS-EN 1992-1-1');
  c.in('V_Ed,g', VEd, 'N', 'Resultant skjærkraft på gruppa');
  c.step({ sym: 'A_s,re', desc: 'Armeringsareal som krysser bruddflata',
    formula: 'n · π · ⌀_s² / 4', subst: `${r.nV} · π · ${n(r.dsV, 0)}² / 4`,
    value: As, unit: 'mm²' });
  const VRk = c.res({ sym: 'V_Rk,re', formula: 'A_s,re · f_yk',
    subst: `${n(As)} · ${n(r.fykV, 0)}`, value: As * r.fykV, unit: 'N' });
  const VRd = VRk / GAMMA_S;
  c.step({ sym: 'V_Rd,re', desc: 'Dimensjonerende kapasitet',
    formula: 'V_Rk,re / γ_Ms,re', subst: `${n(VRk)} / ${n(GAMMA_S)}`, value: VRd, unit: 'N' });
  c.util({ formula: 'V_Ed,g / V_Rd,re', subst: `${n(VEd)} / ${n(VRd)}`, value: VEd / VRd });

  return [{ id: 'V-re-steel', mode: 'Kantarmering – stålbrudd', clause: '7.2.2.6',
            scope: 'gruppe', NRk: VRk, NRd: VRd, NEd: VEd, util: VEd / VRd, calc: c,
            note: 'Forutsetter at armeringa er forankret på begge sider av bruddflata.' }];
}

// ===== src/engine/b19.js ===========================================
// ---------------------------------------------------------------------------
//  Betongelementboka, bind B - kapittel B19.
//
//  STATUS: ikke implementert.  Modulen viser hvordan et regelverk kobles inn i
//  motoren (samme grensesnitt som en1992-4.js), men formlene er IKKE lagt inn,
//  fordi de maa hentes ordrett fra boka. Ingen tall er gjettet.
//
//  For aa fylle den ut trengs pr. kontroll:
//    - formel med alle faktorer og gyldighetsomraade
//    - materialfaktorer boka bruker
//    - hvilke geometrigrenser som gjelder (kantavstand, senteravstand, tykkelse)
//
//  Grensesnitt en kontroll skal returnere:
//    { id, mode, clause, scope, NRk, NRd, NEd, util, terms:[[navn,verdi,enhet]], note }
// ---------------------------------------------------------------------------

const B19_PLANNED_CHECKS = [
  { id: 'B19-kjegle',   mode: 'Bruddkjegle i betong',            status: 'mangler formelgrunnlag' },
  { id: 'B19-kant',     mode: 'Kantbrudd',                       status: 'mangler formelgrunnlag' },
  { id: 'B19-armering', mode: 'Forankring med armeringssløyfer', status: 'mangler formelgrunnlag' },
  { id: 'B19-sveis',    mode: 'Sveis bolt/plate',                 status: 'mangler formelgrunnlag' },
  { id: 'B19-plate',    mode: 'Bøyning i forankringsplata',      status: 'mangler formelgrunnlag' },
];

function runB19(m, res) {
  return {
    standard: 'Betongelementboka bind B, kap. B19 (ikke implementert)',
    gamma: {},
    checks: B19_PLANNED_CHECKS.map(c => ({
      id: c.id, mode: c.mode, clause: 'B19', scope: 'gruppe',
      NRk: NaN, NRd: NaN, NEd: NaN, util: NaN,
      calc: skipped('B19', c.status),
      note: c.status,
    })),
  };
}

// ===== src/engine/validate.js ======================================
// ---------------------------------------------------------------------------
//  Inndatakontroll.  Fanger geometri som ikke gir mening, og minstekrav til
//  kant-/senteravstand.  'error' stopper ikke beregningen, men resultatet skal
//  ikke brukes.
// ---------------------------------------------------------------------------

function validate(m) {
  const out = [];
  const err = t => out.push({ level: 'error', text: t });
  const warn = t => out.push({ level: 'warn', text: t });

  const a = m.anchors, c = m.concrete, p = m.plate;
  const pos = anchorPositions(m);

  // --- entydig gal geometri ---------------------------------------------
  for (const q of pos) {
    const e = edgeDistances(m, q.x, q.y);
    const cmin = Math.min(e.xNeg, e.xPos, e.yNeg, e.yPos);
    if (cmin <= 0) {
      err(`Bolt ${q.id} ligger utenfor betongdelen (kantavstand ${Math.round(cmin)} mm). ` +
          `Øk L_x/L_y, eller reduser senteravstand/offset.`);
      break;
    }
  }
  if (a.hef >= c.h) err(`h_ef = ${a.hef} mm er ikke mindre enn tykkelsen h = ${c.h} mm.`);
  else if (a.hef > 0.8 * c.h)
    warn(`h_ef = ${a.hef} mm er over 80 % av tykkelsen (h = ${c.h} mm) – kontroller ` +
         `gjennomlokking og plass til hodet.`);
  if (p.bx > c.Lx || p.by > c.Ly) warn('Forankringsplata er større enn betongdelen.');
  if (a.nx * a.ny < 1) err('Minst én bolt kreves.');

  // --- minstekrav (veiledende, skal hentes fra ETA/produktdata) ----------
  const sMin = 5 * a.d, cMin = 5 * a.d;
  if (a.nx > 1 && a.sx < sMin)
    warn(`Senteravstand s_x = ${a.sx} mm < veiledende s_min = ${sMin} mm (5·⌀).`);
  if (a.ny > 1 && a.sy < sMin)
    warn(`Senteravstand s_y = ${a.sy} mm < veiledende s_min = ${cMin} mm (5·⌀).`);
  let cAbs = Infinity;
  for (const q of pos) {
    const e = edgeDistances(m, q.x, q.y);
    cAbs = Math.min(cAbs, e.xNeg, e.xPos, e.yNeg, e.yPos);
  }
  if (Number.isFinite(cAbs) && cAbs > 0 && cAbs < cMin)
    warn(`Minste kantavstand ${Math.round(cAbs)} mm < veiledende c_min = ${cMin} mm (5·⌀).`);

  if (boltsOutside(m))
    warn(`Boltene ligger nærmere platekanten enn ${EDGE_MIN} mm, eller utenfor ` +
         `plata. Endre antallet for å sette senteravstanden automatisk.`);

  // --- kontakttrykk mot betong ------------------------------------------
  const mnt = mounting(m);
  if (mnt.kind === 'standoff')
    warn(`Plata står ${p.gap} mm fra betongen – skjær regnes med momentarm ` +
         `og boltene tar også trykk.`);
  if (mnt.kind === 'grout' && !mnt.groutOk)
    warn(`Gytemassen (${p.fckGrout} N/mm²) er svakere enn betongen eller under ` +
         `30 N/mm². Undergytingen regnes da ikke som fast anlegg, og skjæret ` +
         `får momentarm gjennom gytesjiktet.`);

  // --- forankringsarmering ----------------------------------------------
  if (m.code.supplementaryReinf && m.reinf) {
    if (!(m.reinf.n > 0)) err('Forankringsarmering er valgt, men antall bein er 0.');
    if (m.reinf.l1 > a.hef)
      warn(`l₁ = ${m.reinf.l1} mm er lengre enn h_ef = ${a.hef} mm.`);
  }
  return out;
}

// Kontakttrykk mot betongens dimensjonerende trykkfasthet
function bearingCheck(m, res) {
  if (!res.compression) return null;
  const fcd = 0.85 * m.concrete.fck / m.code.gammaC;
  return {
    sigma: res.compression.sigmaMax, fcd,
    util: res.compression.sigmaMax / fcd,
    ok: res.compression.sigmaMax <= fcd,
  };
}

// ===== src/engine/verify.js ========================================
// Orkestrering: loes kraftfordeling, kjoer valgt regelverk, sorter resultat.

const CODES = { 'EN1992-4': runEN1992_4, 'B19': runB19 };

function verify(m) {
  const issues = validate(m);
  const res = solvePlate(m);
  const run = CODES[m.code.standard] || runEN1992_4;
  const out = run(m, res);

  let checks = out.checks;
  if (m.code.standard === 'EN1992-4' && m.code.supplementaryReinf && m.reinf) {
    const extra = [
      ...tensionReinforcement(m, res, m.reinf),
      ...(m.reinf.nV > 0 ? shearReinforcement(m, res, m.reinf) : []),
    ];
    // Med forankringsarmering erstattes betongkjegla av armeringskontrollen
    checks = checks.filter(c => c.id !== 'N-cone').concat(extra);
  }

  const valid = checks.filter(c => Number.isFinite(c.util));
  const governing = valid.length
    ? valid.reduce((a, b) => (b.util > a.util ? b : a)) : null;

  return {
    model: m, res, standard: out.standard, gamma: out.gamma,
    issues, bearing: bearingCheck(m, res),
    checks, governing,
    maxUtil: governing ? governing.util : NaN,
    ok: governing ? governing.util <= 1.0 : false,
  };
}

// ===== src/viz/three-d-stage.js ====================================
// ---------------------------------------------------------------------------
//  <three-d-stage> - web component for 3D-visning.
//  Three.js r0.184 (importmap), OrbitControls, eksport til OBJ/MTL og GLB.
//
//  API:
//    stage.setContent(object3d)      bytt ut modellen
//    stage.frameAll()                zoom til modellen
//    stage.setView('iso'|'top'|'front'|'side')
//    stage.exportOBJ(basename)       laster ned .obj + .mtl
//    stage.exportGLB(basename)       laster ned .glb
// ---------------------------------------------------------------------------

// Slår om når verdien er tydelig negativ, tilbake når den er tydelig positiv,
// og lar tilstanden stå i dødsonen imellom.
function hyst(on, value, band) {
  if (on) return value < band;
  return value < -band;
}

const FLIP_Y = new THREE.Quaternion()
  .setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);
const FLIP_Z = new THREE.Quaternion()
  .setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI);

const CSS = `
  :host { display:block; position:relative; width:100%; height:100%; }
  canvas { display:block; width:100%; height:100%; outline:none; }
  .bar { position:absolute; top:8px; right:8px; display:flex; gap:4px; flex-wrap:wrap;
         justify-content:flex-end; max-width:calc(100% - 16px); z-index:2; }
  .bar button {
    font: 500 11px/1 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    padding:7px 10px; border-radius:6px; cursor:pointer;
    border:1px solid #e3dfd6; background:rgba(255,255,255,.86);
    color:#6b665c; backdrop-filter:blur(8px);
    box-shadow:0 1px 3px rgba(43,41,36,.06);
    transition:color .12s ease, border-color .12s ease;
  }
  .bar button:hover { color:#8a7448; border-color:#8a7448; }
  .bar button:focus-visible { outline:2px solid #8a7448; outline-offset:2px; }
  .msg { position:absolute; left:50%; transform:translateX(-50%); bottom:12px; z-index:2;
         font:11px "IBM Plex Mono", ui-monospace, monospace; color:#6b665c;
         background:rgba(255,255,255,.9); border:1px solid #e3dfd6;
         border-radius:6px; padding:6px 11px; }
  .msg:empty { display:none; }
`;

class ThreeDStage extends HTMLElement {
  connectedCallback() {
    if (this._init) return;
    this._init = true;

    const root = this.attachShadow({ mode: 'open' });
    root.innerHTML = `<style>${CSS}</style>
      <div class="bar">
        <button data-v="iso">ISO</button><button data-v="top">Plan</button>
        <button data-v="front">Front</button><button data-v="side">Side</button>
        <button data-a="fit">Tilpass</button>
        <button data-a="obj">OBJ</button><button data-a="glb">GLB</button>
      </div>
      <div class="msg"></div>`;
    this._msg = root.querySelector('.msg');
    // Verten kan levere sine egne, dokkede kontroller i stedet for den
    // flytende lista - da skal ingenting ligge oppå selve visninga.
    if (this.getAttribute('controls') === 'none')
      root.querySelector('.bar').remove();

    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    // Nøytral tonemapping holder de lyse gråtonene der de skal være;
    // ACES trekker et lyst motiv mot grått.
    this.renderer.toneMapping = THREE.NeutralToneMapping;
    this.renderer.toneMappingExposure = 1.0;
    // Ingen skyggelegging: modellen leses tydeligere uten, og skyggen av en
    // flat betongkloss ga lite igjen for kostnaden.
    this.renderer.shadowMap.enabled = false;
    root.appendChild(this.renderer.domElement);

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(this.getAttribute('background') || '#efede8');

    // Miljøkart - uten dette blir metalliske materialer nesten svarte.
    const pmrem = new THREE.PMREMGenerator(this.renderer);
    this.scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    this.scene.environmentIntensity = 0.35;
    pmrem.dispose();

    // To kameraer som deler posisjon og retning. Perspektiv gir dybdefølelse;
    // parallellprojeksjon gjør at like store ting tegnes like store uansett
    // avstand, slik at mål kan sammenliknes direkte i bildet.
    this.perspCam = new THREE.PerspectiveCamera(38, 1, 1, 100000);
    this.orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, -100000, 100000);
    this.camera = this.perspCam;
    this.camera.position.set(1200, 900, 1200);
    this._orthoSize = 1000;

    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.08;

    // Lys: ett mykt hovedlys som gir kontaktskyggen, pluss himmellys og et
    // svakt motlys så baksidene ikke går i svart.
    this.scene.add(new THREE.HemisphereLight(0xffffff, 0xcfcabe, 0.95));

    this.key = new THREE.DirectionalLight(0xfff8ec, 1.55);
    this.key.position.set(-1500, 2400, 1700);
    this.scene.add(this.key, this.key.target);

    const fill = new THREE.DirectionalLight(0xe8eef7, 0.3);
    fill.position.set(1600, 900, -1400);
    this.scene.add(fill);

    this.content = new THREE.Group();
    this.scene.add(this.content);

    // Påskriftene er ekte DOM-elementer plassert med 3D-transformasjoner, så de
    // ligger i modellens plan og følger den i både rotasjon og størrelse - og
    // er likevel redigerbare felt. Laget legges i lys DOM av verten
    // (attachLabelLayer), ellers når ikke sidas CSS inn til dem.
    this.css = new CSS3DRenderer();
    Object.assign(this.css.domElement.style,
      { position: 'absolute', inset: '0', pointerEvents: 'none' });
    this.cssScene = new THREE.Scene();
    this._labels = [];

    root.querySelectorAll('[data-v]').forEach(b =>
      b.onclick = () => this.setView(b.dataset.v));
    root.querySelector('[data-a="fit"]')?.addEventListener('click', () => this.frameAll());
    root.querySelector('[data-a="obj"]')?.addEventListener('click', () => this.exportOBJ());
    root.querySelector('[data-a="glb"]')?.addEventListener('click', () => this.exportGLB());

    this._ro = new ResizeObserver(() => this._resize());
    this._ro.observe(this);
    this._resize();

    const tick = () => {
      this._raf = requestAnimationFrame(tick);
      this.controls.update();
      this.renderer.render(this.scene, this.camera);
      this._faceLabels();
      this.css.render(this.cssScene, this.camera);
    };
    tick();
  }

  disconnectedCallback() {
    cancelAnimationFrame(this._raf);
    this.setLabels([]);
    this._ro?.disconnect();
  }

  _resize() {
    const w = this.clientWidth || 800, h = this.clientHeight || 600;
    this.renderer.setSize(w, h, false);
    this.css?.setSize(w, h);

    this.perspCam.aspect = w / h;
    this.perspCam.updateProjectionMatrix();

    const a = w / h, s = this._orthoSize;
    Object.assign(this.orthoCam, { left: -s * a, right: s * a, top: s, bottom: -s });
    this.orthoCam.updateProjectionMatrix();
  }

  get isOrtho() { return this.camera === this.orthoCam; }

  // Bytter projeksjon uten at bildet hopper. Det nye kameraet arver posisjon og
  // retning, og utsnittet regnes om slik at modellen har samme synlige
  // størrelse ved målpunktet - i stedet for å ramme inn på nytt og kaste bort
  // zoomen brukeren har stilt inn.
  setProjection(kind) {
    const want = kind === 'ortho';
    if (want === this.isOrtho) return;
    const from = this.camera, to = want ? this.orthoCam : this.perspCam;
    const half = Math.tan(THREE.MathUtils.degToRad(this.perspCam.fov) / 2);
    const dist = from.position.distanceTo(this.controls.target);

    to.quaternion.copy(from.quaternion);
    to.up.copy(from.up);

    if (want) {
      to.position.copy(from.position);
      this._orthoSize = dist * half;      // halve bildehøyden ved målpunktet
      to.zoom = 1;
    } else {
      const d = (this._orthoSize / (from.zoom || 1)) / half;
      const dir = new THREE.Vector3()
        .subVectors(from.position, this.controls.target).normalize();
      to.position.copy(this.controls.target).addScaledVector(dir, d);
      to.near = Math.max(1, d / 500);
      to.far = d * 20;
    }

    this.camera = to;
    this.controls.object = to;
    this._resize();
    this.dispatchEvent(new CustomEvent('projection', { detail: { ortho: want } }));
  }

  // Laget for påskrifter må ligge i vertens DOM for at CSS-en skal treffe.
  attachLabelLayer(host) {
    host.appendChild(this.css.domElement);
    this._resize();
  }

  // items: [{ el, pos: Vector3, quat: Quaternion, scale: number }]
  setLabels(items) {
    for (const o of this._labels) {
      this.cssScene.remove(o);
      o.element.remove();
    }
    this._labels = [];
    for (const it of items) {
      it.el.style.pointerEvents = 'auto';
      const o = new CSS3DObject(it.el);
      o.position.copy(it.pos);
      o.quaternion.copy(it.quat);
      o.scale.setScalar(it.scale);
      o.userData.front = it.quat.clone();
      this.cssScene.add(o);
      this._labels.push(o);
    }
  }

  // Tekst som ligger i et plan kan bli ulesbar på to ulike måter, og de krever
  // hver sin korreksjon:
  //
  //   speilvendt   kamera ser baksida av planet   -> snu 180° om lokal Y
  //   opp ned      lesretninga peker mot venstre  -> snu 180° om lokal Z
  //
  // Begge testene bygger på et fortegn som går gjennom null når planet eller
  // lesretninga står på kant mot kamera. Uten dødsone vipper påskrifta fram og
  // tilbake for de minste kamerabevegelsene akkurat der. Derfor er hver test
  // hysteresebasert: den slår om ved ±BAND og husker tilstanden imellom.
  _faceLabels() {
    if (!this._labels.length) return;
    const q = this._q || (this._q = new THREE.Quaternion());
    const n = this._n || (this._n = new THREE.Vector3());
    const d = this._d || (this._d = new THREE.Vector3());
    const x = this._x || (this._x = new THREE.Vector3());
    const inv = this._iq || (this._iq = new THREE.Quaternion());
    inv.copy(this.camera.quaternion).invert();

    for (const o of this._labels) {
      const u = o.userData;
      q.copy(u.front);

      n.set(0, 0, 1).applyQuaternion(q);
      // I parallellprojeksjon går alle strålene samme vei, så retningen mot
      // betrakteren er kameraets egen +z - ikke veien fra påskrifta til det.
      if (this.isOrtho) d.set(0, 0, 1).applyQuaternion(this.camera.quaternion);
      else d.subVectors(this.camera.position, o.position).normalize();
      u.mirror = hyst(u.mirror, n.dot(d), 0.05);
      if (u.mirror) q.multiply(FLIP_Y);

      x.set(1, 0, 0).applyQuaternion(q).applyQuaternion(inv);
      u.upside = hyst(u.upside, x.x, 0.12);
      if (u.upside) q.multiply(FLIP_Z);

      o.quaternion.copy(q);
    }
  }

  setContent(obj) {
    this.content.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) [].concat(o.material).forEach(mm => mm.dispose());
    });
    this.content.clear();
    this.content.add(obj);
    if (!this._framed) { this.frameAll(); this._framed = true; }
  }

  _bounds() {
    const box = new THREE.Box3().setFromObject(this.content);
    if (box.isEmpty()) box.set(new THREE.Vector3(-500, -500, -500), new THREE.Vector3(500, 500, 500));
    return box;
  }

  frameAll(factor = 1.5) {
    const box = this._bounds();
    const c = box.getCenter(new THREE.Vector3());
    const r = box.getSize(new THREE.Vector3()).length() / 2;
    const dist = (r / Math.sin(THREE.MathUtils.degToRad(this.perspCam.fov) / 2)) * factor * 0.6;
    const dir = this._framed
      ? this.camera.position.clone().sub(this.controls.target).normalize()
      : new THREE.Vector3(1, 0.8, 1).normalize();   // fast startretning
    if (!dir.lengthSq()) dir.set(1, 0.8, 1).normalize();
    this.controls.target.copy(c);
    this.camera.position.copy(c).addScaledVector(dir, dist);
    this.perspCam.near = Math.max(1, dist / 500);
    this.perspCam.far = dist * 20;
    this.perspCam.updateProjectionMatrix();

    // Parallellkameraet har ingen avstandsavhengighet, så «zoom» er høyden på
    // bildeutsnittet. Den settes av modellens størrelse, ikke av avstanden.
    this._orthoSize = r * factor * 0.62;
    this.orthoCam.zoom = 1;
    this._resize();

    // Hovedlyset holdes i fast retning i forhold til modellen, så belysninga
    // ikke endrer seg når du zoomer.
    this.key.target.position.copy(c);
    this.key.position.copy(c).add(new THREE.Vector3(-r * 1.8, r * 2.0, r * 1.4));
  }

  setView(v) {
    const box = this._bounds();
    const c = box.getCenter(new THREE.Vector3());
    const dirs = {
      iso: [1, 0.75, 1], top: [0.001, 1, 0.001], front: [0, 0.05, 1], side: [1, 0.05, 0],
    };
    const d = new THREE.Vector3(...(dirs[v] || dirs.iso)).normalize();
    const dist = this.camera.position.distanceTo(this.controls.target);
    this.controls.target.copy(c);
    this.camera.position.copy(c).addScaledVector(d, dist);
    this.frameAll();
  }

  // ---- Eksport ----------------------------------------------------------
  //  Binær GLB kommer ikke gjennom vertens nedlasting, så der eksporteres
  //  glTF (JSON) i stedet. Samme modell, samme materialer.
  async exportGLB(name = 'forankring') {
    const binary = !(await hostSaves());
    this._note(binary ? 'Bygger GLB…' : 'Bygger glTF…');
    try {
      const data = await new Promise((ok, bad) =>
        new GLTFExporter().parse(this.content, ok, bad, { binary }));
      const file = binary
        ? [new Blob([data], { type: 'model/gltf-binary' }), `${name}.glb`]
        : [JSON.stringify(data), `${name}.gltf`];
      this._note(saveMessage(await saveFile(file[0], file[1])));
    } catch (e) { this._note(saveError(e)); }
  }

  async exportOBJ(name = 'forankring') {
    const { obj, mtl } = objMtl(this.content, name);
    try {
      // Én forespørsel om gangen - MTL-fila må vente på svar på OBJ-fila.
      const a = await saveFile(obj, `${name}.obj`);
      const b = await saveFile(mtl, `${name}.mtl`);
      this._note(a.renamed
        ? `Lagret ${a.filename} + ${b.filename} – gi dem endelsene .obj og .mtl`
        : `Lagret ${a.filename} + ${b.filename}`);
    } catch (e) { this._note(saveError(e)); }
  }

  _note(t) {
    this._msg.textContent = t;
    clearTimeout(this._noteT);
    this._noteT = setTimeout(() => (this._msg.textContent = ''), 7000);
  }
}

// ---------------------------------------------------------------------------
//  OBJ + MTL.  Egen skriver (ikke OBJExporter) fordi vi vil ha ekte
//  usemtl-grupper og en MTL-fil med farger/gjennomsiktighet.
// ---------------------------------------------------------------------------
function objMtl(root, name = 'model') {
  const O = [`# ${name} - eksportert fra Betong forankring`, `mtllib ${name}.mtl`];
  const mats = new Map();
  let vOff = 1, nOff = 1;

  root.updateWorldMatrix(true, true);
  const nm = new THREE.Matrix3();
  const v = new THREE.Vector3();

  root.traverse(o => {
    if (!o.isMesh || !o.geometry?.attributes?.position || o.userData.noExport) return;
    const g = o.geometry;
    const pos = g.attributes.position, nor = g.attributes.normal;
    const idx = g.index ? g.index.array
      : Uint32Array.from({ length: pos.count }, (_, i) => i);

    const mat = [].concat(o.material)[0];
    const key = mat.name || `mat_${mat.uuid.slice(0, 8)}`;
    if (!mats.has(key)) mats.set(key, mat);

    O.push(`o ${(o.name || 'part').replace(/\s+/g, '_')}`);
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      O.push(`v ${f(v.x)} ${f(v.y)} ${f(v.z)}`);
    }
    if (nor) {
      nm.getNormalMatrix(o.matrixWorld);
      for (let i = 0; i < nor.count; i++) {
        v.fromBufferAttribute(nor, i).applyMatrix3(nm).normalize();
        O.push(`vn ${f(v.x)} ${f(v.y)} ${f(v.z)}`);
      }
    }
    O.push(`usemtl ${key}`);
    for (let i = 0; i < idx.length; i += 3) {
      const a = idx[i] + vOff, b = idx[i + 1] + vOff, c = idx[i + 2] + vOff;
      O.push(nor
        ? `f ${a}//${idx[i] + nOff} ${b}//${idx[i + 1] + nOff} ${c}//${idx[i + 2] + nOff}`
        : `f ${a} ${b} ${c}`);
    }
    vOff += pos.count;
    if (nor) nOff += nor.count;
  });

  const M = [`# ${name} materialer`];
  for (const [key, mat] of mats) {
    const c = mat.color || new THREE.Color(0xcccccc);
    M.push(`newmtl ${key}`,
      `Kd ${f(c.r)} ${f(c.g)} ${f(c.b)}`,
      `Ka ${f(c.r * 0.2)} ${f(c.g * 0.2)} ${f(c.b * 0.2)}`,
      `Ks 0.20 0.20 0.20`,
      `Ns ${f(200 * (1 - (mat.roughness ?? 0.7)))}`,
      `d ${f(mat.transparent ? (mat.opacity ?? 1) : 1)}`,
      `illum 2`, '');
  }
  return { obj: O.join('\n'), mtl: M.join('\n') };
}

const f = n => (Math.round(n * 1e4) / 1e4).toString();

if (!customElements.get('three-d-stage')) customElements.define('three-d-stage', ThreeDStage);

// ===== src/viz/scene-builder.js ====================================
// ---------------------------------------------------------------------------
//  Bygger Three.js-scenen fra modellen + resultatet.
//
//  Alt bygges i INGENIOERKOORDINATER (x, y, z opp ut av betongen, mm).
//  Rotgruppa roteres -90 grader om X slik at ingenioer-z blir Three sin Y.
// ---------------------------------------------------------------------------

// Betongkorn genereres i sida - ingen ekstern tekstur. Fin støy med noen få
// mørkere luftporer, brukt både som farge- og ujevnhetskart, gir overflata en
// støpt karakter i stedet for jevn plastgrå.
// Fullt dekkende, men malt i den gjennomskinnelige passeringa så stålet
// legger seg over betongen i stedet for å bli tonet ned av den.
const OVER_CONCRETE = { transparent: true, opacity: 1, depthWrite: true };
const ORDER = { body: 0, outline: 2, load: 3, steel: 4, tag: 10 };

let GRAIN = null;
function grainTexture() {
  if (GRAIN) return GRAIN;
  const S = 256, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const img = g.createImageData(S, S);
  for (let i = 0; i < S * S; i++) {
    let v = 224 + (Math.random() - 0.5) * 30;
    if (Math.random() < 0.0045) v -= 45 + Math.random() * 45;   // luftporer
    const k = i * 4;
    img.data[k] = img.data[k + 1] = img.data[k + 2] = Math.max(0, Math.min(255, v));
    img.data[k + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // Litt utsmøring, ellers blir kornet ren pikselstøy når kamera går nær.
  g.globalAlpha = 0.5;
  g.filter = 'blur(1px)';
  g.drawImage(c, 0, 0);
  g.filter = 'none'; g.globalAlpha = 1;

  GRAIN = new THREE.CanvasTexture(c);
  GRAIN.wrapS = GRAIN.wrapT = THREE.RepeatWrapping;
  GRAIN.colorSpace = THREE.SRGBColorSpace;
  GRAIN.anisotropy = 8;
  return GRAIN;
}

// Ekte materialfarger: grå betong, blåaktig konstruksjonsstål, rustrød armering.
// De semantiske fargene (grønn/gul/rød) brukes bare når visningen settes til
// utnyttelse - ellers holder modellen seg til materialene.
const MAT = {
  concrete: (Lx, Ly) => {
    const t = grainTexture().clone();
    t.needsUpdate = true;
    t.repeat.set(Math.max(1, Lx / 350), Math.max(1, Ly / 350));  // ~1 flis pr. 350 mm
    return new THREE.MeshStandardMaterial({
      name: 'betong', color: 0xc3c0b8, map: t, bumpMap: t, bumpScale: 0.5,
      roughness: 1.0, metalness: 0.0,
      transparent: true, opacity: 0.5, side: THREE.DoubleSide,
      depthWrite: false,
    });
  },
  // Valset konstruksjonsstål er matt, ikke forkrommet: lav metalness og høy
  // ruhet, ellers får plata speilglans som ikke finnes i virkeligheten.
  plate: () => new THREE.MeshStandardMaterial({
    name: 'staalplate', color: 0x54606e, roughness: 0.72, metalness: 0.3,
    ...OVER_CONCRETE,
  }),
  steel: () => new THREE.MeshStandardMaterial({
    name: 'bolt', color: 0xaeb6bd, roughness: 0.55, metalness: 0.45,
    ...OVER_CONCRETE,
  }),
  cone: () => new THREE.MeshStandardMaterial({
    name: 'bruddkjegle', color: 0xd99a2b, roughness: 0.9, metalness: 0,
    transparent: true, opacity: 0.26, side: THREE.DoubleSide, depthWrite: false,
  }),
  wedge: () => new THREE.MeshStandardMaterial({
    name: 'kantbrudd', color: 0xc0524a, roughness: 0.9, metalness: 0,
    transparent: true, opacity: 0.24, side: THREE.DoubleSide, depthWrite: false,
  }),
  grout: () => new THREE.MeshStandardMaterial({
    name: 'gytemasse', color: 0xc2baa8, roughness: 0.96, metalness: 0.0,
  }),
  rebar: () => new THREE.MeshStandardMaterial({
    name: 'armering', color: 0x9e5232, roughness: 0.82, metalness: 0.15,
    ...OVER_CONCRETE,
  }),
};

// Utnyttelsesfarger stemt for lys bakgrunn - samme tre som i resultatpanelet.
function utilColor(u) {
  if (!Number.isFinite(u)) return new THREE.Color(0x9b958a);
  if (u <= 0.7) return new THREE.Color(0x6e9e4f);
  if (u <= 1.0) return new THREE.Color(0xc79030);
  return new THREE.Color(0xc0524a);
}

// --- smaa hjelpere ---------------------------------------------------------
function boxMesh(w, d, h, mat, name) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, d, h), mat);
  m.name = name; return m;
}

function polyMesh(verts, faces, mat, name) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts.flat(), 3));
  g.setIndex(faces.flat());
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.name = name; return m;
}

// Konturlinjer gjør de gjennomsiktige bruddlegemene lesbare gjennom betongen.
function outline(mesh, hex, opacity = 0.85) {
  const l = new THREE.LineSegments(
    new THREE.EdgesGeometry(mesh.geometry, 1),
    new THREE.LineBasicMaterial({ color: hex, transparent: true, opacity, depthTest: false }));
  l.userData.noExport = true;
  l.renderOrder = ORDER.outline;
  return l;
}

// Ingeniørkoordinat -> verdenskoordinat. Rotgruppa er rotert -90° om X,
// så (x, y, z) blir (x, z, -y). Påskriftene trenger punktet i verdensrommet
// for å kunne projiseres til skjerm.
const toW = (x, y, z) => new THREE.Vector3(x, z, -y);
const toWv = v => new THREE.Vector3(v.x, v.z, -v.y);

// Orientering for en påskrift som skal ligge i modellen. xA er lesretninga og
// yA er «opp» i tekstens eget plan; begge oppgis i ingeniørkoordinater.
function planeQuat(xA, yA) {
  const X = toWv(xA).normalize();
  const Y = toWv(yA).normalize();
  Y.addScaledVector(X, -Y.dot(X)).normalize();      // gjør Y vinkelrett på X
  const Z = new THREE.Vector3().crossVectors(X, Y);
  return new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(X, Y, Z));
}
const UP = new THREE.Vector3(0, 0, 1);

// --- målsetting ---------------------------------------------------------
// Målelinjene er geometri i modellen; selve verdien er en HTML-påskrift som
// verten plasserer, slik at den holder fast skriftstørrelse, står rett på
// skjermen uansett kameravinkel, og kan redigeres direkte.
const DIM_COLOR = 0x14120f;

// Skala for påskriftene: 1 CSS-piksel = 1 mm i modellen ved skala 1.
const HUD_SCALE = m => Math.max(m.concrete.Lx, m.concrete.Ly, 400) * 0.0026;
// Teksthøyden i modellens enheter (13 px skrift, linjehøyde 1,25, se style.css).
const TEXT_H = m => HUD_SCALE(m) * 16.25;

function dimension(group, hud, a0, b0, off, path, value, opts = {}) {
  // Snu målet så lesretninga alltid går mot +x, +y eller +z. Ellers står
  // teksten opp ned på halvparten av målene.
  const dv0 = b0.clone().sub(a0);
  const dom = Math.abs(dv0.x) >= Math.abs(dv0.y) && Math.abs(dv0.x) >= Math.abs(dv0.z)
    ? 'x' : Math.abs(dv0.y) >= Math.abs(dv0.z) ? 'y' : 'z';
  const [a, b] = dv0[dom] < 0 ? [b0, a0] : [a0, b0];

  const o = off.clone();
  const oN = o.clone().normalize();
  const L = o.length();
  const A2 = a.clone().add(o), B2 = b.clone().add(o);
  const dir = B2.clone().sub(A2).normalize();
  const span = B2.distanceTo(A2);
  const ah = opts.arrow;                       // pilspisslengde

  // Hjelpelinjer, fra litt utenfor målpunktet til litt forbi målelinja.
  const over = oN.clone().multiplyScalar(ah * 0.9);
  const gap = oN.clone().multiplyScalar(ah * 0.35);
  const pts = [
    a.clone().add(gap), A2.clone().add(over),
    b.clone().add(gap), B2.clone().add(over),
    A2, B2,
  ];
  const seg = new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: DIM_COLOR, transparent: true, opacity: 0.85 }));
  seg.userData.noExport = true;
  seg.renderOrder = ORDER.tag - 1;
  group.add(seg);

  // Fylte pilspisser i målets eget plan, som på en arbeidstegning. Er målet
  // kortere enn to pilspisser, snus de utover slik at de får plass.
  const inn = span > ah * 2.6 ? 1 : -1;
  const w = ah * 0.32;
  const tri = [];
  for (const [tip, s] of [[A2, 1], [B2, -1]]) {
    const base = tip.clone().addScaledVector(dir, s * inn * ah);
    tri.push(tip.clone(),
             base.clone().addScaledVector(oN, w),
             base.clone().addScaledVector(oN, -w));
  }
  const head = new THREE.Mesh(
    new THREE.BufferGeometry().setAttribute('position',
      new THREE.Float32BufferAttribute(tri.flatMap(v => [v.x, v.y, v.z]), 3)),
    new THREE.MeshBasicMaterial({ color: DIM_COLOR, side: THREE.DoubleSide }));
  head.name = 'maalpil';
  head.renderOrder = ORDER.tag - 1;
  group.add(head);

  // Teksten står midt på målelinja - eksakt, ingen forskyvning langs den - og
  // løftes vinkelrett klar av streken. Avstanden regnes fra teksthøyden, ikke
  // fra pilspissen: påskrifta er festet i midten, så den må minst ut halve
  // høyden sin før den slipper linja.
  const mid = A2.clone().add(B2).multiplyScalar(0.5)
    .addScaledVector(oN, opts.textOff);
  hud.push({ kind: 'dim', p: toW(mid.x, mid.y, mid.z),
             quat: planeQuat(dir, oN),
             path, value: Math.round(value * 10) / 10,
             step: opts.step ?? 10, min: opts.min ?? 1 });
}

function buildDimensions(m, mnt, zTop, hud) {
  const g = new THREE.Group();
  g.name = 'maal';
  const c = m.concrete, p = m.plate, a = m.anchors;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const S = Math.max(c.Lx, c.Ly);
  const arrow = S * 0.011;
  const textOff = TEXT_H(m) * 0.88;      // halve teksthøyden + et lite mellomrom
  const opt = extra => ({ arrow, textOff, ...extra });

  const x0 = -(c.Lx / 2 + c.ex), x1 = c.Lx / 2 - c.ex;
  const y0 = -(c.Ly / 2 + c.ey), y1 = c.Ly / 2 - c.ey;
  const zc = -c.h, D = S * 0.085;

  // Betongdelen måles for seg, ved underkant.
  dimension(g, hud, V(x0, y0, zc), V(x1, y0, zc), V(0, -D, 0),
    'concrete.Lx', c.Lx, opt());
  dimension(g, hud, V(x1, y0, zc), V(x1, y1, zc), V(D, 0, 0),
    'concrete.Ly', c.Ly, opt());
  dimension(g, hud, V(x1, y0, 0), V(x1, y0, zc), V(D * 0.75, -D * 0.75, 0),
    'concrete.h', c.h, opt());

  // Plata og boltavstandene hører sammen og måles i samme område, i platas
  // plan: plata innerst, boltkjeden like utenfor.
  const pos = anchorPositions(m);
  const bxs = [...new Set(pos.map(q => q.x))].sort((u, w) => u - w);
  const bys = [...new Set(pos.map(q => q.y))].sort((u, w) => u - w);
  const P = Math.max(p.bx, p.by);
  const g1 = P * 0.30, g2 = P * 0.68;

  dimension(g, hud, V(-p.bx / 2, -p.by / 2, zTop), V(p.bx / 2, -p.by / 2, zTop),
    V(0, -g1, 0), 'plate.bx', p.bx, opt());
  dimension(g, hud, V(p.bx / 2, -p.by / 2, zTop), V(p.bx / 2, p.by / 2, zTop),
    V(g1, 0, 0), 'plate.by', p.by, opt());

  // Kjede fra platekant til platekant. Segmentet mellom to bolter er selve
  // senteravstanden og kan redigeres; kantsegmentene er avledet.
  const chain = (vals, boltSet, along, path, n) => {
    const c2 = [...new Set(vals)].sort((u, w) => u - w);
    for (let i = 0; i < c2.length - 1; i++) {
      const bolts = boltSet.includes(c2[i]) && boltSet.includes(c2[i + 1]);
      along(c2[i], c2[i + 1], (bolts && n > 1) ? path : null, c2[i + 1] - c2[i]);
    }
  };
  chain([-p.bx / 2, ...bxs, p.bx / 2], bxs,
    (u, w, path, val) => dimension(g, hud,
      V(u, -p.by / 2, zTop), V(w, -p.by / 2, zTop), V(0, -g2, 0), path, val, opt()),
    'anchors.sx', a.nx);
  chain([-p.by / 2, ...bys, p.by / 2], bys,
    (u, w, path, val) => dimension(g, hud,
      V(p.bx / 2, u, zTop), V(p.bx / 2, w, zTop), V(g2, 0, 0), path, val, opt()),
    'anchors.sy', a.ny);

  dimension(g, hud, V(-p.bx / 2, -p.by / 2, mnt.offset + p.t),
    V(-p.bx / 2, -p.by / 2, mnt.offset), V(-g1 * 0.5, -g1 * 0.5, 0),
    'plate.t', p.t, opt({ step: 1 }));

  dimension(g, hud, V(bxs[0], bys[bys.length - 1], 0), V(bxs[0], bys[bys.length - 1], -a.hef),
    V(-P * 0.55, P * 0.55, 0), 'anchors.hef', a.hef, opt({ step: 5 }));

  return g;
}

function loadMat(hex, active) {
  return new THREE.MeshStandardMaterial({
    name: active ? 'last' : 'last_null', color: hex,
    roughness: 0.55, metalness: 0.05,
    transparent: !active, opacity: active ? 1 : 0.2, depthWrite: active,
  });
}

function forceArrow(tail, dir, len, hex, active = true) {
  const g = new THREE.Group();
  g.name = active ? 'kraftpil' : 'kraftpil_null';
  const mat = loadMat(hex, active);
  const headL = len * 0.34, shaftL = len - headL;
  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(len * 0.030, len * 0.030, shaftL, 16), mat);
  shaft.position.y = shaftL / 2;
  const head = new THREE.Mesh(new THREE.ConeGeometry(len * 0.095, headL, 20), mat);
  head.position.y = shaftL + headL / 2;
  shaft.renderOrder = head.renderOrder = ORDER.load;
  g.add(shaft, head);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  g.position.copy(tail);
  return g;
}

// Momentpil: bue rundt aksen med kjegle tangentielt i enden. Omløpsretninga
// følger høyrehåndsregelen - negativt moment sendes inn som negativ akse.
function momentArrow(pos, axis, R, tube, hex, active = true) {
  const g = new THREE.Group();
  g.name = active ? 'momentpil' : 'momentpil_null';
  const mat = loadMat(hex, active);
  const sweep = Math.PI * 1.45;
  const arc = new THREE.Mesh(new THREE.TorusGeometry(R, tube, 12, 56, sweep), mat);
  const head = new THREE.Mesh(new THREE.ConeGeometry(tube * 3.2, tube * 9, 18), mat);
  head.position.set(R * Math.cos(sweep), R * Math.sin(sweep), 0);
  head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0),
    new THREE.Vector3(-Math.sin(sweep), Math.cos(sweep), 0));
  arc.renderOrder = head.renderOrder = ORDER.load;
  g.add(arc, head);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), axis.clone().normalize());
  g.position.copy(pos);
  return g;
}

// Stiplet akse: tynn svart strek uten tykkelse. Aksene ligger nå utenfor
// betongen, over lys bakgrunn, så en 1 px linje leses fint - og holder seg
// diskret slik en hjelpelinje skal.
function dashedAxis(origin, dir, len) {
  const l = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(
      [origin.clone(), origin.clone().addScaledVector(dir, len)]),
    new THREE.LineDashedMaterial({ color: 0x14120f, dashSize: len * 0.022,
      gapSize: len * 0.018, transparent: true, opacity: 0.75 }));
  l.computeLineDistances();
  l.name = 'akse';
  l.userData.noExport = true;
  return l;
}

// Aksetriade for lastene. Én stiplet linje pr. akse ut fra platesenteret, med
// kraft og moment for den aksen samlet ute ved enden - i stedet for store
// piler oppå selve forbindelsen.
const AXIS_COLOR = { x: 0x3f8f4a, y: 0xc0443c, z: 0x2f6fb5 };   // grønn, rød, blå
const AXIS_TEXT = { x: '#2f7038', y: '#a33a33', z: '#255a94' };

function loadTriad(m, zTop, hud) {
  const g = new THREE.Group();
  g.name = 'laster';
  const L = m.load, c = m.concrete;
  const S = Math.max(c.Lx, c.Ly);

  // Aksene i x og y føres forbi betongkanten, slik at pil og momentbue står
  // fritt utenfor klossen i stedet for å legge seg oppå den.
  const margin = S * 0.10;
  const lenX = (c.Lx / 2 - c.ex) + margin;
  const lenY = (c.Ly / 2 - c.ey) + margin;
  const lenZ = S * 0.30;

  const aL = S * 0.11;        // pillengde
  const R = S * 0.052;        // momentbuens radius
  const tube = S * 0.0055;

  const o = new THREE.Vector3(0, 0, zTop + Math.max(5, S * 0.006));

  const axes = [
    // mU/mV spenner ut planet momentbuen ligger i - det står vinkelrett på
    // aksen, så momentverdien legges i samme plan som buen den hører til.
    { k: 'x', dir: new THREE.Vector3(1, 0, 0), len: lenX,
      mU: new THREE.Vector3(0, 1, 0), mV: new THREE.Vector3(0, 0, 1),
      F: L.Vx, Fp: 'load.Vx', M: L.Mx, Mp: 'load.Mx' },
    { k: 'y', dir: new THREE.Vector3(0, 1, 0), len: lenY,
      mU: new THREE.Vector3(1, 0, 0), mV: new THREE.Vector3(0, 0, 1),
      F: L.Vy, Fp: 'load.Vy', M: L.My, Mp: 'load.My' },
    { k: 'z', dir: new THREE.Vector3(0, 0, 1), len: lenZ,
      mU: new THREE.Vector3(1, 0, 0), mV: new THREE.Vector3(0, 1, 0),
      F: L.N,  Fp: 'load.N',  M: L.Mz, Mp: 'load.Mz' },
  ];

  for (const a of axes) {
    const col = AXIS_COLOR[a.k];
    g.add(dashedAxis(o, a.dir, a.len));

    // Moment om aksen, plassert der kraftpila starter. Omløpet følger
    // høyrehåndsregelen; null vises bleknet i positiv retning.
    const mOn = Math.abs(a.M) > 1;
    g.add(momentArrow(o.clone().addScaledVector(a.dir, a.len),
      a.dir.clone().multiplyScalar(mOn && a.M < 0 ? -1 : 1), R, tube, col, mOn));

    const fOn = Math.abs(a.F) > 1;
    const fwd = !fOn || a.F > 0;
    g.add(forceArrow(o.clone().addScaledVector(a.dir, fwd ? a.len : a.len + aL),
      a.dir.clone().multiplyScalar(fwd ? 1 : -1), aL, col, fOn));

    // Bare tallet og enheten: hvilken komponent det er, framgår av hvor den
    // står. Kraftverdien legges i planet langs aksen, ved kraftpila.
    // Langs z ville lesretninga blitt loddrett. Da peker den nesten rett inn i
    // skjermen sett ovenfra, og snuingen vipper fram og tilbake. Teksten legges
    // derfor vannrett ved den loddrette pila.
    const X = new THREE.Vector3(1, 0, 0);
    const up = a.k === 'z' ? X : UP;
    const fq = a.k === 'z' ? planeQuat(X, UP) : planeQuat(a.dir, UP);
    const fp = o.clone().addScaledVector(a.dir, a.len + aL * 0.62)
      .addScaledVector(up, R * 0.85);
    hud.push({ kind: 'load', quat: fq, color: AXIS_TEXT[a.k],
      p: toW(fp.x, fp.y, fp.z),
      path: a.Fp, value: a.F, scale: 1000, unit: 'kN', dec: 2, step: 1 });

    // Momentverdien legges i buens eget plan, like utenfor buen.
    const mp = o.clone().addScaledVector(a.dir, a.len)
      .addScaledVector(a.mV, R * 1.55);
    hud.push({ kind: 'load', quat: planeQuat(a.mU, a.mV), color: AXIS_TEXT[a.k],
      p: toW(mp.x, mp.y, mp.z),
      path: a.Mp, value: a.M, scale: 1e6, unit: 'kNm', dec: 3, step: 0.5 });
  }
  return g;
}

// --- hovedbygger -----------------------------------------------------------
function buildScene(v, opts = {}) {
  const show = { concrete: true, cone: true, wedge: true, loads: true,
                 labels: true, rebar: true, plate: true, dims: true,
                 colorMode: 'material', ...opts };
  const byUtil = show.colorMode === 'utilisation';
  const m = v.model, res = v.res;
  const hud = [];                     // HTML-påskrifter verten plasserer
  const root = new THREE.Group();
  root.name = 'forankring';
  root.rotation.x = -Math.PI / 2;      // ingenioer-z -> Three-y

  const c = m.concrete, p = m.plate, a = m.anchors;

  // ---- betongdel --------------------------------------------------------
  if (show.concrete) {
    const bl = boxMesh(c.Lx, c.Ly, c.h, MAT.concrete(c.Lx, c.Ly), 'betong');
    bl.position.set(-c.ex, -c.ey, -c.h / 2);
    root.add(bl);
    const eg = new THREE.LineSegments(
      new THREE.EdgesGeometry(bl.geometry),
      new THREE.LineBasicMaterial({ color: 0x8a857a, transparent: true, opacity: 0.55 }));
    eg.position.copy(bl.position);
    eg.userData.noExport = true;
    root.add(eg);
  }

  // ---- undergyting ------------------------------------------------------
  const mnt = mounting(m);
  if (mnt.kind === 'grout' && mnt.offset > 0) {
    const ov = 25;   // gytesjiktet stikker litt utenfor plata
    const gr = boxMesh(p.bx + 2 * ov, p.by + 2 * ov, mnt.offset, MAT.grout(), 'gytemasse');
    gr.position.set(0, 0, mnt.offset / 2);
    root.add(gr);
  }

  // ---- stålplate --------------------------------------------------------
  if (show.plate) {
    const pl = boxMesh(p.bx, p.by, p.t, MAT.plate(), 'forankringsplate');
    pl.position.set(0, 0, mnt.offset + p.t / 2);
    pl.renderOrder = ORDER.steel;
    root.add(pl);
  }

  // ---- bolter -----------------------------------------------------------
  const utilByAnchor = anchorUtil(v);
  const zTop = mnt.offset + p.t;
  const steelMat = MAT.steel();
  for (const an of res.anchors) {
    const u = utilByAnchor.get(an.id) ?? 0;
    const mat = byUtil
      ? new THREE.MeshStandardMaterial({
          name: `bolt_u${Math.round(u * 100)}`, color: utilColor(u),
          roughness: 0.62, metalness: 0.2, ...OVER_CONCRETE })
      : steelMat;
    const g = new THREE.Group();
    g.name = `bolt_${an.id}`;

    // Sveist bolt slutter ved platas underside og har en sveisekrage der.
    // Gjennomboltet bolt går gjennom plata og får skive og mutter over.
    const welded = a.attachment !== 'bolted';
    const nutH = 0.8 * a.d, nutR = 0.87 * a.d;      // sekskantmutter, ca. M-serie
    const washT = 0.16 * a.d, washR = 1.1 * a.d;
    const shaftTop = welded ? mnt.offset
                            : zTop + washT + nutH + 0.3 * a.d;
    const zBot = -a.hef + a.k;                      // underkant skaft = overkant hode
    const shaftLen = shaftTop - zBot;

    const cyl = (r, h, seg = 24) => new THREE.CylinderGeometry(r, r, h, seg);
    const put = (mesh, z, name) => {
      mesh.rotation.x = Math.PI / 2;
      mesh.position.set(an.x, an.y, z);
      mesh.renderOrder = ORDER.steel;
      mesh.name = `${name}_${an.id}`;
      g.add(mesh);
      return mesh;
    };

    put(new THREE.Mesh(cyl(a.d / 2, shaftLen), mat), zBot + shaftLen / 2, 'skaft');
    // Hodet tegnes fra modellens egne verdier, ikke fra standardtabellen,
    // slik at en redigert hodediameter faktisk vises.
    put(new THREE.Mesh(cyl(a.dh / 2, a.k), mat), -a.hef + a.k / 2, 'hode');

    if (welded) {
      // Sveisekrage: videst inntil plata, smalner av nedover.
      const wh = 0.35 * a.d;
      put(new THREE.Mesh(
        new THREE.CylinderGeometry(0.85 * a.d, 0.55 * a.d, wh, 20), mat),
        mnt.offset - wh / 2, 'sveis');
    } else {
      put(new THREE.Mesh(cyl(washR, washT), mat), zTop + washT / 2, 'skive');
      put(new THREE.Mesh(cyl(nutR, nutH, 6), mat), zTop + washT + nutH / 2, 'mutter');
      // Ved avstandsmontasje står plata på justeringsmuttere.
      if (mnt.kind === 'standoff' && mnt.offset > nutH) {
        put(new THREE.Mesh(cyl(nutR, nutH, 6), mat), mnt.offset - nutH / 2, 'justermutter');
        put(new THREE.Mesh(cyl(washR, washT), mat),
          mnt.offset - nutH - washT / 2, 'justerskive');
      }
    }

    if (show.labels) {
      hud.push({ kind: 'value', p: toW(an.x, an.y, zTop + Math.max(70, p.bx * 0.30)),
        quat: planeQuat(new THREE.Vector3(1, 0, 0), UP),
        text: `${an.N > 1 ? n(an.N / 1000, 1) + ' kN' : '–'} │ ${n(an.V / 1000, 1)} kN`,
        color: byUtil ? '#' + utilColor(u).getHexString() : '#2b2924' });
    }
    root.add(g);
  }

  // ---- bruddkjegle i strekk --------------------------------------------
  const cone = v.checks.find(k => k.id === 'N-cone');
  if (show.cone && res.tension.anchors.length && cone && Number.isFinite(cone.NRd)) {
    const ccr = 1.5 * a.hef;
    const xs = res.tension.anchors.map(t => t.x), ys = res.tension.anchors.map(t => t.y);
    const b = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
    const lim = memberLimits(m);
    const t = {
      x0: Math.max(b.x0 - ccr, lim.x0), x1: Math.min(b.x1 + ccr, lim.x1),
      y0: Math.max(b.y0 - ccr, lim.y0), y1: Math.min(b.y1 + ccr, lim.y1),
    };
    const zB = -a.hef, zT = 0;
    const V = [
      [b.x0, b.y0, zB], [b.x1, b.y0, zB], [b.x1, b.y1, zB], [b.x0, b.y1, zB],
      [t.x0, t.y0, zT], [t.x1, t.y0, zT], [t.x1, t.y1, zT], [t.x0, t.y1, zT],
    ];
    const F = [[0,1,5],[0,5,4],[1,2,6],[1,6,5],[2,3,7],[2,7,6],[3,0,4],[3,4,7],
               [4,5,6],[4,6,7]];
    const cm = polyMesh(V, F, MAT.cone(), 'bruddkjegle');
    cm.renderOrder = 3;
    root.add(cm, outline(cm, 0xffa53d));
  }

  // ---- kantbrudd-kile ---------------------------------------------------
  const edge = v.checks.find(k => k.id?.startsWith('V-edge'));
  if (show.wedge && edge && Number.isFinite(edge.NRd) && edge.util > 0) {
    const w = edgeWedge(m, res, edge.edgeDir);
    if (w) {
      const wm = polyMesh(w.V, w.F, MAT.wedge(), 'kantbrudd');
      wm.renderOrder = 3;
      root.add(wm, outline(wm, 0xff5f56));
    }
  }

  // ---- forankringsarmering ---------------------------------------------
  if (show.rebar && m.code.supplementaryReinf && m.reinf) {
    const r = m.reinf, rm = MAT.rebar();
    const pts = anchorPositions(m);
    const per = Math.max(1, Math.round(r.n / pts.length));
    for (const pt of pts) {
      for (let i = 0; i < per; i++) {
        const ang = (i / per) * Math.PI * 2;
        const off = a.d / 2 + r.ds / 2 + 6;
        const bar = new THREE.Mesh(
          new THREE.CylinderGeometry(r.ds / 2, r.ds / 2, r.l1, 12), rm);
        bar.rotation.x = Math.PI / 2;
        bar.position.set(pt.x + Math.cos(ang) * off, pt.y + Math.sin(ang) * off,
          -a.hef + r.l1 / 2);
        bar.name = 'armering';
        bar.renderOrder = ORDER.steel;
        root.add(bar);
      }
    }
  }

  // ---- laster -----------------------------------------------------------
  if (show.loads) root.add(loadTriad(m, zTop, hud));

  // ---- målsetting -------------------------------------------------------
  if (show.dims) root.add(buildDimensions(m, mnt, zTop, hud));

  // 1 CSS-piksel = 1 mm i modellen ved skala 1. Skalaen settes slik at
  // teksten holder samme andel av modellen uansett hvor stor den er.
  const hudScale = HUD_SCALE(m);
  return { root, hud, hudScale };
}

function memberLimits(m) {
  const c = m.concrete;
  return {
    x0: c.freeEdges.xNeg ? -(c.Lx / 2 + c.ex) : -1e6,
    x1: c.freeEdges.xPos ? (c.Lx / 2 - c.ex) : 1e6,
    y0: c.freeEdges.yNeg ? -(c.Ly / 2 + c.ey) : -1e6,
    y1: c.freeEdges.yPos ? (c.Ly / 2 - c.ey) : 1e6,
  };
}

// Kantbruddlegemet: kile fra forreste boltrad ut til kantflata.
function edgeWedge(m, res, dir) {
  if (!dir) return null;
  const all = anchorPositions(m);
  const ds = all.map(p => edgeDistances(m, p.x, p.y)[dir]);
  const c1 = Math.min(...ds);
  if (!Number.isFinite(c1)) return null;
  const front = all.filter((p, i) => Math.abs(ds[i] - c1) < 1e-6);
  const lim = memberLimits(m);
  const hv = -Math.min(1.5 * c1, m.concrete.h);
  const axisX = dir.startsWith('x');
  const face = dir === 'xPos' ? lim.x1 : dir === 'xNeg' ? lim.x0
             : dir === 'yPos' ? lim.y1 : lim.y0;
  const t = p => (axisX ? p.y : p.x);
  const tl = Math.max(Math.min(...front.map(t)) - 1.5 * c1, axisX ? lim.y0 : lim.x0);
  const th = Math.min(Math.max(...front.map(t)) + 1.5 * c1, axisX ? lim.y1 : lim.x1);
  const al = Math.min(...front.map(t)), ah = Math.max(...front.map(t));
  const ax = axisX ? front[0].x : front[0].y;    // boltradens posisjon i lastretning

  const P = (u, w, z) => axisX ? [u, w, z] : [w, u, z];
  const V = [
    P(face, tl, 0), P(face, th, 0), P(face, th, hv), P(face, tl, hv),   // kantflata
    P(ax, al, 0), P(ax, ah, 0), P(ax, ah, hv), P(ax, al, hv),           // boltlinja
  ];
  const F = [[0,1,5],[0,5,4],[3,7,6],[3,6,2],[0,4,7],[0,7,3],[1,2,6],[1,6,5],
             [4,5,6],[4,6,7],[0,3,2],[0,2,1]];
  return { V, F };
}

// Utnyttelse pr. bolt (staal + uttrekk, det verste)
function anchorUtil(v) {
  const map = new Map();
  const perAnchor = v.checks.filter(c => c.scope === 'bolt' && Number.isFinite(c.NRd));
  const grp = v.checks.filter(c => c.scope === 'gruppe' && Number.isFinite(c.util));
  const gmax = grp.length ? Math.max(...grp.map(c => c.util)) : 0;
  for (const a of v.res.anchors) {
    let u = gmax;
    for (const c of perAnchor) {
      const Ed = c.id.startsWith('N') ? a.N : a.V;
      u = Math.max(u, Ed / c.NRd);
    }
    map.set(a.id, u);
  }
  return map;
}

      hint: 'Settes automatisk når antallet endres. Egen verdi står til du ' +

    { p: 'reinf.fyk', l: 'f_yk', t: 'num', u: 'MPa', step: 50 },
